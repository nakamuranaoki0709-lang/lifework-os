<!-- Todayページ用：Googleカレンダー本日の予定 -->
<div id="homeCalendarCard" class="card-surface p-3 space-y-1.5">
  <div class="flex items-center justify-between border-b border-slate-100 pb-1">
    <div class="flex items-center gap-1.5">
      <button type="button" onclick="fetchAndRenderHomeCalendar(true)" class="text-[9px] text-slate-400 hover:text-slate-900 px-1.5 py-0.5 rounded bg-slate-100 transition" title="予定を再取得">
        <i id="calRefreshIcon" class="fa-solid fa-rotate text-[8px]"></i>
      </button>
      <h2 class="font-semibold text-[10px] text-slate-600 uppercase tracking-wider">Schedule</h2>
    </div>
  </div>
  <div id="homeCalendarEventsArea" class="space-y-1 text-xs"></div>
</div>

<!-- Todayページ用：本日のタスク -->
<div id="homeTodoCard" class="card-surface p-3 space-y-1.5">
  <div class="flex items-center justify-between border-b border-slate-100 pb-1">
    <div class="flex items-center gap-1.5">
      <h2 class="font-semibold text-[10px] text-slate-600 uppercase tracking-wider">Today's Tasks</h2>
      <span id="homeTodoCountBadge" class="text-[9px] font-mono bg-slate-100 text-slate-600 px-1.5 py-0.2 rounded">0</span>
    </div>
    <button type="button" onclick="switchView('todo')" class="text-[9px] font-semibold text-slate-600 hover:text-slate-900">
      タスク管理へ →
    </button>
  </div>

  <form onsubmit="quickAddHomeTodo(event)" class="flex items-center gap-1">
    <button type="submit" class="px-2 py-1 bg-slate-900 hover:bg-slate-800 text-white rounded-md text-[10px] font-bold shrink-0">+ 追加</button>
    <select id="homeQuickTodoDomain" class="px-1.5 py-1 border border-slate-200 rounded-md text-[10px] font-semibold bg-white text-slate-700 max-w-[96px]"></select>
    <input type="text" id="homeQuickTodoInput" placeholder="タスク入力（#タグ可）..." class="flex-1 min-w-0 px-2 py-1 border border-slate-200 rounded-md text-xs bg-slate-50 focus:bg-white outline-none focus:border-slate-900">
  </form>

  <div id="homeTodoListArea" class="space-y-1"></div>
</div>

<!-- タスクタブ専用ワークスペース -->
<div id="fullTodoManagerSection" class="space-y-2.5">
  <div class="card-surface p-3 space-y-2">
    <div class="flex items-center justify-between border-b border-slate-100 pb-1.5">
      <div class="flex items-center gap-2">
        <h2 class="font-semibold text-xs text-slate-900 uppercase tracking-wider">Tasks</h2>
        <span id="todoTotalStatsBadge" class="text-[10px] font-mono text-slate-500">未完了 0件</span>
      </div>
      <button type="button" onclick="openMasterOptionManager('todoProjects')" class="text-[10px] font-semibold text-slate-500 hover:text-slate-900 px-1.5 py-0.5 rounded bg-slate-100">
        <i class="fa-solid fa-gear mr-0.5"></i>領域設定
      </button>
    </div>

    <form id="fullTodoAddForm" onsubmit="addFullTodoItem(event)" class="bg-slate-50/90 p-2 rounded-xl border border-slate-200 space-y-1.5">
      <div class="flex items-center gap-1">
        <button type="submit" class="h-7 px-2.5 bg-slate-900 hover:bg-slate-800 active:scale-95 text-white font-bold rounded-md text-[11px] shrink-0 transition">
          + 追加
        </button>
        <input type="text" id="fullTodoTitleInput" placeholder="新しいタスクを入力（#タグも可）..." class="h-7 flex-1 min-w-0 px-2 border border-slate-200 rounded-md bg-white text-xs font-semibold outline-none focus:border-slate-900">
      </div>

      <div class="flex items-center gap-1 flex-wrap text-[10px]">
        <select id="fullTodoProjectSelect" class="h-6 px-1.5 border border-slate-200 rounded bg-white font-bold text-slate-800 outline-none"></select>

        <div class="flex items-center bg-white border border-slate-200 rounded h-6 px-1" title="重要度">
          <i class="fa-solid fa-star text-amber-500 text-[9px] mr-1"></i>
          <select id="fullTodoImpSelect" class="font-bold text-slate-900 bg-transparent outline-none">
            <option value="high" selected>高</option>
            <option value="mid">● 中</option>
            <option value="low">▽ 低</option>
          </select>
        </div>

        <div class="flex items-center bg-white border border-slate-200 rounded h-6 px-1" title="緊急度">
          <i class="fa-solid fa-bolt text-rose-500 text-[9px] mr-1"></i>
          <select id="fullTodoUrgSelect" class="font-bold text-slate-900 bg-transparent outline-none">
            <option value="high">★ 高</option>
            <option value="mid" selected>中</option>
            <option value="low">▽ 低</option>
          </select>
        </div>

        <button type="button" onclick="toggleTodoExtraFields()" class="h-6 px-1.5 rounded border border-slate-200 bg-white text-slate-600 hover:text-slate-900 font-semibold">
          日程・#タグ
        </button>
      </div>

      <div id="todoExtraFieldsRow" class="space-y-1.5 hidden pt-0.5">
        <div class="grid grid-cols-2 gap-1 text-[10px]">
          <div class="flex items-center gap-1 bg-white border border-slate-200 rounded px-1.5 py-0.5">
            <span class="text-slate-400 shrink-0">開始</span>
            <input type="date" id="fullTodoStartInput" class="w-full font-mono text-[9px] text-slate-800 bg-transparent outline-none">
          </div>
          <div class="flex items-center gap-1 bg-white border border-slate-200 rounded px-1.5 py-0.5">
            <span class="text-slate-400 shrink-0">終了</span>
            <input type="date" id="fullTodoDueInput" class="w-full font-mono text-[9px] text-slate-800 bg-transparent outline-none">
          </div>
        </div>
        <input type="text" id="fullTodoTagsInput" placeholder="#ハッシュタグ（例: #資料 #重要）" class="w-full px-2 py-1 border border-slate-200 rounded bg-white text-[10px] font-mono outline-none">
        <div id="addTodoTagPickerArea" class="flex items-center gap-1 flex-wrap"></div>
      </div>
    </form>

    <div class="grid grid-cols-4 gap-1 bg-slate-100 p-0.5 rounded-lg text-[10px] font-semibold" id="todoViewModeTabs">
      <button type="button" data-tvmode="list" onclick="setTodoDisplayMode('list')" class="py-1 rounded-md bg-white text-slate-900 shadow-2xs transition">リスト</button>
      <button type="button" data-tvmode="matrix" onclick="setTodoDisplayMode('matrix')" class="py-1 rounded-md text-slate-500 hover:text-slate-900 transition">重要×緊急</button>
      <button type="button" data-tvmode="kanban" onclick="setTodoDisplayMode('kanban')" class="py-1 rounded-md text-slate-500 hover:text-slate-900 transition">カンバン</button>
      <button type="button" data-tvmode="gantt" onclick="setTodoDisplayMode('gantt')" class="py-1 rounded-md text-slate-500 hover:text-slate-900 transition">ガント</button>
    </div>

    <div class="space-y-1">
      <div class="flex items-center gap-1 flex-wrap text-[10px]" id="todoDynamicProjectFilterBar"></div>
      <div class="flex items-center gap-1 flex-wrap text-[9px]" id="todoHashtagFilterBar"></div>
    </div>

    <div id="fullTodoListArea" class="space-y-1"></div>
  </div>
</div>

<!-- タスク＆サブタスク統合編集ポップアップモーダル -->

  <div class="bg-white w-full max-w-md max-h-[88vh] overflow-y-auto rounded-2xl border border-slate-200 shadow-2xl p-3.5 space-y-2.5">
    <div class="flex items-center justify-between border-b border-slate-100 pb-1.5">
      <h3 class="text-xs font-bold text-slate-900">タスク詳細・サブタスク編集</h3>
      <button type="button" onclick="closeTodoEditModal()" class="w-6 h-6 rounded-md bg-slate-100 text-slate-600 hover:text-slate-900 text-xs flex items-center justify-center">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>

    <input type="hidden" id="modalEditTodoId" value="">

    <div class="space-y-2 text-xs">
      <div>
        <label class="block text-[9px] font-bold text-slate-500 mb-0.5">タスク名</label>
        <input type="text" id="modalEditTodoTitle" class="w-full px-2.5 py-1.5 border border-slate-200 rounded-lg font-bold text-slate-900 outline-none focus:border-slate-900">
      </div>

      <div class="grid grid-cols-3 gap-1.5">
        <div>
          <label class="block text-[9px] font-bold text-slate-500 mb-0.5">領域</label>
          <select id="modalEditTodoProject" class="w-full px-1.5 py-1.5 border border-slate-200 rounded-lg text-[11px] font-bold bg-white"></select>
        </div>
        <div>
          <label class="block text-[9px] font-bold text-slate-500 mb-0.5">重要度</label>
          <select id="modalEditTodoImp" class="w-full px-1.5 py-1.5 border border-slate-200 rounded-lg text-[11px] font-bold bg-white">
            <option value="high">★ 高</option>
            <option value="mid">● 中</option>
            <option value="low">▽ 低</option>
          </select>
        </div>
        <div>
          <label class="block text-[9px] font-bold text-slate-500 mb-0.5">緊急度</label>
          <select id="modalEditTodoUrg" class="w-full px-1.5 py-1.5 border border-slate-200 rounded-lg text-[11px] font-bold bg-white">
            <option value="high">★ 高</option>
            <option value="mid">● 中</option>
            <option value="low">▽ 低</option>
          </select>
        </div>
      </div>

      <div class="grid grid-cols-2 gap-1.5">
        <div>
          <label class="block text-[9px] font-bold text-slate-500 mb-0.5">開始日</label>
          <input type="date" id="modalEditTodoStart" class="w-full px-2 py-1 border border-slate-200 rounded-lg font-mono text-[11px]">
        </div>
        <div>
          <label class="block text-[9px] font-bold text-slate-500 mb-0.5">終了日（締切）</label>
          <input type="date" id="modalEditTodoDue" class="w-full px-2 py-1 border border-slate-200 rounded-lg font-mono text-[11px]">
        </div>
      </div>

      <div>
        <label class="block text-[9px] font-bold text-slate-500 mb-0.5">ハッシュタグ（タップで既存タグ挿入）</label>
        <input type="text" id="modalEditTodoTags" placeholder="#タグ1 #タグ2" class="w-full px-2.5 py-1 border border-slate-200 rounded-lg font-mono text-[11px] outline-none focus:border-slate-900">
        <div id="modalTodoTagPicker" class="flex items-center gap-1 flex-wrap mt-1"></div>
      </div>

      <div class="flex items-center gap-1.5 pt-1">
        <button type="button" onclick="saveTodoEditModal()" class="flex-1 py-1.5 bg-slate-900 hover:bg-slate-800 text-white font-bold rounded-lg text-xs">
          変更を保存
        </button>
        <button type="button" onclick="deleteTodoFromModal()" class="px-3 py-1.5 bg-rose-50 text-rose-600 border border-rose-200 font-bold rounded-lg text-xs">
          削除
        </button>
      </div>
    </div>

    <div class="pt-2.5 border-t border-slate-200 space-y-2">
      <div class="flex items-center justify-between">
        <span class="text-[10px] font-bold text-slate-800">サブタスク（重要度・緊急度・期間・タグ対応）</span>
      </div>

      <div class="bg-slate-50 p-2 rounded-xl border border-slate-200 space-y-1.5">
        <div class="flex items-center gap-1">
          <button type="button" onclick="addRichSubtaskFromModal()" class="px-2.5 py-1 bg-slate-900 text-white rounded-md text-[10px] font-bold shrink-0">+ 追加</button>
          <input type="text" id="modalNewSubTitle" placeholder="サブタスク名を入力..." class="flex-1 min-w-0 px-2 py-1 border border-slate-200 rounded-md text-xs bg-white outline-none">
          <button type="button" onclick="toggleModalSubDetailFields()" class="px-1.5 py-1 rounded border border-slate-200 bg-white text-[9px] font-semibold text-slate-600 shrink-0">詳細</button>
        </div>

        <div id="modalNewSubDetailBox" class="space-y-1.5 hidden pt-1 border-t border-slate-200/70 text-[10px]">
          <div class="grid grid-cols-2 gap-1">
            <select id="modalNewSubImp" class="px-1.5 py-1 border border-slate-200 rounded bg-white font-bold">
              <option value="mid">重要度: ● 中</option>
              <option value="high">重要度: ★ 高</option>
              <option value="low">重要度: ▽ 低</option>
            </select>
            <select id="modalNewSubUrg" class="px-1.5 py-1 border border-slate-200 rounded bg-white font-bold">
              <option value="mid">緊急度: ◆ 中</option>
              <option value="high">緊急度: ▲ 高</option>
              <option value="low">緊急度: － 低</option>
            </select>
          </div>
          <div class="grid grid-cols-2 gap-1">
            <input type="date" id="modalNewSubStart" class="px-1.5 py-0.5 border border-slate-200 rounded font-mono text-[9px] bg-white">
            <input type="date" id="modalNewSubDue" class="px-1.5 py-0.5 border border-slate-200 rounded font-mono text-[9px] bg-white">
          </div>
          <input type="text" id="modalNewSubTags" placeholder="サブタスク用 #タグ" class="w-full px-2 py-1 border border-slate-200 rounded font-mono text-[10px] bg-white">
        </div>
      </div>

      <div id="modalSubtaskListArea" class="space-y-1.5"></div>
    </div>
  </div>
</div>

<script>
  App.mount('#slot-home-calendar', 'homeCalendarCard');
  App.mount('#slot-home-todo', 'homeTodoCard');
  App.mount('#slot-todo-main', 'fullTodoManagerSection');

  var KEY_LOCAL_TODOS = 'worklife_os_todos_v3';
  var KEY_TODAY_LAYOUT = 'worklife_os_today_layout_v4';
  var currentTodoDisplayMode = 'list';
  var currentTodoProjectFilter = 'all';
  var currentTodoTagFilter = '';
  var currentGanttScale = 'week';
  var showCompletedTodosFlag = false;
  var calendarCacheByDate = {};

  function stripHashtagsFromTitle(text) {
    var cleaned = String(text || '').replace(/(?:^|\s+)#[^\s#、。,.!?！？]+/g, '').replace(/\s{2,}/g, ' ').trim();
    return cleaned || String(text || '').trim();
  }

  function getImpUrgIcons(imp, urg) {
    var impIcon = (imp === 'high')
      ? '<i class="fa-solid fa-star text-amber-500" title="重要度:高"></i>'
      : (imp === 'low'
        ? '<i class="fa-solid fa-angle-down text-slate-300" title="重要度:低"></i>'
        : '<i class="fa-solid fa-circle-dot text-slate-400" title="重要度:中"></i>');

    var urgIcon = (urg === 'high')
      ? '<i class="fa-solid fa-bolt text-rose-500" title="緊急度: ▲ 高"></i>'
      : (urg === 'low'
        ? '<i class="fa-solid fa-minus text-slate-300" title="緊急度: － 低"></i>'
        : '<i class="fa-regular fa-clock text-sky-500" title="緊急度: ◆ 中"></i>');

    var ring = (imp === 'high' && urg === 'high')
      ? 'border-rose-500'
      : (imp === 'high' ? 'border-amber-500' : (urg === 'high' ? 'border-sky-500' : 'border-slate-300'));

    var rankImp = (imp === 'high') ? 1 : (imp === 'low' ? 3 : 2);
    var rankUrg = (urg === 'high') ? 1 : (urg === 'low' ? 3 : 2);
    return {
      impIcon: impIcon,
      urgIcon: urgIcon,
      ring: ring,
      score: (rankImp - 1) * 3 + rankUrg
    };
  }

  function toggleTodoExtraFields() {
    var row = document.getElementById('todoExtraFieldsRow');
    if (row) {
      row.classList.toggle('hidden');
      if (!row.classList.contains('hidden')) {
        renderTagPickerChips('addTodoTagPickerArea', 'fullTodoTagsInput');
      }
    }
  }

  function renderTagPickerChips(containerId, targetInputId) {
    var box = document.getElementById(containerId);
    if (!box) return;
    var tags = getAllKnownHashtags();
    if (tags.length === 0) {
      box.innerHTML = '';
      return;
    }
    box.innerHTML = tags.slice(0, 15).map(function(tg) {
      return '<button type="button" data-tag="' + escapeHtml(tg) + '" onclick="appendTagToInput(\'' + targetInputId + '\', this.getAttribute(\'data-tag\'))" class="px-1.5 py-0.5 rounded bg-slate-100 hover:bg-slate-200 text-slate-700 font-mono text-[9px] transition">' + escapeHtml(tg) + '</button>';
    }).join('');
  }

  function appendTagToInput(inputId, tag) {
    var inp = document.getElementById(inputId);
    if (!inp || !tag) return;
    var cur = inp.value.trim();
    var parts = cur ? cur.split(/\s+/) : [];
    if (parts.indexOf(tag) === -1) {
      parts.push(tag);
      inp.value = parts.join(' ');
    }
  }

  function populateTodoProjectSelectors() {
    var projects = getMasterOptions().todoProjects;
    ['fullTodoProjectSelect', 'homeQuickTodoDomain', 'modalEditTodoProject'].forEach(function(id) {
      var sel = document.getElementById(id);
      if (!sel) return;
      var prev = sel.value;
      sel.innerHTML = projects.map(function(p) {
        return '<option value="' + escapeHtml(p) + '">' + escapeHtml(p) + '</option>';
      }).join('');
      if (prev && projects.indexOf(prev) !== -1) sel.value = prev;
    });
    renderTodoProjectFilterBar();
  }

  function renderTodoProjectFilterBar() {
    var bar = document.getElementById('todoDynamicProjectFilterBar');
    if (!bar) return;
    var projects = getMasterOptions().todoProjects;
    if (currentTodoProjectFilter !== 'all' && projects.indexOf(currentTodoProjectFilter) === -1) {
      currentTodoProjectFilter = 'all';
    }

    var btns = ['<button type="button" onclick="setTodoProjectFilter(\'all\')" class="px-2 py-0.5 rounded font-semibold ' + (currentTodoProjectFilter === 'all' ? 'bg-slate-900 text-white' : 'bg-slate-100 text-slate-600') + '">すべて</button>'];
    projects.forEach(function(p) {
      var act = (currentTodoProjectFilter === p);
      btns.push('<button type="button" data-proj="' + escapeHtml(p) + '" onclick="setTodoProjectFilter(this.getAttribute(\'data-proj\'))" class="px-2 py-0.5 rounded font-semibold ' + (act ? 'bg-slate-900 text-white' : 'bg-slate-100 text-slate-600') + '">' + escapeHtml(p) + '</button>');
    });
    btns.push(
      '<label class="flex items-center gap-1 text-slate-500 cursor-pointer ml-1">' +
        '<input type="checkbox" ' + (showCompletedTodosFlag ? 'checked' : '') + ' onchange="toggleShowCompletedTodos(this.checked)" class="rounded border-slate-300">' +
        '<span>完了済</span>' +
      '</label>'
    );
    bar.innerHTML = btns.join('');

    var tagBar = document.getElementById('todoHashtagFilterBar');
    if (tagBar) {
      var tagMap = {};
      (db.todos || []).forEach(function(t) {
        (t.tags || []).forEach(function(tg) { tagMap[tg] = true; });
      });
      var allTags = Object.keys(tagMap);
      tagBar.innerHTML = allTags.map(function(tg) {
        var act = (currentTodoTagFilter === tg);
        return '<button type="button" data-tag="' + escapeHtml(tg) + '" onclick="toggleTodoTagFilter(this.getAttribute(\'data-tag\'))" class="px-1.5 py-0.2 rounded-full font-mono ' + (act ? 'bg-sky-600 text-white font-bold' : 'bg-slate-100 text-slate-600') + '">' + escapeHtml(tg) + '</button>';
      }).join('');
    }
  }

  function toggleTodoTagFilter(tag) {
    currentTodoTagFilter = (currentTodoTagFilter === tag) ? '' : tag;
    renderTodoProjectFilterBar();
    renderFullTodoView();
  }

  function toggleShowCompletedTodos(val) {
    showCompletedTodosFlag = !!val;
    renderFullTodoView();
  }

  function toggleTodayCustomizerPanel() {
    var p = document.getElementById('todayCustomizerPanel');
    if (!p) return;
    p.classList.toggle('hidden');
    if (!p.classList.contains('hidden')) renderTodayCustomizerList();
  }

  function getTodaySectionSlots() {
    var container = document.getElementById('todaySectionsContainer');
    return container ? Array.prototype.slice.call(container.children) : [];
  }

  function applyTodayLayoutOrderAndVisibility() {
    var container = document.getElementById('todaySectionsContainer');
    if (!container) return;
    var slots = getTodaySectionSlots();
    var prefs = [];
    try { prefs = JSON.parse(localStorage.getItem(KEY_TODAY_LAYOUT) || '[]'); } catch (e) {}
    if (!prefs || prefs.length === 0) return;
    var map = {};
    slots.forEach(function(s) { map[s.dataset.todayKey] = s; });
    prefs.forEach(function(p) {
      var el = map[p.key];
      if (el) {
        el.classList.toggle('hidden', p.visible === false);
        container.appendChild(el);
      }
    });
  }

  function renderTodayCustomizerList() {
    var listEl = document.getElementById('todayCustomizerList');
    if (!listEl) return;
    var slots = getTodaySectionSlots();
    listEl.innerHTML = slots.map(function(s, idx) {
      var key = s.dataset.todayKey;
      var title = s.dataset.todayTitle || key;
      var isVis = !s.classList.contains('hidden');
      return '<div class="flex items-center justify-between gap-2 px-2 py-1 rounded bg-slate-50 border border-slate-200/80 text-[11px]">' +
        '<label class="flex items-center gap-2 min-w-0 flex-1 cursor-pointer">' +
          '<input type="checkbox" ' + (isVis ? 'checked' : '') + ' onchange="toggleTodaySectionVis(\'' + key + '\', this.checked)" class="rounded border-slate-300">' +
          '<span class="truncate font-semibold text-slate-800">' + escapeHtml(title) + '</span>' +
        '</label>' +
        '<div class="flex items-center gap-1 shrink-0">' +
          '<button type="button" onclick="moveTodaySection(\'' + key + '\', -1)" ' + (idx === 0 ? 'disabled' : '') + ' class="w-5 h-5 rounded bg-white border border-slate-200 text-[9px] flex items-center justify-center"><i class="fa-solid fa-chevron-up"></i></button>' +
          '<button type="button" onclick="moveTodaySection(\'' + key + '\', 1)" ' + (idx === slots.length - 1 ? 'disabled' : '') + ' class="w-5 h-5 rounded bg-white border border-slate-200 text-[9px] flex items-center justify-center"><i class="fa-solid fa-chevron-down"></i></button>' +
        '</div>' +
      '</div>';
    }).join('');
  }

  function syncTodayDomToPrefs() {
    var prefs = getTodaySectionSlots().map(function(s) {
      return { key: s.dataset.todayKey, visible: !s.classList.contains('hidden') };
    });
    try { localStorage.setItem(KEY_TODAY_LAYOUT, JSON.stringify(prefs)); } catch (e) {}
  }

  function toggleTodaySectionVis(key, checked) {
    var found = getTodaySectionSlots().find(function(s) { return s.dataset.todayKey === key; });
    if (found) found.classList.toggle('hidden', !checked);
    syncTodayDomToPrefs();
  }

  function moveTodaySection(key, delta) {
    var container = document.getElementById('todaySectionsContainer');
    var slots = getTodaySectionSlots();
    var idx = slots.findIndex(function(s) { return s.dataset.todayKey === key; });
    var targetIdx = idx + delta;
    if (idx === -1 || targetIdx < 0 || targetIdx >= slots.length) return;
    if (delta < 0) container.insertBefore(slots[idx], slots[targetIdx]);
    else container.insertBefore(slots[targetIdx], slots[idx]);
    syncTodayDomToPrefs();
    renderTodayCustomizerList();
  }

  function authorizeAndRetryHomeCalendar() {
    showToast('Googleカレンダーの権限を確認しています...');
    runGas('authorizeCalendarPermission', undefined, 15000).then(function() {
      calendarCacheByDate = {};
      if (typeof calRangeEventsCache !== 'undefined') calRangeEventsCache = {};
      fetchAndRenderHomeCalendar(true);
      showToast('カレンダー連携を更新しました');
    }).catch(function(err) {
      showToast('カレンダー権限エラー: ' + (err && err.message ? err.message : err), true);

  function fetchAndRenderHomeCalendar(forceRefresh) {
    var area = document.getElementById('homeCalendarEventsArea');
    var icon = document.getElementById('calRefreshIcon');
    var dateInp = document.getElementById('targetDate');
    if (!area || !dateInp) return;

    var dateStr = dateInp.value || formatDateLocal(new Date());
    if (forceRefresh) {
      delete calendarCacheByDate[dateStr];
    } else if (calendarCacheByDate[dateStr]) {
      renderCalendarEventsList(calendarCacheByDate[dateStr]);
      return;
    }

    if (icon) icon.classList.add('fa-spin');
    runGas('getCalendarEventsForDate', dateStr, 12000).then(function(res) {
      if (icon) icon.classList.remove('fa-spin');
      if (res && res.ok) {
        calendarCacheByDate[dateStr] = res.events || [];
        renderCalendarEventsList(calendarCacheByDate[dateStr]);
      } else {
        var msg = (res && res.error) ? escapeHtml(res.error) : '予定を取得できませんでした';
        area.innerHTML =
          '<div class="flex items-center justify-between gap-2 text-[10px] text-amber-700 bg-amber-50 border border-amber-200 rounded-md px-2 py-1">' +
            '<span class="truncate">' + msg + '</span>' +
            '<button type="button" onclick="authorizeAndRetryHomeCalendar()" class="px-1.5 py-0.5 rounded bg-amber-600 text-white font-bold shrink-0">連携・再試行</button>' +
          '</div>';
      }
    }).catch(function() {
      if (icon) icon.classList.remove('fa-spin');
      area.innerHTML = '<div class="text-[10px] text-slate-400">オフライン中（再読み込みで取得）</div>';
    });
  }

  function renderCalendarEventsList(events) {
    var area = document.getElementById('homeCalendarEventsArea');
    if (!area) return;
    if (!events || events.length === 0) {
      area.innerHTML = '<div class="text-[10px] text-slate-400 py-0.5">この日の予定はありません</div>';
      return;
    }
    area.innerHTML = events.map(function(ev) {
      var timeLabel = ev.isAllDay ? '終日' : (ev.startTime + '-' + ev.endTime);
      return '<div class="flex items-center gap-2 px-2 py-1 rounded-md bg-slate-50 border border-slate-200/70 text-xs">' +
        (!ev.isAllDay
          ? '<button type="button" data-st="' + escapeHtml(ev.startTime) + '" data-et="' + escapeHtml(ev.endTime) + '" data-title="' + escapeHtml(ev.title) + '" onclick="logCalendarEventToRecord(this)" class="text-[9px] font-bold text-slate-700 bg-white border border-slate-200 hover:bg-slate-100 px-1.5 py-0.2 rounded shrink-0">+ ログ</button>'
          : '') +
        '<span class="w-1 h-3 rounded-full shrink-0" style="background:' + escapeHtml(ev.color || '#334155') + '"></span>' +
        '<span class="text-[10px] font-mono tabular-nums font-bold text-slate-500 shrink-0 w-[66px]">' + escapeHtml(timeLabel) + '</span>' +
        '<span class="text-[11px] font-semibold text-slate-900 truncate flex-1">' + escapeHtml(ev.title) + '</span>' +
      '</div>';
    }).join('');

    var dateStr = document.getElementById('targetDate').value;

    var sub = t.subtasks[subIdx];

  function renderHomeTodoPreview() {
    var area = document.getElementById('homeTodoListArea');
    var badge = document.getElementById('homeTodoCountBadge');
    if (!area) return;

    var targetDate = document.getElementById('targetDate').value || formatDateLocal(new Date());
    var active = (db.todos || []).filter(function(t) {
      if (t.completed) return false;
      var started = (!t.startDate || t.startDate <= targetDate);
      var dueSoon = (!t.dueDate || t.dueDate <= targetDate);
      return started || dueSoon || t.importance === 'high' || t.urgency === 'high';
    });

    active.sort(function(a, b) {
      return getImpUrgIcons(a.importance, a.urgency).score - getImpUrgIcons(b.importance, b.urgency).score;
    });
    if (badge) badge.textContent = active.length;

    if (active.length === 0) {
      area.innerHTML = '<div class="text-[10px] text-slate-400 py-0.5">本日のタスクはすべて完了しています</div>';
      return;
    }

    area.innerHTML = active.slice(0, 7).map(function(t) {
      var ic = getImpUrgIcons(t.importance, t.urgency);
      return '<div onclick="openTodoEditModal(\'' + t.id + '\')" class="flex items-center gap-1.5 px-2 py-1 rounded-md bg-slate-50 hover:bg-slate-100 border border-slate-200/70 text-xs cursor-pointer transition">' +
        '<button type="button" onclick="toggleTodoComplete(\'' + t.id + '\', event)" class="w-4 h-4 rounded-full border-2 flex items-center justify-center shrink-0 ' + ic.ring + '"></button>' +
        '<span class="text-[10px] shrink-0 flex items-center gap-0.5">' + ic.impIcon + ic.urgIcon + '</span>' +
        '<span class="text-[8px] font-mono px-1 rounded bg-white border border-slate-200 text-slate-600 shrink-0 max-w-[78px] truncate">' + escapeHtml(t.project || '仕事') + '</span>' +

    if (!area) return;

    var uncomp = (db.todos || []).filter(function(t) { return !t.completed; }).length;
    if (statsBadge) statsBadge.textContent = '未完了 ' + uncomp + '件';

    var list = getFilteredTodosForWorkspace();
    var todayStr = formatDateLocal(new Date());
    area.innerHTML = '';

    if (currentTodoDisplayMode === 'list') {
      if (list.length === 0) {
        area.innerHTML = '<div class="text-xs text-slate-400 text-center py-4">表示するタスクはありません</div>';
        return;
      }
      area.innerHTML = list.map(function(t) { return buildSlimTodoCardHtml(t, todayStr); }).join('');
      return;
    }

    if (currentTodoDisplayMode === 'matrix') {
      var quads = [
        { title: '<i class="fa-solid fa-star text-amber-500 mr-0.5"></i>高 × <i class="fa-solid fa-bolt text-rose-500 mr-0.5"></i>高（最優先）', cls: 'border-rose-200 bg-rose-50/30', items: list.filter(function(t) { return t.importance === 'high' && t.urgency === 'high'; }) },
        { title: '<i class="fa-solid fa-star text-amber-500 mr-0.5"></i>高 × <i class="fa-regular fa-clock text-sky-500 mr-0.5"></i>中〜低（計画投資）', cls: 'border-amber-200 bg-amber-50/30', items: list.filter(function(t) { return t.importance === 'high' && t.urgency !== 'high'; }) },
        { title: '<i class="fa-solid fa-circle-dot text-slate-400 mr-0.5"></i>中〜低 × <i class="fa-solid fa-bolt text-rose-500 mr-0.5"></i>高（即時処理）', cls: 'border-sky-200 bg-sky-50/30', items: list.filter(function(t) { return t.importance !== 'high' && t.urgency === 'high'; }) },
        { title: '<i class="fa-solid fa-circle-dot text-slate-400 mr-0.5"></i>中〜低 × <i class="fa-regular fa-clock text-sky-500 mr-0.5"></i>中〜低（整理）', cls: 'border-slate-200 bg-slate-50/60', items: list.filter(function(t) { return t.importance !== 'high' && t.urgency !== 'high'; }) }
      ];
      area.innerHTML = '<div class="grid grid-cols-1 sm:grid-cols-2 gap-2">' +
        quads.map(function(q) {
          return '<div class="p-2 rounded-xl border ' + q.cls + ' space-y-1">' +
            '<div class="text-[10px] font-bold text-slate-800 flex items-center justify-between"><span>' + q.title + '</span><span class="font-mono text-[9px]">' + q.items.length + '</span></div>' +
            (q.items.length === 0
              ? '<div class="text-[10px] text-slate-400 py-1">なし</div>'
              : q.items.map(function(t) {
                  return '<div onclick="openTodoEditModal(\'' + t.id + '\')" class="flex items-center gap-1.5 bg-white px-2 py-1 rounded border border-slate-200/80 text-[11px] cursor-pointer">' +
                    '<button type="button" onclick="toggleTodoComplete(\'' + t.id + '\', event)" class="w-3.5 h-3.5 rounded-full border border-slate-400 shrink-0"></button>' +
                    '<span class="truncate flex-1 font-medium text-slate-900">' + escapeHtml(t.title) + '</span>' +
                  '</div>';
                }).join('')) +
          '</div>';
        }).join('') +
      '</div>';
      return;
    }

    if (currentTodoDisplayMode === 'kanban') {
      var lanes = [
        { key: 'todo', label: '未着手', badge: 'bg-slate-200 text-slate-800', items: list.filter(function(t) { return !t.completed && (t.status || 'todo') === 'todo'; }) },
        { key: 'doing', label: '進行中', badge: 'bg-sky-100 text-sky-900', items: list.filter(function(t) { return !t.completed && t.status === 'doing'; }) },
        { key: 'done', label: '完了', badge: 'bg-slate-800 text-white', items: list.filter(function(t) { return !!t.completed || t.status === 'done'; }).slice(0, 8) }
      ];
      area.innerHTML = '<div class="grid grid-cols-1 sm:grid-cols-3 gap-2">' +
        lanes.map(function(ln) {
          return '<div class="p-2 rounded-xl bg-slate-100/80 border border-slate-200/80 space-y-1.5">' +
            '<div class="flex items-center justify-between text-[10px] font-bold px-1"><span>' + ln.label + '</span><span class="px-1.5 py-0.2 rounded font-mono text-[9px] ' + ln.badge + '">' + ln.items.length + '</span></div>' +
            '<div class="space-y-1">' +
              (ln.items.length === 0
                ? '<div class="text-[10px] text-slate-400 text-center py-2">空</div>'
                : ln.items.map(function(t) {
                    var ic = getImpUrgIcons(t.importance, t.urgency);
                    var moveBtns = '';
                    if (ln.key === 'todo') {
                      moveBtns = '<button type="button" onclick="setTodoKanbanStatus(\'' + t.id + '\', \'doing\')" class="text-[9px] font-bold text-slate-700 hover:underline">進行中へ →</button>';
                    } else if (ln.key === 'doing') {
                      moveBtns = '<button type="button" onclick="setTodoKanbanStatus(\'' + t.id + '\', \'done\')" class="text-[9px] font-bold text-slate-900 hover:underline">完了へ →</button>' +
                        '<button type="button" onclick="setTodoKanbanStatus(\'' + t.id + '\', \'todo\')" class="text-[9px] text-slate-500 hover:underline">← 戻す</button>';
                    } else {
                      moveBtns = '<button type="button" onclick="setTodoKanbanStatus(\'' + t.id + '\', \'doing\')" class="text-[9px] text-slate-500 hover:underline">← 戻す</button>';
                    }
                    return '<div class="p-2 rounded-lg bg-white border border-slate-200 space-y-1">' +
                      '<div onclick="openTodoEditModal(\'' + t.id + '\')" class="flex items-center gap-1 cursor-pointer">' +
                        '<span class="text-[9px]">' + ic.impIcon + ic.urgIcon + '</span>' +
                        '<span class="text-[11px] font-semibold text-slate-900 truncate">' + escapeHtml(t.title) + '</span>' +
                      '</div>' +
                      '<div class="flex items-center gap-2 pt-1 border-t border-slate-100">' + moveBtns + '</div>' +
                    '</div>';
                  }).join('')) +
            '</div>' +
          '</div>';
        }).join('') +
      '</div>';
      return;
    }

    if (currentTodoDisplayMode === 'gantt') {
      var activeTasks = list.filter(function(t) { return !t.completed; });
      var scaleBar =
        '<div class="flex items-center justify-between pb-1.5">' +
          '<div class="flex items-center gap-1 bg-slate-100 p-0.5 rounded-md text-[9px] font-bold">' +
            '<button type="button" onclick="setGanttTimeScale(\'week\')" class="px-2 py-0.5 rounded ' + (currentGanttScale === 'week' ? 'bg-white text-slate-900 shadow-2xs' : 'text-slate-500') + '">週間(14日)</button>' +
            '<button type="button" onclick="setGanttTimeScale(\'month\')" class="px-2 py-0.5 rounded ' + (currentGanttScale === 'month' ? 'bg-white text-slate-900 shadow-2xs' : 'text-slate-500') + '">月間(30日)</button>' +
            '<button type="button" onclick="setGanttTimeScale(\'quarter\')" class="px-2 py-0.5 rounded ' + (currentGanttScale === 'quarter' ? 'bg-white text-slate-900 shadow-2xs' : 'text-slate-500') + '">四半期(12週)</button>' +
          '</div>' +
        '</div>';

      if (activeTasks.length === 0) {
        area.innerHTML = scaleBar + '<div class="text-xs text-slate-400 text-center py-4">進行中のタスクがありません</div>';
        return;
      }

      var baseDate = new Date(todayStr + 'T12:00:00');
      var buckets = [];
      var gridCls = 'grid-cols-14';
      var minW = 'min-w-[440px]';

      if (currentGanttScale === 'week') {
        baseDate.setDate(baseDate.getDate() - 2);
        for (var i = 0; i < 14; i++) {
          var d = new Date(baseDate);
          d.setDate(d.getDate() + i);
          var ds = formatDateLocal(d);
          buckets.push({ start: ds, end: ds, label: String(d.getDate()), isNow: ds === todayStr });
        }
      } else if (currentGanttScale === 'month') {
        gridCls = 'grid-cols-30';
        minW = 'min-w-[640px]';
        baseDate.setDate(baseDate.getDate() - 3);
        for (var m = 0; m < 30; m++) {
          var dm = new Date(baseDate);
          dm.setDate(dm.getDate() + m);
          var dms = formatDateLocal(dm);
          buckets.push({ start: dms, end: dms, label: (m % 2 === 0 || dms === todayStr) ? String(dm.getDate()) : '', isNow: dms === todayStr });
        }
      } else {
        gridCls = 'grid-cols-12';
        minW = 'min-w-[460px]';
        var mon = getMonday(baseDate);
        for (var q = 0; q < 12; q++) {
          var wss = getShiftDateStr(mon, q * 7);
          var wes = getShiftDateStr(wss, 6);
          var wParts = wss.split('-');
          buckets.push({ start: wss, end: wes, label: Number(wParts[1]) + '/' + Number(wParts[2]), isNow: (wss <= todayStr && todayStr <= wes) });
        }
      }

      var headerCols = buckets.map(function(b) {
        return '<div class="text-center text-[8px] font-mono py-1 border-l border-slate-200/70 truncate ' + (b.isNow ? 'bg-slate-900 text-white font-bold' : 'text-slate-400') + '">' + b.label + '</div>';
      }).join('');

      var rowsHtml = activeTasks.map(function(t) {
        var sStr = t.startDate || t.createdAt || todayStr;
        var eStr = t.dueDate || sStr;
        if (eStr < sStr) eStr = sStr;

        var cells = buckets.map(function(b) {
          var overlap = (sStr <= b.end && eStr >= b.start);
          return '<div class="h-5 border-l border-slate-100 flex items-center ' + (b.isNow ? 'bg-slate-100/70' : '') + '">' +
            (overlap ? '<div class="w-full h-2.5 bg-slate-900 rounded-xs mx-0.2"></div>' : '') +
          '</div>';
        }).join('');

        return '<div onclick="openTodoEditModal(\'' + t.id + '\')" class="grid grid-cols-[105px_1fr] items-center border-t border-slate-100 text-[10px] cursor-pointer hover:bg-slate-50">' +
          '<div class="pr-1.5 py-1 truncate font-semibold text-slate-800">' + escapeHtml(t.title) + '</div>' +
          '<div class="grid ' + gridCls + '">' + cells + '</div>' +
        '</div>';
      }).join('');

      area.innerHTML = scaleBar +
        '<div class="overflow-x-auto border border-slate-200 rounded-xl bg-white p-2">' +
          '<div class="' + minW + '">' +
            '<div class="grid grid-cols-[105px_1fr] items-center pb-1">' +
              '<div class="text-[9px] font-bold text-slate-500">タスク</div>' +
              '<div class="grid ' + gridCls + '">' + headerCols + '</div>' +
            '</div>' +
            rowsHtml +
          '</div>' +
        '</div>';
    }
  }

  loadTodosLocal();
  populateTodoProjectSelectors();
  var stInp = document.getElementById('fullTodoStartInput');
  var dueInp = document.getElementById('fullTodoDueInput');
  if (stInp) stInp.value = formatDateLocal(new Date());
  if (dueInp) dueInp.value = formatDateLocal(new Date());

  App.on('masterOptions:changed', function() {
    populateTodoProjectSelectors();
    renderHomeTodoPreview();
    renderFullTodoView();
  });

  App.on('data:loaded', function() {
    renderHomeTodoPreview();
    if (currentView === 'home') fetchAndRenderHomeCalendar(false);
    if (currentView === 'todo') renderFullTodoView();
  });

  setTimeout(syncTodosFromServer, 600);
</script>
