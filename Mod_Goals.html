<div id="goalView" class="card-surface px-3 py-2.5 space-y-2">
  <!-- マイ・クレド（行動指針ランダム表示） -->
  <div id="myCredoBanner" class="px-2.5 py-1.5 rounded-lg bg-slate-900 text-white flex items-center justify-between gap-2 text-[10px]">
    <div class="min-w-0 flex-1">
      <span class="text-[8px] font-mono uppercase text-amber-300 font-bold mr-1.5">MY CREDO</span>
      <span id="myCredoText" class="font-semibold">小さな一歩の積み重ねが、1年後の自分を創る。</span>
    </div>
    <button type="button" onclick="editMyCredosPrompt()" class="text-slate-400 hover:text-white text-[9px] shrink-0" title="行動指針を編集">
      <i class="fa-solid fa-pen"></i>
    </button>
  </div>

  <!-- 切替ヘッダー：夢・人生リスト / Objectives -->
  <div class="flex items-center justify-between border-b border-slate-100 pb-1.5">
    <div class="flex items-center gap-1 bg-slate-100 p-0.5 rounded-md text-[10px] font-bold">
      <button type="button" id="tabDreamListBtn" onclick="switchGoalSubView('dreams')" class="px-2 py-0.5 rounded bg-white text-slate-900 shadow-2xs">夢・人生リスト</button>
      <button type="button" id="tabObjectivesBtn" onclick="switchGoalSubView('objectives')" class="px-2 py-0.5 rounded text-slate-500">目標 (<span id="goalDomainLabel">仕事</span>)</button>
    </div>
    <button type="button" id="goalTopAddBtn" onclick="openDreamOrGoalForm()" class="px-2 py-0.5 bg-slate-900 hover:bg-slate-800 active:scale-95 text-white rounded text-[9px] font-semibold transition">
      + 追加
    </button>
  </div>

  <!-- 夢・人生リスト ビュー -->
  <div id="dreamListSubView" class="space-y-1.5">
    <div id="dreamAddFormBox" class="bg-slate-50 border border-slate-200 rounded-lg p-2 space-y-1.5 hidden">
      <div class="flex items-center justify-between">
        <span class="text-[10px] font-bold text-slate-900">叶えたい夢・ビジョンを追加</span>
        <button type="button" onclick="document.getElementById('dreamAddFormBox').classList.add('hidden')" class="text-slate-400 text-xs"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <input type="text" id="newDreamTitleInput" placeholder="例：海外の学会で発表する / 家族と北海道一周..." class="w-full px-2 py-1 border border-slate-200 rounded text-xs bg-white font-semibold outline-none">
      <div class="grid grid-cols-2 gap-1.5 text-[10px]">
        <select id="newDreamCategorySelect" class="px-1.5 py-1 border border-slate-200 rounded bg-white font-bold"></select>
        <input type="month" id="newDreamTargetMonth" class="px-1.5 py-1 border border-slate-200 rounded font-mono bg-white">
      </div>
      <button type="button" onclick="addDreamItem()" class="w-full py-1 bg-slate-900 text-white rounded text-[10px] font-bold">夢リストに登録</button>
    </div>
    <div id="dreamListItemsArea" class="space-y-1"></div>
  </div>

  <!-- 従来の Objectives ビュー -->
  <div id="objectivesSubView" class="space-y-1.5 hidden">
    <div id="goalEditCard" class="bg-slate-50 border border-slate-200/90 rounded-lg p-2 space-y-1.5 hidden">
      <div class="flex items-center justify-between border-b border-slate-200/70 pb-1">
        <span class="font-bold text-[10px] text-slate-900">目標の設定・編集</span>
        <button type="button" onclick="closeGoalForm()" class="text-slate-400 hover:text-slate-800 text-xs"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <input type="hidden" id="editGoalId" value="">
      <div class="grid grid-cols-2 gap-1.5 text-xs">
        <div>
          <label class="block text-[8px] font-semibold text-slate-500">種別</label>
          <select id="editGoalType" class="w-full px-1.5 py-1 border border-slate-200 rounded text-[10px] font-semibold bg-white">
            <option value="yearly">年間目標</option>
            <option value="monthly">月間目標</option>
            <option value="weekly">週間目標</option>
          </select>
        </div>
        <div>
          <label class="block text-[8px] font-semibold text-slate-500">達成率 (%)</label>
          <input type="number" id="editGoalProgress" min="0" max="100" value="0" class="w-full px-1.5 py-1 border border-slate-200 rounded text-[10px] font-mono tabular-nums font-bold bg-white">
        </div>
      </div>
      <div class="grid grid-cols-2 gap-1.5 text-xs">
        <div>
          <label class="block text-[8px] font-semibold text-slate-500">開始日</label>
          <input type="date" id="editGoalStart" class="w-full px-1.5 py-1 border border-slate-200 rounded text-[10px] font-mono bg-white">
        </div>
        <div>
          <label class="block text-[8px] font-semibold text-slate-500">締切日</label>
          <input type="date" id="editGoalEnd" class="w-full px-1.5 py-1 border border-slate-200 rounded text-[10px] font-mono bg-white">
        </div>
      </div>
      <textarea id="editGoalContent" rows="2" placeholder="目標内容..." class="w-full px-2 py-1 border border-slate-200 rounded text-[11px] leading-snug bg-white outline-none focus:border-slate-900"></textarea>
      <button type="button" onclick="submitGoalForm()" class="w-full py-1 bg-slate-900 hover:bg-slate-800 text-white font-semibold rounded text-[10px] transition">保存する</button>
    </div>

    <div id="activeGoalsProgressArea" class="divide-y divide-slate-100/80"></div>
  </div>
</div>

<script>
  App.mount('#slot-home-goals', 'goalView');

  var KEY_ARCHIVED_GOALS = 'worklife_os_archived_goals_v1';
  var KEY_DREAM_LIST = 'worklife_os_dreams_v1';
  var KEY_MY_CREDOS = 'worklife_os_credos_v1';
  var currentGoalSubTab = 'dreams';

  function getDreamListStore() {
    try { return JSON.parse(localStorage.getItem(KEY_DREAM_LIST) || '[]'); } catch (e) { return []; }
  }
  function saveDreamListStore(list) {
    try { localStorage.setItem(KEY_DREAM_LIST, JSON.stringify(list)); } catch (e) {}
    renderDreamListView();
    renderGamificationHeader();
  }

  function renderMyCredo() {
    var el = document.getElementById('myCredoText');
    if (!el) return;
    var credos = [];
    try { credos = JSON.parse(localStorage.getItem(KEY_MY_CREDOS) || '[]'); } catch (e) {}
    if (!credos || credos.length === 0) {
      credos = [
        '小さな一歩の積み重ねが、1年後の自分を創る。',
        '迷ったら、未来の自分が誇れる方を選ぶ。',
        '完璧を目指すより、まず3分だけ手を動かす。'
      ];
    }
    el.textContent = credos[Math.floor(Math.random() * credos.length)];
  }

  function editMyCredosPrompt() {
    var cur = [];
    try { cur = JSON.parse(localStorage.getItem(KEY_MY_CREDOS) || '[]'); } catch (e) {}
    var nextStr = window.prompt('大切にしたい行動指針・マイクレドを「 / 」区切りで入力してください:', cur.join(' / '));
    if (nextStr === null) return;
    var arr = nextStr.split('/').map(function(s) { return s.trim(); }).filter(Boolean);
    try { localStorage.setItem(KEY_MY_CREDOS, JSON.stringify(arr)); } catch (e) {}
    renderMyCredo();
    showToast('行動指針を更新しました');
  }

  function switchGoalSubView(tab) {
    currentGoalSubTab = tab;
    document.getElementById('tabDreamListBtn').className = (tab === 'dreams') ? 'px-2 py-0.5 rounded bg-white text-slate-900 shadow-2xs' : 'px-2 py-0.5 rounded text-slate-500';
    document.getElementById('tabObjectivesBtn').className = (tab === 'objectives') ? 'px-2 py-0.5 rounded bg-white text-slate-900 shadow-2xs' : 'px-2 py-0.5 rounded text-slate-500';
    document.getElementById('dreamListSubView').classList.toggle('hidden', tab !== 'dreams');
    document.getElementById('objectivesSubView').classList.toggle('hidden', tab !== 'objectives');
  }

  function openDreamOrGoalForm() {
    if (currentGoalSubTab === 'dreams') {
      var sel = document.getElementById('newDreamCategorySelect');
      if (sel) {
        sel.innerHTML = getMasterOptions().todoProjects.map(function(p) {
          return '<option value="' + escapeHtml(p) + '">' + escapeHtml(p) + '</option>';
        }).join('');
      }
      document.getElementById('dreamAddFormBox').classList.toggle('hidden');
    } else {
      openNewGoalForm();
    }
  }

  function addDreamItem() {
    var title = document.getElementById('newDreamTitleInput').value.trim();
    if (!title) return showToast('夢の内容を入力してください', true);
    var cat = document.getElementById('newDreamCategorySelect').value || 'プライベート';
    var targetMonth = document.getElementById('newDreamTargetMonth').value || '';

    var list = getDreamListStore();
    list.unshift({
      id: 'dream_' + Date.now(),
      title: title,
      category: cat,
      targetMonth: targetMonth,
      achieved: false,
      achievedDate: ''
    });
    document.getElementById('newDreamTitleInput').value = '';
    document.getElementById('dreamAddFormBox').classList.add('hidden');
    saveDreamListStore(list);
    showToast('夢リストに追加しました (+15 ビジョンXP)');
  }

  function toggleDreamAchieved(id) {
    var list = getDreamListStore();
    var d = list.find(function(x) { return x.id === id; });
    if (!d) return;
    d.achieved = !d.achieved;
    d.achievedDate = d.achieved ? formatDateLocal(new Date()) : '';
    saveDreamListStore(list);
    if (d.achieved) {
      if (typeof pushAutoSnsEvent === 'function') {
        pushAutoSnsEvent('dream_achieved', '🎉 夢を達成しました！『' + d.title + '』');
      }
      showToast('🎉 夢の達成おめでとうございます！ (+100 ビジョンXP)');
    }
  }

  function convertDreamToTodo(id) {
    var d = getDreamListStore().find(function(x) { return x.id === id; });
    if (!d) return;
    var stepTitle = window.prompt('『' + d.title + '』に向けて今月やる最初の一歩（タスク）:', d.title + 'の計画を立てる');
    if (!stepTitle || !stepTitle.trim()) return;
    db.todos.unshift({
      id: 'todo_' + Date.now(),
      title: stepTitle.trim(),
      importance: 'high',
      urgency: 'mid',
      startDate: formatDateLocal(new Date()),
      dueDate: '',
      project: d.category || 'プライベート',
      tags: ['#夢の実現'],
      fromDreamId: d.id,
      status: 'todo',
      completed: false,
      subtasks: [],
      createdAt: formatDateLocal(new Date())
    });
    if (typeof saveTodosImmediate === 'function') saveTodosImmediate();
    showToast('夢からタスクを作成しました');
  }

  function deleteDreamItem(id) {
    var list = getDreamListStore().filter(function(x) { return x.id !== id; });
    saveDreamListStore(list);
  }

  function renderDreamListView() {
    var area = document.getElementById('dreamListItemsArea');
    if (!area) return;
    var list = getDreamListStore().sort(function(a, b) {
      if (!!a.achieved !== !!b.achieved) return a.achieved ? 1 : -1;
      return String(a.targetMonth || '9999').localeCompare(String(b.targetMonth || '9999'));
    });

    if (list.length === 0) {
      area.innerHTML = '<div class="text-[10px] text-slate-400 py-1.5 text-center">「+ 追加」から人生で叶えたい夢やビジョンを登録できます</div>';
      return;
    }

    area.innerHTML = list.map(function(d) {
      return '<div class="flex items-center gap-1.5 px-2 py-1 rounded-lg border text-xs ' + (d.achieved ? 'bg-amber-50/60 border-amber-200' : 'bg-slate-50 border-slate-200/80') + '">' +
        '<button type="button" onclick="toggleDreamAchieved(\'' + d.id + '\')" class="w-4 h-4 rounded-full border-2 flex items-center justify-center shrink-0 ' + (d.achieved ? 'bg-amber-500 border-amber-500 text-white' : 'border-amber-400') + '">' +
          (d.achieved ? '<i class="fa-solid fa-crown text-[8px]"></i>' : '') +
        '</button>' +
        '<span class="text-[8px] font-bold px-1 rounded bg-white border border-slate-200 text-slate-600 shrink-0">' + escapeHtml(d.category) + '</span>' +
        '<span class="text-[11px] font-semibold truncate flex-1 ' + (d.achieved ? 'line-through text-slate-500' : 'text-slate-900') + '">' + escapeHtml(d.title) + '</span>' +
        (d.targetMonth ? '<span class="text-[9px] font-mono text-indigo-600 font-bold shrink-0">' + escapeHtml(d.targetMonth) + '</span>' : '') +
        (!d.achieved ? '<button type="button" onclick="convertDreamToTodo(\'' + d.id + '\')" class="px-1.5 py-0.2 rounded bg-slate-900 text-white text-[8px] font-bold shrink-0" title="タスクに分解">+タスク</button>' : '') +
        '<button type="button" onclick="deleteDreamItem(\'' + d.id + '\')" class="text-slate-300 hover:text-rose-500 text-[9px] px-0.5"><i class="fa-solid fa-xmark"></i></button>' +
      '</div>';
    }).join('');
  }

  // 以下、従来の Objectives 管理
  function getArchivedGoalIds() {
    try { return JSON.parse(localStorage.getItem(KEY_ARCHIVED_GOALS) || '[]'); } catch (e) { return []; }
  }
  function addArchivedGoalId(id) {
    var list = getArchivedGoalIds();
    if (list.indexOf(id) === -1) {
      list.push(id);
      try { localStorage.setItem(KEY_ARCHIVED_GOALS, JSON.stringify(list)); } catch (e) {}
    }
  }

  App.on('domain:changed', function() {
    var lbl = document.getElementById('goalDomainLabel');
    if (lbl) lbl.textContent = currentDomain === 'private' ? '私用・学習' : (currentDomain === 'all' ? '統合' : '仕事');
  });
  App.on('data:loaded', renderGoalView);
  App.on('view:changed:home', renderGoalView);

  function collectActiveGoalsForDomain(dom) {
    var goalStore = dom === 'private' ? db.privateGoals : db.workGoals;
    if (!goalStore) return [];
    var archivedIds = getArchivedGoalIds();
    var seen = {};
    var items = [];

    var rawList = (goalStore.history || []).slice();
    ['yearly', 'monthly', 'weekly'].forEach(function(t) {
      if (goalStore.current && goalStore.current[t]) rawList.push(goalStore.current[t]);
    });

    rawList.forEach(function(g) {
      if (!g || !g.id || seen[g.id]) return;
      seen[g.id] = true;
      if (archivedIds.indexOf(g.id) !== -1) return;
      if (g.nextAction === '__ARCHIVED__') return;
      items.push(Object.assign({ domain: dom }, g));
    });

    var typeOrder = { yearly: 1, monthly: 2, weekly: 3 };
    items.sort(function(a, b) {
      return (typeOrder[a.type] || 9) - (typeOrder[b.type] || 9);
    });
    return items;
  }

  function getActiveGoalsForCurrentDomain() {
    var list = [];
    if (currentDomain === 'work' || currentDomain === 'all') list = list.concat(collectActiveGoalsForDomain('work'));
    if (currentDomain === 'private' || currentDomain === 'all') list = list.concat(collectActiveGoalsForDomain('private'));
    return list;
  }

  function renderGoalView() {
    renderMyCredo();
    renderDreamListView();
    var area = document.getElementById('activeGoalsProgressArea');
    if (!area) return;
    area.innerHTML = '';

    var goals = getActiveGoalsForCurrentDomain();
    if (goals.length === 0) {
      area.innerHTML = '<div class="text-[10px] text-slate-400 py-1 text-center">「+ 追加」から年間・月間・週間の目標を登録できます</div>';
      return;
    }

    var typeMeta = {
      yearly: { label: '年', cls: 'bg-slate-900 text-white' },
      monthly: { label: '月', cls: 'bg-indigo-600 text-white' },
      weekly: { label: '週', cls: 'bg-teal-600 text-white' }
    };

    goals.forEach(function(g) {
      var tm = typeMeta[g.type] || { label: '目', cls: 'bg-slate-700 text-white' };
      var pct = Math.min(100, Math.max(0, Number(g.progress) || 0));
      var row = document.createElement('div');
      row.className = 'py-1.5 first:pt-0.5 last:pb-0.5 space-y-1';
      row.innerHTML =
        '<div class="flex items-center justify-between gap-1.5">' +
          '<div class="flex items-center gap-1 min-w-0 flex-1">' +
            '<span class="text-[8px] font-bold px-1 rounded-xs shrink-0 leading-tight ' + tm.cls + '">' + tm.label + '</span>' +
            '<span class="text-[11px] font-semibold text-slate-900 truncate">' + escapeHtml(g.content) + '</span>' +
          '</div>' +
          '<div class="flex items-center gap-0.5 shrink-0">' +
            '<span class="text-[9px] font-mono font-bold text-slate-700 mr-0.5">' + pct + '%</span>' +
            '<button type="button" onclick="incrementGoalProgress(\'' + g.domain + '\', \'' + g.id + '\', 10)" class="h-3.5 px-1 rounded-xs bg-slate-800 text-white text-[8px] font-mono font-bold">+10</button>' +
            '<button type="button" onclick="editExistingGoal(\'' + g.domain + '\', \'' + g.id + '\')" class="w-3.5 h-3.5 ml-0.5 text-slate-400 hover:text-slate-800 text-[8px]"><i class="fa-solid fa-pen"></i></button>' +
            '<button type="button" onclick="archiveGoalItem(\'' + g.domain + '\', \'' + g.id + '\')" class="w-3.5 h-3.5 text-slate-400 hover:text-emerald-600 text-[8px]"><i class="fa-solid fa-check"></i></button>' +
          '</div>' +
        '</div>' +
        '<div class="w-full bg-slate-200/70 h-[2px] rounded-full overflow-hidden"><div class="bg-slate-900 h-full" style="width:' + pct + '%"></div></div>';
      area.appendChild(row);
    });
  }

  function openNewGoalForm() {
    document.getElementById('editGoalId').value = '';
    document.getElementById('editGoalType').value = 'monthly';
    document.getElementById('editGoalProgress').value = 0;
    document.getElementById('editGoalStart').value = formatDateLocal(new Date());
    document.getElementById('editGoalEnd').value = '';
    document.getElementById('editGoalContent').value = '';
    document.getElementById('goalEditCard').classList.remove('hidden');
  }

  function editExistingGoal(domain, id) {
    var found = collectActiveGoalsForDomain(domain).find(function(g) { return g.id === id; });
    if (!found) return;
    document.getElementById('editGoalId').value = found.id;
    document.getElementById('editGoalType').value = found.type;
    document.getElementById('editGoalProgress').value = found.progress || 0;
    document.getElementById('editGoalStart').value = found.startDate || '';
    document.getElementById('editGoalEnd').value = found.endDate || '';
    document.getElementById('editGoalContent').value = found.content || '';
    document.getElementById('goalEditCard').classList.remove('hidden');
  }

  function closeGoalForm() { document.getElementById('goalEditCard').classList.add('hidden'); }

  function submitGoalForm() {
    var targetDomain = (currentDomain === 'private') ? 'private' : 'work';
    var existingId = document.getElementById('editGoalId').value;
    var type = document.getElementById('editGoalType').value;
    var progress = Math.min(100, Math.max(0, Number(document.getElementById('editGoalProgress').value) || 0));
    var startDate = document.getElementById('editGoalStart').value;
    var endDate = document.getElementById('editGoalEnd').value;
    var content = document.getElementById('editGoalContent').value.trim();
    if (!content) return showToast('目標内容を入力してください', true);

    var goalStore = targetDomain === 'private' ? db.privateGoals : db.workGoals;
    var labelMap = { yearly: '年間目標', monthly: '月間目標', weekly: '週間目標' };
    var newItem = {
      id: existingId || ('goal_' + Date.now()), type: type, period: labelMap[type] || '目標',
      content: content, updatedAt: formatDateLocal(new Date()), startDate: startDate, endDate: endDate,
      progress: progress, nextAction: ''
    };

    goalStore.current[type] = newItem;
    if (existingId) {
      var idx = goalStore.history.findIndex(function(h) { return h.id === existingId; });
      if (idx !== -1) goalStore.history[idx] = newItem;
      else goalStore.history.unshift(newItem);
    } else {
      goalStore.history.unshift(newItem);
    }

    closeGoalForm();
    renderGoalView();
    scheduleBgSync('saveGoalItem', newItem.id, {
      domain: targetDomain, updateExistingId: existingId || '', type: type,
      content: content, startDate: startDate, endDate: endDate, progress: progress, nextAction: ''
    });
    showToast('目標を保存しました');
  }

  function archiveGoalItem(domain, id) {
    addArchivedGoalId(id);
    var goalStore = domain === 'private' ? db.privateGoals : db.workGoals;
    var found = (goalStore.history || []).find(function(g) { return g.id === id; });
    if (found) found.nextAction = '__ARCHIVED__';
    renderGoalView();
    scheduleBgSync('saveGoalItem', id, { domain: domain, updateExistingId: id, nextAction: '__ARCHIVED__' });
    showToast('目標を達成アーカイブしました');
  }

  function incrementGoalProgress(domain, id, delta) {
    var goalStore = domain === 'private' ? db.privateGoals : db.workGoals;
    var found = (goalStore.history || []).find(function(g) { return g.id === id; });
    if (!found) return;
    found.progress = Math.min(100, Math.max(0, (Number(found.progress) || 0) + delta));
    renderGoalView();
    scheduleBgSync('saveGoalItem', id, { domain: domain, updateExistingId: id, progress: found.progress });
  }
</script>
