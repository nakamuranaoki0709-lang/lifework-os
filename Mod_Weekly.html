<!-- 週表示ビュー -->
<div id="weeklyView" class="space-y-2.5 hidden">
  <div class="card-surface flex items-center justify-between p-2.5 text-xs">
    <button onclick="changeWeek(-1)" class="px-2.5 py-1 bg-slate-100 hover:bg-slate-200 rounded-lg font-semibold text-slate-700 transition"><i class="fa-solid fa-chevron-left text-[10px]"></i> 前週</button>
    <div id="weeklyTitle" class="font-bold text-slate-900 text-[11px] font-mono tabular-nums"></div>
    <div class="flex items-center gap-1">
      <button onclick="resetToThisWeek()" class="px-2.5 py-1 bg-slate-900 text-white rounded-lg font-semibold text-[10px]">今週</button>
      <button onclick="changeWeek(1)" class="px-2.5 py-1 bg-slate-100 hover:bg-slate-200 rounded-lg font-semibold text-slate-700 transition">次週 <i class="fa-solid fa-chevron-right text-[10px]"></i></button>
    </div>
  </div>
  <div id="weeklySummaryBar" class="card-surface p-2.5 grid grid-cols-5 gap-1 text-center"></div>
  <div id="weeklyGrid" class="space-y-2.5"></div>
</div>

<script>
  App.mount('#slot-views', 'weeklyView');
  App.on('view:changed:weekly', renderWeekly);

  function renderWeekly() {
    var grid = document.getElementById('weeklyGrid');
    var summaryBar = document.getElementById('weeklySummaryBar');
    grid.innerHTML = '';

    var start = new Date(currentWeekStartDate);
    var end = new Date(start); end.setDate(end.getDate() + 6);
    document.getElementById('weeklyTitle').textContent = (start.getMonth()+1) + '/' + start.getDate() + ' 〜 ' + (end.getMonth()+1) + '/' + end.getDate();

    var scoreSum = 0, scoreCnt = 0, condSum = 0, condCnt = 0, sleepSum = 0, sleepCnt = 0, stepSum = 0, stepCnt = 0, kptDays = 0;
    var days = ['月', '火', '水', '木', '金', '土', '日'];

    for (var i = 0; i < 7; i++) {
      var d = new Date(start); d.setDate(d.getDate() + i);
      var dateStr = formatDateLocal(d);
      var wLog = db.workLogs.find(function(l) { return l.date === dateStr; });
      var pLog = db.privateLogs.find(function(l) { return l.date === dateStr; });

      var wHabDone = 0;
      if (wLog && wLog.habitMap) db.workHabits.forEach(function(h) { if (wLog.habitMap[h.id]) wHabDone++; });
      var pHabDone = 0;
      if (pLog && pLog.habitMap) db.privateHabits.forEach(function(h) { if (pLog.habitMap[h.id]) pHabDone++; });

      var dayScore = (currentDomain === 'private')
        ? ((pLog && pLog.score !== undefined) ? Number(pLog.score) : ((wLog && wLog.growthScore !== undefined) ? Number(wLog.growthScore) : null))
        : ((wLog && wLog.growthScore !== undefined) ? Number(wLog.growthScore) : ((pLog && pLog.score !== undefined) ? Number(pLog.score) : null));
      var dayCond = (wLog && wLog.condition !== undefined) ? Number(wLog.condition) : null;
      var calcSleep = computeSleepForDate(dateStr).sleepHours;
      var dispSleep = calcSleep !== null ? calcSleep : ((pLog && pLog.sleepHours !== null && pLog.sleepHours !== undefined) ? Number(pLog.sleepHours) : ((wLog && wLog.sleepHours !== undefined) ? Number(wLog.sleepHours) : null));
      var daySteps = getPrivateSteps(pLog);

      if (dayScore !== null && (wLog || pLog)) { scoreSum += dayScore; scoreCnt++; }
      if (dayCond !== null && wLog) { condSum += dayCond; condCnt++; }
      if (dispSleep !== null && (wLog || pLog)) { sleepSum += dispSleep; sleepCnt++; }
      if (daySteps !== '') { stepSum += Number(daySteps); stepCnt++; }

      var hasKpt = wLog && (
        (wLog.reportKeep && wLog.reportKeep.trim()) ||
        (wLog.reportProblem && wLog.reportProblem.trim()) ||
        (wLog.reportInsight && wLog.reportInsight.trim()) ||
        (wLog.reportTry && wLog.reportTry.trim())
      );
      if (hasKpt) kptDays++;

      var badgesHtml = '';
      if (dayScore !== null && (wLog || pLog)) badgesHtml += '<span class="text-[9px] font-mono font-semibold bg-slate-100 text-slate-800 border border-slate-200 px-1.5 py-0.5 rounded">★' + dayScore + '</span>';
      if (dayCond !== null && wLog) {
        var condColor = dayCond >= 4 ? 'bg-emerald-50 text-emerald-800 border-emerald-200' : (dayCond <= 2 ? 'bg-rose-50 text-rose-800 border-rose-200' : 'bg-slate-50 text-slate-700 border-slate-200');
        badgesHtml += '<span class="text-[9px] font-mono font-semibold border px-1.5 py-0.5 rounded ' + condColor + '">体調' + dayCond + '</span>';
      }
      if (dispSleep !== null && (wLog || pLog)) badgesHtml += '<span class="text-[9px] font-mono bg-slate-50 text-slate-700 border border-slate-200 px-1.5 py-0.5 rounded">睡' + dispSleep + 'h</span>';
      if (daySteps !== '') badgesHtml += '<span class="text-[9px] font-mono bg-indigo-50 text-indigo-800 border border-indigo-200 px-1.5 py-0.5 rounded">' + Number(daySteps).toLocaleString() + '歩</span>';
      if (pLog && pLog.weight) badgesHtml += '<span class="text-[9px] font-mono bg-slate-50 text-slate-700 border border-slate-200 px-1.5 py-0.5 rounded">' + pLog.weight + 'kg</span>';
      badgesHtml += '<span class="text-[9px] font-semibold bg-slate-900 text-white px-1.5 py-0.5 rounded">習 仕' + wHabDone + '/私' + pHabDone + '</span>';

      var workQuickNote = (wLog && wLog.quickNote) ? wLog.quickNote.trim() : '';
      var privQuickNote = getPrivateQuickNote(pLog).trim();
      var showWorkNote = (currentDomain === 'work' || currentDomain === 'all') && workQuickNote !== '';
      var showPrivNote = (currentDomain === 'private' || currentDomain === 'all') && privQuickNote !== '';

      var quickNoteHtml = '';
      if (showWorkNote || showPrivNote) {
        var noteRows = [];
        if (showWorkNote) noteRows.push('<div class="flex items-start gap-1.5"><span class="text-[9px] font-semibold bg-slate-800 text-white px-1.5 py-0.2 rounded shrink-0 mt-0.5">仕事</span><span class="text-[11px] text-slate-800 leading-snug">' + escapeHtml(workQuickNote) + '</span></div>');
        if (showPrivNote) noteRows.push('<div class="flex items-start gap-1.5"><span class="text-[9px] font-semibold bg-indigo-700 text-white px-1.5 py-0.2 rounded shrink-0 mt-0.5">私用</span><span class="text-[11px] text-slate-800 leading-snug">' + escapeHtml(privQuickNote) + '</span></div>');
        quickNoteHtml = '<div class="bg-slate-50 border border-slate-200/80 rounded-lg px-2.5 py-1.5 space-y-1">' + noteRows.join('') + '</div>';
      }

      var kptHtml = '';
      if ((currentDomain === 'work' || currentDomain === 'all') && hasKpt) {
        var kptRows = [];
        if (wLog.reportKeep && wLog.reportKeep.trim()) kptRows.push('<div class="flex items-start gap-1.5"><span class="text-[9px] font-mono font-semibold bg-emerald-100 text-emerald-900 px-1.5 py-0.2 rounded shrink-0 mt-0.5">KEEP</span><span class="text-[11px] text-slate-700 leading-relaxed whitespace-pre-wrap">' + escapeHtml(wLog.reportKeep) + '</span></div>');
        if (wLog.reportProblem && wLog.reportProblem.trim()) kptRows.push('<div class="flex items-start gap-1.5"><span class="text-[9px] font-mono font-semibold bg-rose-100 text-rose-900 px-1.5 py-0.2 rounded shrink-0 mt-0.5">PROB</span><span class="text-[11px] text-slate-700 leading-relaxed whitespace-pre-wrap">' + escapeHtml(wLog.reportProblem) + '</span></div>');
        if (wLog.reportInsight && wLog.reportInsight.trim()) kptRows.push('<div class="flex items-start gap-1.5"><span class="text-[9px] font-mono font-semibold bg-slate-200 text-slate-800 px-1.5 py-0.2 rounded shrink-0 mt-0.5">INSI</span><span class="text-[11px] text-slate-700 leading-relaxed whitespace-pre-wrap">' + escapeHtml(wLog.reportInsight) + '</span></div>');
        if (wLog.reportTry && wLog.reportTry.trim()) {
          var safeTryArg = escapeHtml(wLog.reportTry).replace(/'/g, '&#39;').replace(/\r?\n/g, ' ');
          kptRows.push(
            '<div class="flex items-start justify-between gap-1.5">' +
              '<div class="flex items-start gap-1.5 min-w-0 flex-1"><span class="text-[9px] font-mono font-semibold bg-amber-100 text-amber-900 px-1.5 py-0.2 rounded shrink-0 mt-0.5">TRY</span><span class="text-[11px] font-semibold text-slate-900 leading-relaxed whitespace-pre-wrap">' + escapeHtml(wLog.reportTry) + '</span></div>' +
              '<button type="button" onclick="setWeeklyGoalFromTry(\'' + safeTryArg + '\')" class="text-[9px] font-semibold bg-amber-500 hover:bg-amber-600 text-white px-2 py-0.5 rounded shrink-0 transition" title="来週の週間目標に反映">来週目標へ</button>' +
            '</div>'
          );
        }
        kptHtml = '<div class="bg-slate-50/70 border border-slate-200/80 rounded-lg p-2.5 space-y-1.5">' + kptRows.join('') + '</div>';
      }

      var showWorkSched = (currentDomain === 'work' || currentDomain === 'all') && wLog && wLog.scheduleText && wLog.scheduleText.trim();
      var showPrivSched = (currentDomain === 'private' || currentDomain === 'all') && pLog && pLog.scheduleText && pLog.scheduleText.trim();
      var schedHtml = (showWorkSched || showPrivSched)
        ? '<div class="space-y-1 pt-0.5">' + (showWorkSched ? '<div class="text-[10px] text-slate-600 font-mono whitespace-pre-wrap leading-relaxed">' + escapeHtml(wLog.scheduleText) + '</div>' : '') + (showPrivSched ? '<div class="text-[10px] text-indigo-800 font-mono whitespace-pre-wrap leading-relaxed">' + escapeHtml(pLog.scheduleText) + '</div>' : '') + '</div>'
        : '';

      var dayTitleColor = i === 5 ? 'text-indigo-700' : (i === 6 ? 'text-rose-600' : 'text-slate-900');
      var card = document.createElement('div');
      card.className = 'card-surface p-3 space-y-2 text-xs';
      card.innerHTML =
        '<div class="flex items-center justify-between border-b border-slate-100 pb-1.5">' +
          '<span class="font-bold text-xs font-mono ' + dayTitleColor + '">' + (d.getMonth()+1) + '/' + d.getDate() + ' (' + days[i] + ')</span>' +
          '<div class="flex items-center gap-2 shrink-0">' +
            '<button onclick="jumpToReportDate(\'' + dateStr + '\')" class="text-[10px] text-slate-700 bg-slate-100 hover:bg-slate-200 px-2 py-0.5 rounded font-semibold transition">振り返り編集</button>' +
            '<button onclick="jumpToEditDate(\'' + dateStr + '\')" class="text-[10px] text-slate-900 hover:underline font-semibold">記録へ</button>' +
          '</div>' +
        '</div>' +
        '<div class="flex items-center gap-1 flex-wrap">' + badgesHtml + '</div>' +
        quickNoteHtml + kptHtml + schedHtml;
      grid.appendChild(card);
    }

    var avgScore = scoreCnt > 0 ? '★' + (scoreSum / scoreCnt).toFixed(1) : '-';
    var avgCond = condCnt > 0 ? (condSum / condCnt).toFixed(1) : '-';
    var avgSleep = sleepCnt > 0 ? (sleepSum / sleepCnt).toFixed(1) + 'h' : '-';
    var avgSteps = stepCnt > 0 ? Math.round(stepSum / stepCnt).toLocaleString() : '-';
    summaryBar.innerHTML =
      '<div class="bg-slate-50 border border-slate-200/80 rounded-lg py-1.5 px-0.5"><div class="text-[8px] font-semibold text-slate-500">平均評価</div><div class="text-[11px] font-mono tabular-nums font-bold text-slate-900 mt-0.5">' + avgScore + '</div></div>' +
      '<div class="bg-slate-50 border border-slate-200/80 rounded-lg py-1.5 px-0.5"><div class="text-[8px] font-semibold text-slate-500">平均体調</div><div class="text-[11px] font-mono tabular-nums font-bold text-slate-900 mt-0.5">' + avgCond + '</div></div>' +
      '<div class="bg-slate-50 border border-slate-200/80 rounded-lg py-1.5 px-0.5"><div class="text-[8px] font-semibold text-slate-500">平均睡眠</div><div class="text-[11px] font-mono tabular-nums font-bold text-slate-900 mt-0.5">' + avgSleep + '</div></div>' +
      '<div class="bg-slate-50 border border-slate-200/80 rounded-lg py-1.5 px-0.5"><div class="text-[8px] font-semibold text-slate-500">平均歩数</div><div class="text-[11px] font-mono tabular-nums font-bold text-indigo-900 mt-0.5">' + avgSteps + '</div></div>' +
      '<div class="bg-slate-50 border border-slate-200/80 rounded-lg py-1.5 px-0.5"><div class="text-[8px] font-semibold text-slate-500">KPT記入</div><div class="text-[11px] font-mono tabular-nums font-bold text-slate-900 mt-0.5">' + kptDays + '/7日</div></div>';
  }

  function changeWeek(offset) { currentWeekStartDate.setDate(currentWeekStartDate.getDate() + (offset * 7)); renderWeekly(); }
  function resetToThisWeek() { currentWeekStartDate = getMonday(new Date()); renderWeekly(); }
  function jumpToEditDate(dateStr) {
    document.getElementById('targetDate').value = dateStr;
    onTargetDateChanged();
    switchView('form');
  }
  function jumpToReportDate(dateStr) {
    document.getElementById('targetDate').value = dateStr;
    onTargetDateChanged();
    switchView('form');
    switchSubTab('report');
  }
</script>
