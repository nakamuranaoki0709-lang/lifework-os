<div id="workTimerCard" class="card-surface p-3.5 space-y-2.5">
  <div class="flex items-center justify-between border-b border-slate-100 pb-1.5">
    <div class="flex items-center gap-2">
      <span class="text-[11px] font-bold text-slate-800 uppercase tracking-wider">活動ログ・タイマー</span>
      <span id="recordedTodayCountBadge" class="text-[9px] font-mono font-semibold px-1.5 py-0.5 rounded bg-slate-100 text-slate-600">
        本日 0件
      </span>
    </div>
    <button type="button" onclick="openMasterOptionManager('activityCats')" class="text-[10px] font-semibold text-slate-500 hover:text-slate-900 px-1.5 py-0.5 rounded bg-slate-100" title="カテゴリ追加・削除">
      <i class="fa-solid fa-gear mr-0.5"></i>カテゴリ設定
    </button>
  </div>

  <div class="space-y-2">
    <div class="flex items-center gap-1.5">
      <select id="timerCategorySelect" class="px-2 py-1.5 border border-slate-200 rounded-lg text-[11px] font-semibold text-slate-800 bg-slate-50 shrink-0 outline-none max-w-[125px]"></select>
      <input type="text" id="timerTaskInput" placeholder="活動・学習の内容を入力..." class="flex-1 px-2.5 py-1.5 border border-slate-200 rounded-lg text-xs outline-none focus:border-slate-900 transition">
    </div>

    <div id="timerIdleArea" class="space-y-2">
      <div class="grid grid-cols-2 gap-1.5">
        <button type="button" onclick="startActivityTimer(false)" class="py-1.5 px-2.5 bg-slate-900 hover:bg-slate-800 active:scale-95 text-white rounded-lg text-[11px] font-semibold flex items-center justify-center gap-1.5 transition">
          <i class="fa-solid fa-play text-[9px]"></i> 計測開始
        </button>
        <button type="button" onclick="startActivityTimer(true)" class="py-1.5 px-2.5 bg-slate-700 hover:bg-slate-600 active:scale-95 text-white rounded-lg text-[11px] font-semibold flex items-center justify-center gap-1.5 transition">
          <i class="fa-solid fa-clock text-[9px]"></i> 25分集中
        </button>
      </div>

      <div class="flex items-center gap-1.5 pt-1.5 border-t border-slate-100">
        <button type="button" onclick="addManualTimeActivityLog()" class="py-1 px-2.5 bg-slate-100 hover:bg-slate-200 active:scale-95 text-slate-900 border border-slate-200 rounded-md text-[11px] font-bold shrink-0 transition">
          + 記録
        </button>
        <input type="time" id="manualLogStart" class="px-1.5 py-1 border border-slate-200 rounded-md text-[11px] font-mono bg-slate-50 outline-none">
        <span class="text-slate-400 text-xs">-</span>
        <input type="time" id="manualLogEnd" class="px-1.5 py-1 border border-slate-200 rounded-md text-[11px] font-mono bg-slate-50 outline-none">
      </div>
    </div>

    <div id="timerRunningArea" class="bg-slate-900 text-white p-2.5 rounded-xl space-y-2 hidden">
      <div class="flex items-center justify-between gap-2">
        <div class="min-w-0 flex-1">
          <div class="flex items-center gap-1.5">
            <span id="timerRunningCat" class="text-[9px] font-semibold bg-white/10 text-slate-200 px-1.5 py-0.2 rounded"></span>
            <span id="timerRunningStart" class="text-[9px] font-mono text-slate-400"></span>
          </div>
          <div id="timerRunningTitle" class="text-xs font-bold text-white truncate mt-0.5"></div>
        </div>
        <div class="text-right shrink-0">
          <div id="timerClockDisplay" class="text-lg font-mono tabular-nums font-bold text-white leading-none">00:00</div>
          <div id="timerPomodoroRemain" class="text-[9px] font-mono text-slate-300 mt-0.5 hidden"></div>
        </div>
      </div>
      <div class="flex items-center gap-1.5">
        <button type="button" onclick="stopAndSaveActivityTimer()" class="flex-1 py-1.5 bg-white hover:bg-slate-100 active:scale-95 text-slate-900 font-bold rounded-lg text-xs flex items-center justify-center gap-1.5 transition">
          <i class="fa-solid fa-stop text-[10px]"></i> 完了して記録
        </button>
        <button type="button" onclick="cancelActivityTimer()" class="px-2.5 py-1.5 bg-white/10 hover:bg-white/20 text-slate-300 font-semibold rounded-lg text-[10px] transition">
          破棄
        </button>
      </div>
    </div>
  </div>

  <div class="pt-1.5 border-t border-slate-100 space-y-1.5">
    <div class="flex items-center gap-2 text-[9px] text-slate-400 font-semibold">
      <button type="button" onclick="saveCurrentAsTaskPreset()" class="text-slate-700 hover:underline font-bold">
        + 入力内容を定型保存
      </button>
      <span>| 定型テンプレート</span>
    </div>
    <div id="taskPresetChipsArea" class="flex items-center gap-1.5 flex-wrap"></div>
  </div>
</div>

<script>
  App.mount('#slot-subtab-tasks', 'workTimerCard');

  var KEY_ACTIVE_TIMER = 'worklife_os_active_timer_v1';
  var KEY_TASK_PRESETS = 'worklife_os_task_presets_v1';
  var timerTickInterval = null;

  var DEFAULT_TASK_PRESETS = {
    work: [
      { cat: 'コア業務', text: '集中作業・資料作成' },
      { cat: '会議・調整', text: '定例ミーティング' },
      { cat: '作業・事務', text: 'メール・連絡対応' }
    ],
    private: [
      { cat: '資格取得', text: '資格テキスト学習・過去問演習' },
      { cat: 'プログラミング', text: '開発・コーディング' },
      { cat: '運動・健康', text: 'トレーニング・ストレッチ' }
    ]
  };

  function getTaskPresetsStore() {
    try {
      var raw = localStorage.getItem(KEY_TASK_PRESETS);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    return JSON.parse(JSON.stringify(DEFAULT_TASK_PRESETS));
  }

  function saveTaskPresetsStore(store) {
    try { localStorage.setItem(KEY_TASK_PRESETS, JSON.stringify(store)); } catch (e) {}
  }

  function updateTimerCategoryOptions() {
    var sel = document.getElementById('timerCategorySelect');
    if (!sel) return;
    var prev = sel.value;
    sel.innerHTML = '';
    var cats = getMasterOptions().activityCats;
    cats.forEach(function(c) {
      var opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c;
      sel.appendChild(opt);
    });
    if (prev && cats.indexOf(prev) !== -1) sel.value = prev;
    renderTaskPresetChips();
  }

  function renderTaskPresetChips() {
    var area = document.getElementById('taskPresetChipsArea');
    if (!area) return;
    area.innerHTML = '';
    var store = getTaskPresetsStore();
    var domKey = (currentDomain === 'private') ? 'private' : 'work';
    var list = (currentDomain === 'all')
      ? (store.work || []).concat(store.private || [])
      : (store[domKey] || []);

    list.forEach(function(p, idx) {
      var chip = document.createElement('div');
      chip.className = 'inline-flex items-center bg-slate-100 hover:bg-slate-200/80 border border-slate-200 rounded-md text-[10px] font-medium text-slate-800 overflow-hidden';
      chip.innerHTML =
        '<button type="button" onclick="applyTaskPreset(\'' + escapeHtml(p.cat).replace(/'/g, '&#39;') + '\', \'' + escapeHtml(p.text).replace(/'/g, '&#39;') + '\')" class="px-2 py-1 flex items-center gap-1 text-left">' +
          '<span class="text-[8px] font-bold text-slate-500">[' + escapeHtml(p.cat) + ']</span>' +
          '<span>' + escapeHtml(p.text) + '</span>' +
        '</button>' +
        '<button type="button" onclick="deleteTaskPreset(\'' + domKey + '\', ' + idx + ')" class="px-1.5 py-1 text-slate-400 hover:text-rose-600 border-l border-slate-200/70" title="削除"><i class="fa-solid fa-xmark text-[8px]"></i></button>';
      area.appendChild(chip);
    });
  }

  function applyTaskPreset(cat, text) {
    var tCat = document.getElementById('timerCategorySelect');
    var tInp = document.getElementById('timerTaskInput');
    if (tCat) tCat.value = cat;
    if (tInp) tInp.value = text;
  }

  function saveCurrentAsTaskPreset() {
    var cat = document.getElementById('timerCategorySelect').value || 'コア業務';
    var text = (document.getElementById('timerTaskInput').value || '').trim();
    if (!text) return showToast('定型保存する作業名を入力してください', true);

    var store = getTaskPresetsStore();
    var domKey = (currentDomain === 'private') ? 'private' : 'work';
    if (!store[domKey]) store[domKey] = [];
    store[domKey].push({ cat: cat, text: text });
    saveTaskPresetsStore(store);
    renderTaskPresetChips();
    showToast('定型テンプレートに追加しました');
  }

  function deleteTaskPreset(domKey, idx) {
    var store = getTaskPresetsStore();
    if (store[domKey] && store[domKey][idx]) {
      store[domKey].splice(idx, 1);
      saveTaskPresetsStore(store);
      renderTaskPresetChips();
    }
  }

  function addManualTimeActivityLog() {
    var cat = document.getElementById('timerCategorySelect').value || 'コア業務';
    var text = document.getElementById('timerTaskInput').value.trim();
    var st = document.getElementById('manualLogStart').value;
    var et = document.getElementById('manualLogEnd').value;
    if (!text) return showToast('作業・学習内容を入力してください', true);
    if (!st || !et) return showToast('開始時刻と終了時刻を入力してください', true);

    var dateStr = document.getElementById('targetDate').value;
    var targetDom = (currentDomain === 'private') ? 'private' : 'work';
    var log = (targetDom === 'private') ? getOrCreatePrivateLog(dateStr) : getOrCreateWorkLog(dateStr);
    var item = st + ' - ' + et + ' [' + cat + '] ' + text;
    log.scheduleText = log.scheduleText ? (log.scheduleText + '\n' + item) : item;

    document.getElementById('timerTaskInput').value = '';
    refreshAll();
    enqueueSync(targetDom === 'private' ? 'syncPrivateDailyLog' : 'syncWorkDailyLog', dateStr, log);
    showToast('活動ログを記録しました');
  }

  function getActiveTimerData() {
    try {
      var raw = localStorage.getItem(KEY_ACTIVE_TIMER);
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
  }

  function startActivityTimer(isPomodoro, linkedTodoId, overrideDomain, overrideCat) {
    var cat = overrideCat || document.getElementById('timerCategorySelect').value || 'コア業務';
    var text = document.getElementById('timerTaskInput').value.trim() || (isPomodoro ? '集中セッション' : '作業セッション');
    var now = new Date();
    var hh = ('0' + now.getHours()).slice(-2);
    var mm = ('0' + now.getMinutes()).slice(-2);
    var targetDom = overrideDomain || ((currentDomain === 'private') ? 'private' : 'work');

    var timerObj = {
      startMs: now.getTime(),
      startHHMM: hh + ':' + mm,
      dateStr: document.getElementById('targetDate').value || formatDateLocal(now),
      category: cat,
      text: text,
      domain: targetDom,
      isPomodoro: !!isPomodoro,
      linkedTodoId: linkedTodoId || ''
    };
    localStorage.setItem(KEY_ACTIVE_TIMER, JSON.stringify(timerObj));
    renderTimerUI();
    if (typeof renderFullTodoView === 'function') renderFullTodoView();
    if (typeof renderHomeTodoPreview === 'function') renderHomeTodoPreview();
    showToast('計測を開始しました');
  }

  function stopAndSaveActivityTimer() {
    var t = getActiveTimerData();
    if (!t) return;
    var now = new Date();
    var elapsedMin = Math.max(1, Math.round((now.getTime() - t.startMs) / 60000));
    var endHHMM = ('0' + now.getHours()).slice(-2) + ':' + ('0' + now.getMinutes()).slice(-2);
    if (endHHMM === t.startHHMM) {
      var plus1 = new Date(now.getTime() + 60000);
      endHHMM = ('0' + plus1.getHours()).slice(-2) + ':' + ('0' + plus1.getMinutes()).slice(-2);
    }

    var dateStr = t.dateStr || document.getElementById('targetDate').value;
    var log = (t.domain === 'private') ? getOrCreatePrivateLog(dateStr) : getOrCreateWorkLog(dateStr);
    var item = t.startHHMM + ' - ' + endHHMM + ' [' + t.category + '] ' + t.text;
    log.scheduleText = log.scheduleText ? (log.scheduleText + '\n' + item) : item;

    if (t.linkedTodoId && Array.isArray(db.todos)) {
      var todo = db.todos.find(function(x) { return x.id === t.linkedTodoId; });
      if (todo) {
        todo.spentMinutes = (Number(todo.spentMinutes) || 0) + elapsedMin;
        if (typeof saveTodosAndSync === 'function') saveTodosAndSync();
      }
    }

    localStorage.removeItem(KEY_ACTIVE_TIMER);
    document.getElementById('timerTaskInput').value = '';
    renderTimerUI();
    refreshAll();
    enqueueSync(t.domain === 'private' ? 'syncPrivateDailyLog' : 'syncWorkDailyLog', dateStr, log);
    showToast('計測完了（' + elapsedMin + '分）を記録しました');
  }

  function cancelActivityTimer() {
    localStorage.removeItem(KEY_ACTIVE_TIMER);
    renderTimerUI();
    if (typeof renderFullTodoView === 'function') renderFullTodoView();
    if (typeof renderHomeTodoPreview === 'function') renderHomeTodoPreview();
    showToast('タイマーを破棄しました', true);
  }

  function formatElapsedSec(sec) {
    var h = Math.floor(sec / 3600);
    var m = Math.floor((sec % 3600) / 60);
    var s = sec % 60;
    if (h > 0) return ('0' + h).slice(-2) + ':' + ('0' + m).slice(-2) + ':' + ('0' + s).slice(-2);
    return ('0' + m).slice(-2) + ':' + ('0' + s).slice(-2);
  }

  function renderTimerUI() {
    var t = getActiveTimerData();
    var idleEl = document.getElementById('timerIdleArea');
    var runEl = document.getElementById('timerRunningArea');
    if (!idleEl || !runEl) return;

    if (timerTickInterval) { clearInterval(timerTickInterval); timerTickInterval = null; }

    if (!t) {
      idleEl.classList.remove('hidden');
      runEl.classList.add('hidden');
      return;
    }

    idleEl.classList.add('hidden');
    runEl.classList.remove('hidden');

    document.getElementById('timerRunningCat').textContent = t.category;
    document.getElementById('timerRunningStart').textContent = t.startHHMM + '〜';
    document.getElementById('timerRunningTitle').textContent = t.text;

    function tick() {
      var elapsedSec = Math.max(0, Math.floor((Date.now() - t.startMs) / 1000));
      var disp = formatElapsedSec(elapsedSec);
      var clockEl = document.getElementById('timerClockDisplay');
      if (clockEl) clockEl.textContent = disp;

      var hdrStats = document.getElementById('headerQuickStats');
      if (hdrStats) hdrStats.textContent = '計測中 ' + disp + ' | ' + t.text.slice(0, 10);

      var pomoEl = document.getElementById('timerPomodoroRemain');
      if (pomoEl) {
        if (t.isPomodoro) {
          var remain = (25 * 60) - elapsedSec;
          pomoEl.classList.remove('hidden');
          pomoEl.textContent = remain >= 0 ? ('残り ' + formatElapsedSec(remain)) : ('超過 +' + formatElapsedSec(Math.abs(remain)));
        } else {
          pomoEl.classList.add('hidden');
        }
      }
    }
    tick();
    timerTickInterval = setInterval(tick, 1000);
  }

  updateTimerCategoryOptions();
  renderTimerUI();
  App.on('domain:changed', updateTimerCategoryOptions);
  App.on('masterOptions:changed', updateTimerCategoryOptions);
  App.on('data:loaded', function(ctx) {
    if (getActiveTimerData()) renderTimerUI();
    var count = 0;
    if (ctx.wLog && ctx.wLog.scheduleText) count += ctx.wLog.scheduleText.split('\n').filter(Boolean).length;
    if (ctx.pLog && ctx.pLog.scheduleText) count += ctx.pLog.scheduleText.split('\n').filter(Boolean).length;
    var badge = document.getElementById('recordedTodayCountBadge');
    if (badge) badge.textContent = '本日 ' + count + '件';
  });
</script>
