<!-- 前日のTry -->
<div id="prevTryCard" class="card-surface p-2.5 border-l-2 border-l-amber-500 space-y-1 hidden">
  <div class="text-[10px] font-semibold text-slate-500 flex items-center gap-1.5 uppercase tracking-wider">
    <i class="fa-solid fa-arrow-turn-up rotate-90 text-amber-500"></i> Previous Try (<span id="prevTryDate" class="font-mono text-slate-700"></span>)
  </div>
  <div id="prevTryText" class="text-xs font-medium text-slate-800 bg-slate-50 px-2.5 py-1.5 rounded-lg border border-slate-200/80 leading-relaxed"></div>
</div>

<!-- サブ2：振り返り -->
<div id="subContentReport" class="card-surface p-3 space-y-2.5 hidden">
  <div class="bg-slate-50 p-2.5 rounded-lg border border-slate-200/80 space-y-2 text-xs">
    <div class="grid grid-cols-3 gap-1.5">
      <div>
        <label class="block text-[10px] font-semibold text-slate-500 mb-0.5">評価 (1-5)</label>
        <select id="inputGrowthScore" class="w-full px-1.5 py-1 border border-slate-200 rounded-md text-xs font-semibold text-slate-900 bg-white">
          <option value="5">★ 5 (最高)</option>
          <option value="4" selected>★ 4 (良好)</option>
          <option value="3">★ 3 (普通)</option>
          <option value="2">★ 2 (不十分)</option>
          <option value="1">★ 1 (不調)</option>
        </select>
      </div>

      <div>
        <label class="block text-[10px] font-semibold text-slate-500 mb-0.5">体調 (1-5)</label>
        <select id="inputCondition" class="w-full px-1.5 py-1 border border-slate-200 rounded-md text-xs font-semibold text-slate-900 bg-white">
          <option value="5">5: 絶好調</option>
          <option value="4">4: 良好</option>
          <option value="3" selected>3: 普通</option>
          <option value="2">2: やや不調</option>
          <option value="1">1: 不調</option>
        </select>
      </div>

      <div>
        <label class="block text-[10px] font-semibold text-slate-500 mb-0.5">睡眠時間 (自動)</label>
        <div class="flex items-center gap-0.5">
          <input type="number" id="inputSleepHours" step="0.1" min="0" max="24" value="7.0" class="w-full px-1.5 py-1 border border-slate-200 rounded-md text-xs font-mono tabular-nums font-bold text-slate-900 bg-white">
          <span class="text-[10px] text-slate-400 font-semibold">h</span>
        </div>
      </div>
    </div>

    <div id="workQuickNoteField">
      <label class="flex items-center gap-1.5 text-[10px] font-semibold text-slate-700 mb-0.5">
        <span class="bg-slate-800 text-white px-1.5 py-0.2 rounded text-[9px]">仕事</span>
        <span>今日の一言メモ（仕事の所感・状況）</span>
      </label>
      <input type="text" id="inputWorkQuickNote" placeholder="仕事の一言メモ..." class="w-full px-2.5 py-1.5 border border-slate-200 rounded-md text-xs bg-white outline-none focus:border-slate-900 transition">
    </div>

    <div id="privateQuickNoteField" class="hidden">
      <label class="flex items-center gap-1.5 text-[10px] font-semibold text-slate-700 mb-0.5">
        <span class="bg-indigo-700 text-white px-1.5 py-0.2 rounded text-[9px]">私用</span>
        <span>今日の一言メモ（私用・学習の所感）</span>
      </label>
      <input type="text" id="inputPrivateQuickNote" placeholder="私用・学習の一言メモ..." class="w-full px-2.5 py-1.5 border border-slate-200 rounded-md text-xs bg-white outline-none focus:border-indigo-700 transition">
    </div>
  </div>

  <div id="kptFieldsArea" class="space-y-2 text-xs pt-0.5">
    <div>
      <label class="block font-semibold text-emerald-800 text-[11px] mb-0.5">Keep (継続・成果)</label>
      <textarea id="inputReportKeep" rows="2" placeholder="良かった点、継続すべき取り組み..." class="w-full px-2.5 py-1.5 border border-slate-200 rounded-lg text-xs leading-relaxed outline-none focus:border-slate-900 transition"></textarea>
    </div>
    <div>
      <label class="block font-semibold text-rose-800 text-[11px] mb-0.5">Problem (課題・反省)</label>
      <textarea id="inputReportProblem" rows="2" placeholder="問題点、改善すべきボトルネック..." class="w-full px-2.5 py-1.5 border border-slate-200 rounded-lg text-xs leading-relaxed outline-none focus:border-slate-900 transition"></textarea>
    </div>
    <div>
      <label class="block font-semibold text-slate-800 text-[11px] mb-0.5">Insight (学び・気付き)</label>
      <textarea id="inputReportInsight" rows="2" placeholder="得られた知見、次回への知恵..." class="w-full px-2.5 py-1.5 border border-slate-200 rounded-lg text-xs leading-relaxed outline-none focus:border-slate-900 transition"></textarea>
    </div>
    <div>
      <label class="block font-semibold text-amber-800 text-[11px] mb-0.5">Try (具体的な改善行動)</label>
      <textarea id="inputReportTry" rows="2" placeholder="明日実行する具体的なアクション..." class="w-full px-2.5 py-1.5 border border-slate-200 rounded-lg text-xs leading-relaxed outline-none focus:border-slate-900 transition"></textarea>
    </div>
  </div>

  <button onclick="saveReportOnly()" class="w-full py-2 bg-slate-900 hover:bg-slate-800 active:scale-99 text-white font-semibold rounded-lg text-xs transition">
    振り返り・体調を保存
  </button>
</div>

<script>
  App.mount('#slot-home-prevtry', 'prevTryCard');
  App.mount('#slot-subtab-report', 'subContentReport');

  App.on('domain:changed', function() {
    var showWork = (currentDomain === 'work' || currentDomain === 'all');
    var showPriv = (currentDomain === 'private' || currentDomain === 'all');
    document.getElementById('kptFieldsArea').classList.toggle('hidden', !showWork);
    document.getElementById('workQuickNoteField').classList.toggle('hidden', !showWork);
    document.getElementById('privateQuickNoteField').classList.toggle('hidden', !showPriv);
  });

  App.on('data:loaded', function(ctx) {
    var dateStr = ctx.dateStr, wLog = ctx.wLog, pLog = ctx.pLog;
    var computedSleep = computeSleepForDate(dateStr).sleepHours;
    var storedSleep = (pLog && pLog.sleepHours !== null && pLog.sleepHours !== undefined) ? pLog.sleepHours : null;
    var effectiveSleep = (computedSleep !== null) ? computedSleep : storedSleep;
    var reportSleep = (effectiveSleep !== null) ? effectiveSleep : ((wLog && wLog.sleepHours !== undefined) ? wLog.sleepHours : 7.0);

    var activeScore = (currentDomain === 'private')
      ? (pLog && pLog.score !== undefined ? pLog.score : 4)
      : (wLog && wLog.growthScore !== undefined ? wLog.growthScore : 4);

    document.getElementById('inputGrowthScore').value = activeScore;
    document.getElementById('inputCondition').value = wLog ? (wLog.condition || 3) : 3;
    document.getElementById('inputSleepHours').value = reportSleep;
    document.getElementById('inputWorkQuickNote').value = wLog ? (wLog.quickNote || '') : '';
    document.getElementById('inputPrivateQuickNote').value = getPrivateQuickNote(pLog);

    document.getElementById('inputReportKeep').value = wLog ? (wLog.reportKeep || '') : '';
    document.getElementById('inputReportProblem').value = wLog ? (wLog.reportProblem || '') : '';
    document.getElementById('inputReportInsight').value = wLog ? (wLog.reportInsight || '') : '';
    document.getElementById('inputReportTry').value = wLog ? (wLog.reportTry || '') : '';

    var prevCard = document.getElementById('prevTryCard');
    if (currentDomain === 'work' || currentDomain === 'all') {
      var sorted = db.workLogs.slice().sort(function(a, b) { return a.date < b.date ? 1 : -1; });
      var prev = sorted.find(function(l) { return l.date < dateStr && l.reportTry && l.reportTry.trim() !== ''; });
      if (prev) {
        document.getElementById('prevTryDate').textContent = prev.date;
        document.getElementById('prevTryText').textContent = prev.reportTry;
        prevCard.classList.remove('hidden');
      } else {
        prevCard.classList.add('hidden');
      }
    } else {
      prevCard.classList.add('hidden');
    }
  });

  function saveReportOnly() {
    var date = document.getElementById('targetDate').value;
    var scoreVal = parseInt(document.getElementById('inputGrowthScore').value, 10) || 4;
    var condVal = parseInt(document.getElementById('inputCondition').value, 10) || 3;
    var sleepVal = parseFloat(document.getElementById('inputSleepHours').value) || 7.0;

    var wLog = getOrCreateWorkLog(date);
    wLog.condition = condVal;
    wLog.sleepHours = sleepVal;

    if (currentDomain === 'work' || currentDomain === 'all') {
      wLog.growthScore = scoreVal;
      wLog.quickNote = document.getElementById('inputWorkQuickNote').value;
      wLog.reportKeep = document.getElementById('inputReportKeep').value;
      wLog.reportProblem = document.getElementById('inputReportProblem').value;
      wLog.reportInsight = document.getElementById('inputReportInsight').value;
      wLog.reportTry = document.getElementById('inputReportTry').value;
    }
    enqueueSync('syncWorkDailyLog', date, wLog);

    if (currentDomain === 'private' || currentDomain === 'all') {
      var pLog = getOrCreatePrivateLog(date);
      if (currentDomain === 'private') pLog.score = scoreVal;
      pLog.sleepHours = sleepVal;
      setPrivateQuickNote(pLog, document.getElementById('inputPrivateQuickNote').value);
      enqueueSync('syncPrivateDailyLog', date, pLog);
    }

    refreshAll();
    showToast('体調・振り返りを保存しました');
  }
</script>
