<!-- 当日専用：習慣トラッカー -->
<div id="habitTrackerCard" class="card-surface p-3 space-y-2.5 border-t-2 border-t-blue-950">
  <div class="flex items-center justify-between border-b border-slate-100 pb-2">
    <div class="flex items-center gap-2 min-w-0">
      <span class="w-5 h-5 rounded-md bg-blue-950 text-white flex items-center justify-center text-[10px] shrink-0">
        <i class="fa-solid fa-layer-group"></i>
      </span>
      <span id="habitCardTitle" class="text-xs font-bold text-slate-900 truncate">今日の習慣</span>
      <span id="habitDailyProgressBadge" class="text-[10px] font-mono tabular-nums font-semibold px-1.5 py-0.5 rounded-md bg-slate-100 text-slate-600 shrink-0">
        0/0
      </span>
    </div>

    <div class="flex items-center gap-1.5 shrink-0">
      <button onclick="toggleManualHabitMode()" id="habitModeToggleBtn" title="タップで通常/最小モード切替" class="text-[9px] font-semibold px-2 py-1 rounded-md bg-slate-100 text-slate-700 border border-slate-200 transition active:scale-95">
        通常モード
      </button>
      <button onclick="openHabitManagerModal()" title="習慣メニュー設定・並び替え" class="text-[10px] text-slate-500 hover:text-slate-900 bg-slate-100 hover:bg-slate-200/80 w-6.5 h-6.5 rounded-md flex items-center justify-center transition">
        <i class="fa-solid fa-sliders"></i>
      </button>
    </div>
  </div>
  <div id="habitConditionAlert" class="text-[10px] px-2.5 py-1.5 rounded-lg bg-amber-50/90 border border-amber-200 text-amber-900 font-medium hidden"></div>
  <div id="habitDailyListArea" class="space-y-2"></div>
</div>

<!-- 習慣マスタ設定・並び替えモーダル -->
<div id="habitModal" class="fixed inset-0 z-50 bg-slate-950/60 backdrop-blur-xs hidden flex items-center justify-center p-3" onclick="closeHabitManagerModal()">
  <div class="bg-white rounded-xl max-w-sm w-full p-4 shadow-2xl space-y-3 border border-slate-200" onclick="event.stopPropagation()">
    <div class="flex items-center justify-between border-b border-slate-100 pb-2">
      <span class="text-xs font-bold text-slate-900"><i class="fa-solid fa-sliders text-blue-950 mr-1.5"></i>習慣メニュー設定</span>
      <button onclick="closeHabitManagerModal()" class="text-slate-400 hover:text-slate-800 w-6 h-6 rounded-md bg-slate-100 text-xs"><i class="fa-solid fa-xmark"></i></button>
    </div>

    <div class="grid grid-cols-2 gap-1 bg-slate-100 p-1 rounded-lg text-[10px] font-bold">
      <button type="button" id="habDomTabWork" onclick="switchHabitManagerDomain('work')" class="py-1 rounded bg-blue-950 text-white">仕事習慣</button>
      <button type="button" id="habDomTabPriv" onclick="switchHabitManagerDomain('private')" class="py-1 rounded text-slate-600">私用・学習習慣</button>
    </div>

    <form onsubmit="addNewHabitMaster(event)" class="space-y-2 bg-slate-50 p-3 rounded-lg border border-slate-200 text-xs">
      <input type="text" id="newHabitName" required placeholder="習慣名（例：朝イチ優先順位付け）" class="w-full px-2.5 py-1.5 border border-slate-200 rounded-md bg-white text-xs font-semibold outline-none focus:border-blue-950">
      <div class="grid grid-cols-2 gap-1.5">
        <select id="newHabitTimeSlot" class="px-2 py-1.5 border border-slate-200 rounded-md bg-white text-[11px] font-semibold text-slate-800">
          <option value="any">◆ 時間帯: いつでも</option>
          <option value="morning">▲ 時間帯: 朝</option>
          <option value="day">● 時間帯: 日中</option>
          <option value="night">▼ 時間帯: 夜</option>
        </select>
        <select id="newHabitFreq" class="px-2 py-1.5 border border-slate-200 rounded-md bg-white text-[11px] font-semibold text-slate-800">
          <option value="daily">■ 曜日: 毎日</option>
          <option value="weekday">■ 曜日: 平日のみ</option>
          <option value="weekend">■ 曜日: 土日のみ</option>
        </select>
      </div>
      <input type="text" id="newHabitNormal" required placeholder="通常目標（例：重要タスク3つと時間枠を決める）" class="w-full px-2.5 py-1.5 border border-slate-200 rounded-md bg-white text-xs outline-none focus:border-blue-950">
      <input type="text" id="newHabitMin" required placeholder="最小目標・2分ルール（例：最優先1つだけ決める）" class="w-full px-2.5 py-1.5 border border-slate-200 rounded-md bg-white text-xs outline-none focus:border-blue-950">
      <button type="submit" class="w-full py-1.5 bg-blue-950 hover:bg-blue-900 text-white font-semibold rounded-md text-xs transition">習慣を追加</button>
    </form>

    <div class="flex items-center justify-between text-[10px] text-slate-400 px-0.5">
      <span>↑↓で並び替え ／ バッジタップで時間帯・曜日を変更</span>
    </div>
    <div id="habitMasterListArea" class="space-y-1.5 max-h-56 overflow-y-auto text-xs"></div>
  </div>
</div>

<script>
  App.mount('#slot-home-habits', 'habitTrackerCard');
  App.mount('#slot-modals', 'habitModal');

  var manualHabitModeOverride = null;
  var showInactiveWeekdayHabits = false;
  var activeHabitManagerDom = 'work';

  var TIME_SLOT_LABELS = {
    morning: '<i class="fa-regular fa-sun text-amber-600 mr-1"></i>朝のルーティン',
    day: '<i class="fa-solid fa-bolt text-sky-700 mr-1"></i>日中のルーティン',
    night: '<i class="fa-regular fa-moon text-indigo-700 mr-1"></i>夜のルーティン',
    any: '<i class="fa-solid fa-layer-group text-slate-500 mr-1"></i>いつでも'
  };
  var TIME_SLOT_SHORT = { morning: '▲ 朝', day: '● 日中', night: '▼ 夜', any: '◆ いつでも' };
  var FREQ_SHORT = { daily: '毎日', weekday: '平日のみ', weekend: '土日のみ' };

  function getHabitMeta(h) {
    var raw = String((h && h.category) || '');
    var parts = raw.split(':');
    var slot = (parts[0] === 'morning' || parts[0] === 'day' || parts[0] === 'night') ? parts[0] : 'any';
    var freq = (parts[1] === 'weekday' || parts[1] === 'weekend') ? parts[1] : 'daily';
    return { timeSlot: slot, freq: freq };
  }

  function setHabitMeta(h, slot, freq) {
    if (!h) return;
    h.category = (slot || 'any') + ':' + (freq || 'daily');
  }

  function isHabitActiveOnDate(h, dateStr) {
    var meta = getHabitMeta(h);
    if (meta.freq === 'daily') return true;
    var d = new Date(String(dateStr || formatDateLocal(new Date())) + 'T12:00:00');
    var day = d.getDay();
    var isWeekend = (day === 0 || day === 6);
    if (meta.freq === 'weekday') return !isWeekend;
    if (meta.freq === 'weekend') return isWeekend;
    return true;
  }

  function saveHabitOrderLocal() {
    saveLocalCache();
  }

  App.on('domain:changed', function() {
    manualHabitModeOverride = null;
  });

  App.on('data:loaded', function(ctx) {
    renderDailyHabitList(ctx.dateStr, ctx.wLog, ctx.pLog);
  });

  function isFatigueDay(wLog, pLog) {
    var cond = (wLog && wLog.condition !== undefined) ? Number(wLog.condition) : 3;
    var sleep = (pLog && pLog.sleepHours !== null && pLog.sleepHours !== undefined)
      ? Number(pLog.sleepHours)
      : ((wLog && wLog.sleepHours !== undefined) ? Number(wLog.sleepHours) : 7.0);
    var over = (wLog && wLog.overtimeHours !== undefined) ? Number(wLog.overtimeHours) : 0;
    return (cond <= 2 || sleep < 6.0 || over >= 2.0);
  }

  function toggleManualHabitMode() {
    var dateStr = document.getElementById('targetDate').value;
    var wLog = (db.workLogs || []).find(function(l) { return l.date === dateStr; });
    var pLog = (db.privateLogs || []).find(function(l) { return l.date === dateStr; });
    var autoMin = isFatigueDay(wLog, pLog);
    var cur = manualHabitModeOverride || (autoMin ? 'min' : 'normal');
    manualHabitModeOverride = (cur === 'min') ? 'normal' : 'min';
    refreshAll();
  }

  function toggleInactiveHabitsDisplay() {
    showInactiveWeekdayHabits = !showInactiveWeekdayHabits;
    refreshAll();
  }

  function getHabitsForCurrentDomain() {
    var list = [];
    (db.workHabits || []).forEach(function(h) { list.push(Object.assign({ domain: 'work' }, h)); });
    (db.privateHabits || []).forEach(function(h) { list.push(Object.assign({ domain: 'private' }, h)); });
    return list;
  }

  function calculateHabitStreak(domain, habitId, upToDateStr) {
    var logs = (domain === 'work') ? (db.workLogs || []) : (db.privateLogs || []);
    var sorted = logs.slice().filter(function(l) { return l.date <= upToDateStr; }).sort(function(a, b) { return a.date < b.date ? 1 : -1; });
    var streak = 0;
    for (var i = 0; i < sorted.length; i++) {
      var st = sorted[i].habitMap ? sorted[i].habitMap[habitId] : '';
      if (st === 'min' || st === 'normal') streak++;
      else if (sorted[i].date < upToDateStr) {
        var habObj = (domain === 'work' ? (db.workHabits || []) : (db.privateHabits || [])).find(function(x) { return x.id === habitId; });
        if (habObj && !isHabitActiveOnDate(habObj, sorted[i].date)) continue;
        break;
      }
    }
    return streak;
  }

  function buildHabitRowElement(h, selectedDateStr, wLog, pLog, activeMode) {
    var targetLog = (h.domain === 'work') ? wLog : pLog;
    var status = (targetLog && targetLog.habitMap) ? (targetLog.habitMap[h.id] || '') : '';
    var streak = calculateHabitStreak(h.domain, h.id, selectedDateStr);
    var goalText = (activeMode === 'min') ? h.minGoal : h.normalGoal;
    var meta = getHabitMeta(h);

    var domainPill = (h.domain === 'work')
      ? '<span class="text-[8px] font-semibold bg-blue-950 text-white px-1.5 py-0.2 rounded">仕事</span>'
      : '<span class="text-[8px] font-semibold bg-indigo-900 text-white px-1.5 py-0.2 rounded">私用</span>';
    var freqPill = meta.freq !== 'daily'
      ? '<span class="text-[8px] font-semibold bg-slate-200/80 text-slate-600 px-1 py-0.2 rounded">' + FREQ_SHORT[meta.freq] + '</span>'
      : '';

    var cardStyle = 'bg-slate-50/70 border-slate-200 hover:border-slate-400';
    var checkCircle = '<span class="w-5 h-5 rounded-md border border-slate-300 bg-white flex items-center justify-center shrink-0 transition"></span>';
    var statusPill = '<span class="text-[9px] font-mono font-semibold text-slate-400 bg-white border border-slate-200 px-2 py-0.5 rounded-md shrink-0">PENDING</span>';

    if (status === 'min') {
      cardStyle = 'bg-amber-50/40 border-amber-300';
      checkCircle = '<span class="w-5 h-5 rounded-md bg-amber-600 text-white flex items-center justify-center text-[10px] shrink-0"><i class="fa-solid fa-bolt"></i></span>';
      statusPill = '<span class="text-[9px] font-mono font-semibold text-amber-900 bg-amber-100/80 border border-amber-300 px-2 py-0.5 rounded-md shrink-0">MIN CLEAR</span>';
    } else if (status === 'normal') {
      cardStyle = 'bg-emerald-50/40 border-emerald-300';
      checkCircle = '<span class="w-5 h-5 rounded-md bg-emerald-800 text-white flex items-center justify-center text-[10px] shrink-0"><i class="fa-solid fa-check"></i></span>';
      statusPill = '<span class="text-[9px] font-mono font-semibold text-emerald-900 bg-emerald-100/80 border border-emerald-300 px-2 py-0.5 rounded-md shrink-0">DONE</span>';
    }

    var row = document.createElement('button');
    row.type = 'button';
    row.onclick = function() { cycleHabitStatusToday(h.domain, h.id); };
    row.className = 'w-full text-left flex items-center justify-between gap-2.5 px-2.5 py-2 rounded-lg border transition active:scale-[0.99] ' + cardStyle;
    row.innerHTML =
      '<div class="flex items-center gap-2.5 min-w-0 flex-1">' + checkCircle +
        '<div class="min-w-0 flex-1">' +
          '<div class="flex items-center gap-1.5 flex-wrap">' + domainPill + freqPill +
            '<span class="font-semibold text-xs text-slate-900 truncate">' + escapeHtml(h.name) + '</span>' +
            (streak > 0 ? '<span class="text-[9px] font-mono font-semibold text-slate-600 bg-slate-200/70 px-1.5 py-0.2 rounded shrink-0"><i class="fa-solid fa-fire-flame-curved text-orange-600 mr-0.5"></i>' + streak + 'd</span>' : '') +
          '</div>' +
          '<div class="text-[10px] text-slate-500 truncate mt-0.5">' + escapeHtml(goalText) + '</div>' +
        '</div>' +
      '</div>' + statusPill;
    return row;
  }

  function renderDailyHabitList(selectedDateStr, wLog, pLog) {
    var area = document.getElementById('habitDailyListArea');
    var modeBtn = document.getElementById('habitModeToggleBtn');
    var progressBadge = document.getElementById('habitDailyProgressBadge');
    var alertBox = document.getElementById('habitConditionAlert');
    if (!area || !modeBtn || !progressBadge || !alertBox) return;
    area.innerHTML = '';

    var autoFatigue = isFatigueDay(wLog, pLog);
    var activeMode = manualHabitModeOverride || (autoFatigue ? 'min' : 'normal');

    if (activeMode === 'min') {
      modeBtn.className = 'text-[9px] font-semibold px-2 py-1 rounded-md bg-amber-50 text-amber-800 border border-amber-300 transition active:scale-95';
      modeBtn.innerHTML = '<i class="fa-solid fa-bolt text-amber-600 mr-1"></i>最小モード';
    } else {
      modeBtn.className = 'text-[9px] font-semibold px-2 py-1 rounded-md bg-slate-100 text-slate-700 border border-slate-200 transition active:scale-95';
      modeBtn.innerHTML = '<i class="fa-solid fa-sliders text-slate-500 mr-1"></i>通常モード';
    }

    if (autoFatigue) {
      alertBox.innerHTML = '<i class="fa-solid fa-bolt text-amber-600 mr-1"></i>コンディション低下・残業を検知：ハードルを下げた「最小目標」で継続をつなぎます';
      alertBox.classList.remove('hidden');
    } else {
      alertBox.classList.add('hidden');
    }

    var allHabits = getHabitsForCurrentDomain();
    if (allHabits.length === 0) {
      progressBadge.textContent = '0/0';
      area.innerHTML = '<div class="text-[10px] text-slate-400 py-2 text-center">右上の設定アイコンから習慣を追加できます</div>';
      return;
    }

    var activeHabits = [];
    var inactiveHabits = [];
    allHabits.forEach(function(h) {
      if (isHabitActiveOnDate(h, selectedDateStr)) activeHabits.push(h);
      else inactiveHabits.push(h);
    });

    var doneCount = 0;
    activeHabits.forEach(function(h) {
      var targetLog = (h.domain === 'work') ? wLog : pLog;
      var status = (targetLog && targetLog.habitMap) ? (targetLog.habitMap[h.id] || '') : '';
      if (status === 'min' || status === 'normal') doneCount++;
    });

    var slotOrder = ['morning', 'day', 'night', 'any'];
    var grouped = { morning: [], day: [], night: [], any: [] };
    activeHabits.forEach(function(h) {
      var m = getHabitMeta(h);
      grouped[m.timeSlot].push(h);
    });

    var usedSlotCount = slotOrder.filter(function(s) { return grouped[s].length > 0; }).length;
    var showGroupHeaders = !(usedSlotCount === 1 && grouped.any.length > 0);

    slotOrder.forEach(function(slotKey) {
      var items = grouped[slotKey];
      if (items.length === 0) return;

      var groupBox = document.createElement('div');
      groupBox.className = 'space-y-1.5';
      if (showGroupHeaders) {
        var hdr = document.createElement('div');
        hdr.className = 'text-[10px] font-bold text-slate-500 pt-0.5 flex items-center justify-between';
        hdr.innerHTML = '<span>' + TIME_SLOT_LABELS[slotKey] + '</span><span class="text-[9px] font-mono text-slate-400">' + items.length + '件</span>';
        groupBox.appendChild(hdr);
      }
      items.forEach(function(h) {
        groupBox.appendChild(buildHabitRowElement(h, selectedDateStr, wLog, pLog, activeMode));
      });
      area.appendChild(groupBox);
    });

    if (inactiveHabits.length > 0) {
      var skipBar = document.createElement('div');
      skipBar.className = 'pt-1 border-t border-slate-100';
      skipBar.innerHTML =
        '<button type="button" onclick="toggleInactiveHabitsDisplay()" class="w-full flex items-center justify-between text-[10px] text-slate-400 hover:text-slate-700 py-1 px-1 rounded transition">' +
          '<span>本日の対象外曜日（平日/土日設定）: ' + inactiveHabits.length + '件</span>' +
          '<span class="font-semibold underline">' + (showInactiveWeekdayHabits ? '隠す' : '表示') + '</span>' +
        '</button>';
      area.appendChild(skipBar);

      if (showInactiveWeekdayHabits) {
        var inactBox = document.createElement('div');
        inactBox.className = 'space-y-1.5 opacity-65 pt-1';
        inactiveHabits.forEach(function(h) {
          inactBox.appendChild(buildHabitRowElement(h, selectedDateStr, wLog, pLog, activeMode));
        });
        area.appendChild(inactBox);
      }
    }

    progressBadge.textContent = doneCount + '/' + activeHabits.length;
    progressBadge.className = (doneCount === activeHabits.length && activeHabits.length > 0)
      ? 'text-[10px] font-mono tabular-nums font-bold px-2 py-0.5 rounded-md bg-blue-950 text-white shrink-0'
      : 'text-[10px] font-mono tabular-nums font-semibold px-1.5 py-0.5 rounded-md bg-slate-100 text-slate-600 shrink-0';
  }

  function cycleHabitStatusToday(domain, habitId) {
    var dateStr = document.getElementById('targetDate').value;
    var log = (domain === 'work') ? ensureWorkLog(dateStr) : ensurePrivateLog(dateStr);
    if (!log.habitMap) log.habitMap = {};
    var cur = log.habitMap[habitId] || '';
    var next = (cur === '') ? 'min' : (cur === 'min' ? 'normal' : '');
    if (next === '') delete log.habitMap[habitId];
    else log.habitMap[habitId] = next;

    refreshAll();
    enqueueSync(domain === 'work' ? 'syncWorkDailyLog' : 'syncPrivateDailyLog', dateStr, log);
  }

  function switchHabitManagerDomain(dom) {
    activeHabitManagerDom = dom;
    var wBtn = document.getElementById('habDomTabWork');
    var pBtn = document.getElementById('habDomTabPriv');
    if (wBtn) wBtn.className = (dom === 'work') ? 'py-1 rounded bg-blue-950 text-white' : 'py-1 rounded text-slate-600';
    if (pBtn) pBtn.className = (dom === 'private') ? 'py-1 rounded bg-indigo-950 text-white' : 'py-1 rounded text-slate-600';
    renderHabitMasterList();
  }

  function openHabitManagerModal() {
    switchHabitManagerDomain(activeHabitManagerDom);
    document.getElementById('habitModal').classList.remove('hidden');
  }
  function closeHabitManagerModal() { document.getElementById('habitModal').classList.add('hidden'); }

  function cycleHabitTimeSlot(domain, index) {
    var list = domain === 'private' ? db.privateHabits : db.workHabits;
    var h = list[index];
    if (!h) return;
    var meta = getHabitMeta(h);
    var order = ['any', 'morning', 'day', 'night'];
    var nextSlot = order[(order.indexOf(meta.timeSlot) + 1) % order.length];
    setHabitMeta(h, nextSlot, meta.freq);
    saveLocalCache();
    renderHabitMasterList();
    refreshAll();
    enqueueSync('saveHabitMaster', h.id, Object.assign({ domain: domain }, h));
  }

  function cycleHabitFreq(domain, index) {
    var list = domain === 'private' ? db.privateHabits : db.workHabits;
    var h = list[index];
    if (!h) return;
    var meta = getHabitMeta(h);
    var order = ['daily', 'weekday', 'weekend'];
    var nextFreq = order[(order.indexOf(meta.freq) + 1) % order.length];
    setHabitMeta(h, meta.timeSlot, nextFreq);
    saveLocalCache();
    renderHabitMasterList();
    refreshAll();
    if (currentView === 'analytics' && typeof renderAnalyticsHabitWeeklyTable === 'function') renderAnalyticsHabitWeeklyTable();
    enqueueSync('saveHabitMaster', h.id, Object.assign({ domain: domain }, h));
  }

  function moveHabitOrder(domain, index, delta) {
    var list = domain === 'private' ? db.privateHabits : db.workHabits;
    var targetIdx = index + delta;
    if (targetIdx < 0 || targetIdx >= list.length) return;
    var temp = list[index];
    list[index] = list[targetIdx];
    list[targetIdx] = temp;

    saveHabitOrderLocal();
    renderHabitMasterList();
    refreshAll();
    if (currentView === 'analytics' && typeof renderAnalyticsHabitWeeklyTable === 'function') renderAnalyticsHabitWeeklyTable();
    enqueueSync('reorderHabits', 'order_' + domain, {
      domain: domain,
      orderedIds: list.map(function(h) { return h.id; })
    });
  }

  function renderHabitMasterList() {
    var area = document.getElementById('habitMasterListArea');
    if (!area) return;
    area.innerHTML = '';
    var targetDom = activeHabitManagerDom;
    var list = targetDom === 'private' ? (db.privateHabits || []) : (db.workHabits || []);
    list.forEach(function(h, idx) {
      var isFirst = (idx === 0);
      var isLast = (idx === list.length - 1);
      var meta = getHabitMeta(h);
      var row = document.createElement('div');
      row.className = 'p-2.5 bg-slate-50 border border-slate-200 rounded-lg flex items-center justify-between gap-2';
      row.innerHTML =
        '<div class="flex flex-col gap-0.5 shrink-0">' +
          '<button type="button" onclick="moveHabitOrder(\'' + targetDom + '\', ' + idx + ', -1)" ' + (isFirst ? 'disabled' : '') + ' class="w-5 h-5 rounded bg-white border border-slate-200 text-[9px] flex items-center justify-center ' + (isFirst ? 'text-slate-200 cursor-not-allowed' : 'text-slate-700 hover:bg-slate-200') + '" title="上へ"><i class="fa-solid fa-chevron-up"></i></button>' +
          '<button type="button" onclick="moveHabitOrder(\'' + targetDom + '\', ' + idx + ', 1)" ' + (isLast ? 'disabled' : '') + ' class="w-5 h-5 rounded bg-white border border-slate-200 text-[9px] flex items-center justify-center ' + (isLast ? 'text-slate-200 cursor-not-allowed' : 'text-slate-700 hover:bg-slate-200') + '" title="下へ"><i class="fa-solid fa-chevron-down"></i></button>' +
        '</div>' +
        '<div class="min-w-0 flex-1 space-y-1">' +
          '<div class="font-semibold text-slate-900 truncate">' + escapeHtml(h.name) + '</div>' +
          '<div class="flex items-center gap-1 flex-wrap">' +
            '<button type="button" onclick="cycleHabitTimeSlot(\'' + targetDom + '\', ' + idx + ')" class="text-[9px] font-semibold px-1.5 py-0.5 rounded bg-white border border-slate-300 text-slate-700 hover:bg-slate-100">' + TIME_SLOT_SHORT[meta.timeSlot] + '</button>' +
            '<button type="button" onclick="cycleHabitFreq(\'' + targetDom + '\', ' + idx + ')" class="text-[9px] font-semibold px-1.5 py-0.5 rounded bg-white border border-slate-300 text-slate-700 hover:bg-slate-100">' + FREQ_SHORT[meta.freq] + '</button>' +
          '</div>' +
          '<div class="text-[10px] text-slate-500 truncate">通常: ' + escapeHtml(h.normalGoal) + '</div>' +
        '</div>' +
        '<button type="button" onclick="deleteHabitMaster(\'' + targetDom + '\', \'' + h.id + '\')" class="text-slate-400 hover:text-rose-600 px-1.5 shrink-0"><i class="fa-solid fa-trash-can"></i></button>';
      area.appendChild(row);
    });
  }

  function addNewHabitMaster(e) {
    e.preventDefault();
    var targetDom = activeHabitManagerDom;
    var name = document.getElementById('newHabitName').value.trim();
    var normalGoal = document.getElementById('newHabitNormal').value.trim();
    var minGoal = document.getElementById('newHabitMin').value.trim();
    var timeSlot = document.getElementById('newHabitTimeSlot').value || 'any';
    var freq = document.getElementById('newHabitFreq').value || 'daily';
    if (!name) return;

    var newItem = {
      domain: targetDom, id: (targetDom === 'work' ? 'whab_' : 'hab_') + Date.now(),
      name: name, normalGoal: normalGoal, minGoal: minGoal, category: timeSlot + ':' + freq
    };
    setHabitMeta(newItem, timeSlot, freq);
    if (targetDom === 'private') db.privateHabits.push(newItem);
    else db.workHabits.push(newItem);

    document.getElementById('newHabitName').value = '';
    document.getElementById('newHabitNormal').value = '';
    document.getElementById('newHabitMin').value = '';
    saveHabitOrderLocal();
    renderHabitMasterList();
    refreshAll();
    enqueueSync('saveHabitMaster', newItem.id, newItem);
    showToast('習慣を追加しました');
  }

  function deleteHabitMaster(domain, id) {
    if (domain === 'private') db.privateHabits = db.privateHabits.filter(function(h) { return h.id !== id; });
    else db.workHabits = db.workHabits.filter(function(h) { return h.id !== id; });
    saveHabitOrderLocal();
    renderHabitMasterList();
    refreshAll();
    enqueueSync('saveHabitMaster', 'del_' + id, { domain: domain, deleteId: id });
    showToast('習慣を削除しました');
  }
</script>
