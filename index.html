      <button type="button" onclick="toggleSnsTitle()" id="snsTitleBtn" class="today-text-btn">題名</button>
      <button type="button" onclick="pasteIntoMemo()" class="today-text-btn" title="コピーした URL や文章を貼り付け"><i class="fa-regular fa-clipboard mr-1"></i>貼り付け</button>
      <span id="snsSelectedDateLabel" class="text-[11px] text-slate-500 flex-1 text-right"></span>
      <button type="button" onclick="submitQuickSnsPost()" class="px-6 h-10 rounded-lg bg-blue-900 hover:bg-blue-800 text-white text-sm font-bold transition active:scale-95 shrink-0">保存</button>
    </div>
  </div>

  <!-- コンパクト検索 ＆ ハッシュタグ集計・絞り込み -->
  <div class="card-surface p-2 space-y-1.5">
    <div class="flex items-center gap-1.5">
      <div class="relative flex-1">
        <i class="fa-solid fa-magnifying-glass text-xs text-slate-400 absolute left-3 top-3"></i>
        <input type="search" id="snsSearchInput" oninput="onFeedSearchInput()" placeholder="メモを検索" class="w-full pl-8 pr-2 py-2 border border-slate-200 rounded-lg text-sm bg-slate-50 focus:bg-white outline-none focus:border-blue-950">
      </div>
      <button type="button" id="snsClearTagFilterBtn" onclick="clearSnsTagFilter()" class="px-2 py-1 rounded-md bg-rose-900 text-white text-[9px] font-bold hidden shrink-0">
        解除
      </button>
    </div>

    <div id="snsFilterTagsBar" class="flex items-center gap-1 flex-wrap"></div>
    <div id="feedResultSummary" class="text-[11px] text-slate-600 hidden"></div>
  </div>

  <!-- 投稿ストリーム一覧 -->
  <div id="snsTimelineFeedList" class="space-y-2.5"></div>

</div>

<div id="undoBar" class="fixed left-2 right-2 bottom-4 z-50 max-w-sm mx-auto bg-slate-950 text-white rounded-xl shadow-2xl px-3.5 py-2 flex items-center justify-between gap-3 hidden">
  <span id="undoMsg" class="text-xs"></span>
  <button type="button" id="undoBtn" class="px-3 py-1.5 rounded-lg bg-white text-slate-950 text-xs font-bold shrink-0">元に戻す</button>
</div>

<!-- あとからタグを付ける -->
<div id="noteTagSheet" class="sheet hidden" onclick="if (event.target === this) closeSheet('noteTagSheet')">
  <div class="sheet-panel">
    <div class="sheet-grip"></div>
    <div id="noteTagPreview" class="memo-tag-preview"></div>
    <div class="today-group"><span>付いているタグ（タップで外す）</span><span id="noteTagCount"></span></div>
    <div id="noteTagCurrent" class="flex flex-wrap gap-1.5"></div>
    <form onsubmit="event.preventDefault(); addNoteTagFromInput()" class="flex items-center gap-2">
      <input type="text" id="noteTagInput" enterkeyhint="done" placeholder="新しいタグ（例: 読書/書名）" class="sheet-input flex-1">
      <button type="submit" class="today-text-btn shrink-0">付ける</button>
    </form>
    <div class="today-group"><span>候補</span></div>
    <div id="noteTagPool" class="flex flex-wrap gap-1.5"></div>
    <div class="flex items-center gap-2 pt-1">
      <button type="button" id="noteTagNextBtn" onclick="openNextUntagged()" class="flex-1 py-3 rounded-xl border border-slate-300 text-sm font-bold text-slate-700">次のタグなしへ</button>
      <button type="button" onclick="closeSheet('noteTagSheet')" class="flex-1 py-3 rounded-xl bg-blue-900 text-white text-sm font-bold">閉じる</button>
    </div>
  </div>
</div>

<!-- 長文ノート作成・編集モーダル -->
<div id="noteEditorModal" class="fixed inset-0 z-50 bg-slate-950/50 backdrop-blur-xs flex items-end sm:items-center justify-center p-2.5 hidden">
  <div class="bg-white w-full max-w-md rounded-2xl border border-slate-200 shadow-2xl p-3.5 space-y-2">
    <div class="flex items-center justify-between border-b border-slate-100 pb-1.5">
      <h3 id="noteModalHeading" class="text-xs font-bold text-slate-900">メモの編集</h3>
      <button type="button" onclick="closeNoteEditorModal()" class="w-6 h-6 rounded-md bg-slate-100 text-slate-600 hover:text-slate-900 text-xs flex items-center justify-center">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>

    <input type="hidden" id="editNoteIdInput" value="">
    <div class="grid grid-cols-[1fr_118px] gap-1.5">
      <input type="text" id="editNoteTitleInput" placeholder="タイトル（任意）..." class="w-full px-2.5 py-1.5 border border-slate-200 rounded-lg text-xs font-bold outline-none focus:border-blue-950">
      <input type="date" id="editNoteDateInput" class="px-2 py-1.5 border border-slate-200 rounded-lg text-[10px] font-mono font-bold text-slate-700 bg-slate-50 outline-none">
    </div>

    <div class="relative space-y-1">
      <textarea id="editNoteContentInput" rows="5" oninput="handleHashtagTyping(this, 'noteModalSuggestBox'); renderQuickHashtagBar('noteModalTagBar', 'editNoteContentInput');" placeholder="本文を入力（#でタグ補完）..." class="w-full px-2.5 py-1.5 border border-slate-200 rounded-lg text-xs bg-slate-50/50 focus:bg-white outline-none focus:border-blue-950 leading-relaxed"></textarea>
      <div id="noteModalSuggestBox" class="hidden flex items-center gap-1 flex-wrap p-1 rounded-md bg-blue-950 text-white text-[10px] shadow-md"></div>
    </div>

    <div class="space-y-1">
      <div class="flex items-center justify-between">
        <span class="text-[9px] font-mono text-slate-400 font-semibold">HASHTAGS</span>
        <button type="button" onclick="promptAddCustomHashtag('editNoteContentInput', 'noteModalTagBar')" class="text-[9px] font-bold text-blue-950 hover:underline">+ 新規タグ</button>
      </div>
      <div id="noteModalTagBar" class="flex items-center gap-1 flex-wrap max-h-16 overflow-y-auto"></div>
    </div>

    <div class="flex items-center gap-2">
      <button type="button" onclick="pickPhotos('edit')" class="px-3 py-1.5 rounded-lg bg-slate-100 text-slate-800 text-xs font-bold shrink-0"><i class="fa-solid fa-camera mr-1"></i>写真</button>
      <div id="photoBar_edit" class="hidden flex items-center gap-2 overflow-x-auto py-1 flex-1"></div>
    </div>

    <div id="noteModalMoodBar" class="flex items-center gap-1 flex-wrap pt-1 border-t border-slate-100"></div>

    <div class="flex items-center justify-end gap-1.5 pt-1 border-t border-slate-100">
      <button type="button" onclick="closeNoteEditorModal()" class="px-3 py-1 rounded-lg bg-slate-100 text-slate-700 text-xs font-bold">キャンセル</button>
      <button type="button" onclick="saveNoteFromModal()" class="px-4 py-1 rounded-lg bg-blue-950 hover:bg-blue-900 text-white text-xs font-bold">保存する</button>
    </div>
  </div>
</div>

<script>
  App.mount('#slot-timeline-main', 'timelineWorkspaceSection');
  App.mount('#slot-modals', 'noteTagSheet');

  var KEY_PINNED_HASHTAGS = 'worklife_os_pinned_hashtags_v1';
  var DEFAULT_PINNED_HASHTAGS = ['#思考整理', '#仕事メモ', '#学び', '#アイデア', '#読書', '#振り返り', '#開発', '#メモ'];
  var activeSnsTagFilter = '';
  var selectedQuickMood = '';
  var selectedModalMood = '';

  var SNS_MOOD_OPTIONS = ['集中', '充実', '穏やか', '思考中', '停滞'].map(function(label) {
    return { label: label, activeCls: 'bg-blue-900 text-white border-blue-900', badgeCls: 'border border-slate-300 text-slate-600' };
  });

  function getMoodBadgeClass(moodLabel) {
    var found = SNS_MOOD_OPTIONS.find(function(m) { return m.label === moodLabel; });
    return found ? found.badgeCls : 'border border-slate-300 text-slate-600';
  }

  function toggleQuickMood(label) {
    selectedQuickMood = (selectedQuickMood === label) ? '' : label;
    renderSnsMoodSelector('snsQuickMoodBar', selectedQuickMood, 'toggleQuickMood');
  }

  function toggleModalMood(label) {
    selectedModalMood = (selectedModalMood === label) ? '' : label;
    renderSnsMoodSelector('noteModalMoodBar', selectedModalMood, 'toggleModalMood');
  }

  function renderSnsMoodSelector(barId, currentMood, fnName) {
    var bar = document.getElementById(barId);
    if (!bar) return;
    bar.innerHTML = '<span class="text-[9px] text-slate-400 mr-0.5">気分(任意):</span>' +
      SNS_MOOD_OPTIONS.map(function(m) {
        var isSel = (currentMood === m.label);
        return '<button type="button" data-m="' + escapeHtml(m.label) + '" onclick="' + fnName + '(this.getAttribute(\'data-m\'))" class="px-1.5 py-0.5 rounded text-[9px] font-bold border transition ' +
          (isSel ? m.activeCls : 'bg-white text-slate-500 border-slate-200 hover:border-slate-400') + '">' +
          escapeHtml(m.label) +
        '</button>';
      }).join('');
  }

  // 1人SNS での使用件数（表記のゆれはまとめる）
  function computeTagFrequencyMap() {
    var counts = {};
    (db.notes || []).forEach(function(n) {
      tagsOfNote(n).forEach(function(t) { counts[tagKey(t)] = (counts[tagKey(t)] || 0) + 1; });
    });
    return counts;
  }

  function persistNoteToStateAndSync(noteObj) {
    if (!Array.isArray(db.notes)) db.notes = [];
    var idx = db.notes.findIndex(function(n) { return n.id === noteObj.id; });
    if (idx !== -1) {
      db.notes[idx] = noteObj;
    } else {
      db.notes.unshift(noteObj);
    }
    (noteObj.tags || []).forEach(function(t) { addPinnedHashtag(t); });

    saveNotesImmediate();
  }

  // 投稿の共通処理（メモの画面・クイック入力）。タグが多すぎるときは保存しない
  // photoKey: 添付中の写真（sns / quick）、title: 題名（任意）
  function postNote(text, mood, dateStr, photoKey, title) {
    title = (title || '').trim();
    var tags = extractHashtagsFromText(title + ' ' + text);
    if (!tagLimitOk(tags)) return false;
    var note = {
      id: 'note_' + Date.now() + Math.random().toString(36).slice(2, 5),
      title: title,
      content: text,
      tags: canonicalTags(tags),
      mood: mood || '',
      createdAt: dateStr,
      time: getCurrentHHMM(),
      isLongNote: !!title || text.length >= 120
    };
    if (photoKey && photoDrafts[photoKey].length) note.images = takeDraftPhotos(photoKey);
    persistNoteToStateAndSync(note);
    processPhotoQueue();
    return true;
  }

  // ---- 書きかけは端末に残す ----
  var KEY_SNS_DRAFT = 'lifework_os_memo_draft';
  function saveSnsDraft() {
    try { localStorage.setItem(KEY_SNS_DRAFT, JSON.stringify({ text: document.getElementById('snsQuickPostInput').value, title: document.getElementById('snsTitleInput').value })); } catch (e) {}
  }

  function restoreSnsDraft() {
    var ta = document.getElementById('snsQuickPostInput'), ti = document.getElementById('snsTitleInput');
    if (!ta || ta.value || ti.value) return;
    var d = {};
    try { d = JSON.parse(localStorage.getItem(KEY_SNS_DRAFT) || '{}') || {}; } catch (e) {}
    ta.value = d.text || '';
    ti.value = d.title || '';
    if (!ta.value && !ti.value) applyStickyTags('snsQuickPostInput');
    ti.classList.toggle('hidden', !ti.value);
    growTextarea(ta);
  }

  function toggleSnsTitle() {
    var ti = document.getElementById('snsTitleInput');
    ti.classList.toggle('hidden');
    if (!ti.classList.contains('hidden')) ti.focus();
  }

  // ---- 共有・貼り付け: URL は整えて本文へ、題名は題名欄へ。書きかけがあれば後ろに足す ----
  function putSharedIntoComposer(data) {
    var m = buildSharedMemo(data);
    if (!m.title && !m.body) return false;
    var ta = document.getElementById('snsQuickPostInput'), ti = document.getElementById('snsTitleInput');
    restoreSnsDraft();
    if (m.title && !ti.value.trim()) { ti.value = m.title; ti.classList.remove('hidden'); }
    else if (m.title) m.body = m.title + '\n' + m.body;
    var cur = ta.value.replace(/\s+$/, '');
    ta.value = (cur ? cur + '\n' : '') + m.body + '\n';
    growTextarea(ta);
    saveSnsDraft();
    renderQuickHashtagBar('snsQuickTagBar', 'snsQuickPostInput');
    window.scrollTo(0, 0);
    return true;
  }

  // 共有で開かれたとき（sw.js が置いた内容を 1 回だけ取り出す）
  function takeSharedItem() {
    if (!window.caches) return;
    var key = new URL('./__shared', location.href).href;
    caches.open('share-inbox').then(function(c) {
      return c.match(key).then(function(res) {
        if (!res) return;
        return res.json().then(function(data) {
          c.delete(key);
          if (putSharedIntoComposer(data)) showToast('共有された内容を入れました。タグを選んで保存');
        });
      });
    }).catch(function(e) { console.error(e); });
    if (/[?&]share=1/.test(location.search)) { try { history.replaceState(null, '', location.pathname); } catch (e) {} }
  }

  function pasteIntoMemo() {
    if (!navigator.clipboard || !navigator.clipboard.readText) return showToast('この端末では貼り付けボタンが使えません。長押しで貼り付けてください', true);
    navigator.clipboard.readText().then(function(t) {
      t = String(t || '').trim();
      if (!t) return showToast('コピーされた内容がありません', true);
      if (SHARE_URL_RE.test(t)) putSharedIntoComposer({ text: t });
      else {
        var ta = document.getElementById('snsQuickPostInput'), cur = ta.value.replace(/\s+$/, '');
        ta.value = (cur ? cur + '\n' : '') + t + '\n';
        growTextarea(ta); saveSnsDraft(); renderQuickHashtagBar('snsQuickTagBar', 'snsQuickPostInput');
      }
    }, function() { showToast('貼り付けが許可されませんでした。長押しで貼り付けてください', true); });
  }

  // ---- タグの固定: 押したときのタグを、次のメモにも最初から付けておく ----
  var KEY_STICKY_TAGS = 'lifework_os_sticky_tags';
  function getStickyTags() {
    try { var v = JSON.parse(localStorage.getItem(KEY_STICKY_TAGS) || '[]'); return Array.isArray(v) ? v : []; } catch (e) { return []; }
  }

  function toggleStickyTags(inputId) {
    var next = [];
    if (!getStickyTags().length) {
      next = extractHashtagsFromText(document.getElementById(inputId).value).filter(function(t) { return !hasTag(AUTO_TAGS, t); });
      if (!next.length) return showToast('先にタグを選んでから押してください', true);
    }
    try { localStorage.setItem(KEY_STICKY_TAGS, JSON.stringify(next)); } catch (e) {}
    renderStickyState();
    showToast(next.length ? next.join(' ') + ' を次のメモにも付けます' : 'タグの固定を外しました');
  }

  function applyStickyTags(inputId) {
    var el = document.getElementById(inputId), st = getStickyTags();
    if (!el || !st.length || el.value.trim()) return;
    el.value = st.join(' ') + ' ';
  }

  function renderStickyState() {
    var st = getStickyTags();
    ['snsStickyBtn', 'quickStickyBtn'].forEach(function(id) { var b = document.getElementById(id); if (b) b.classList.toggle('is-on', st.length > 0); });
    var note = document.getElementById('snsStickyNote');
    if (note) {
      note.classList.toggle('hidden', !st.length);
      note.innerHTML = st.length ? '固定中：' + st.map(escapeHtml).join(' ') + '<button type="button" onclick="toggleStickyTags(\'snsQuickPostInput\')">外す</button>' : '';
    }
  }

  function submitQuickSnsPost() {
    var ta = document.getElementById('snsQuickPostInput'), ti = document.getElementById('snsTitleInput');
    if (!ta) return;
    var text = ta.value.trim(), title = ti.value.trim();
    var onlyTags = !stripHashtagsFromTitle(text).replace(/[#＃]\S+/g, '').trim();
    if ((!text || (onlyTags && !title)) && !photoDrafts.sns.length) return showToast('メモを入力してください', true);
    var dateInp = document.getElementById('targetDate');
    var dateStr = (dateInp && dateInp.value) ? dateInp.value : formatDateLocal(new Date());
    if (!postNote(text, '', dateStr, 'sns', title)) return;

    ta.value = '';
    ti.value = '';
    ti.classList.add('hidden');
    applyStickyTags('snsQuickPostInput');
    saveSnsDraft();
    growTextarea(ta);
    document.getElementById('snsQuickSuggestBox').classList.add('hidden');
    renderNotesWorkspace();
    showToast('保存しました');
  }

  // ---- あとからタグを付ける ----
  var tagSheetNoteId = '';
  function openNoteTagSheet(id) {
    tagSheetNoteId = id;
    document.getElementById('noteTagInput').value = '';
    renderNoteTagSheet();
    if (document.getElementById('noteTagSheet').classList.contains('hidden')) openSheet('noteTagSheet');
  }

  function renderNoteTagSheet() {
    var n = (db.notes || []).find(function(x) { return x.id === tagSheetNoteId; });
    if (!n) return;
    var cur = userTagsOf(n);
    var chip = function(t, on) {
      return '<button type="button" data-tag="' + escapeHtml(t) + '" onclick="toggleNoteTag(this.getAttribute(\'data-tag\'))" class="memo-chip' + (on ? ' is-on' : '') + '">' + escapeHtml(t) + (on ? ' <i class="fa-solid fa-xmark"></i>' : '') + '</button>';
    };
    document.getElementById('noteTagPreview').textContent = ((n.title ? n.title + ' ' : '') + stripHashtagsFromTitle(n.content || '')).slice(0, 120);
    document.getElementById('noteTagCount').textContent = cur.length + ' / ' + MAX_TAGS;
    document.getElementById('noteTagCurrent').innerHTML = cur.length ? cur.map(function(t) { return chip(t, true); }).join('') : '<span class="today-none">まだありません</span>';
    document.getElementById('noteTagPool').innerHTML = tagPool(db.notes, cur, getPinnedHashtags(), 24).filter(function(t) { return !hasTag(cur, t); }).map(function(t) { return chip(t, false); }).join('');
    document.getElementById('noteTagNextBtn').classList.toggle('hidden', !nextUntaggedNote());
  }

  function toggleNoteTag(tag) {
    var n = (db.notes || []).find(function(x) { return x.id === tagSheetNoteId; });
    if (!n) return;
    var cur = tagsOfNote(n);
    if (hasTag(cur, tag)) {
      n.content = removeTagFromText(n.content || '', tag);
      n.title = removeTagFromText(n.title || '', tag);
      n.tags = cur.filter(function(t) { return tagKey(t) !== tagKey(tag); });
    } else {
      if (!tagLimitOk(cur.concat([tag]), cur)) return;
      tag = canonicalTags([tag])[0];
      n.content = String(n.content || '').replace(/\s+$/, '') + (n.content ? ' ' : '') + tag;
      n.tags = canonicalTags(cur.concat([tag]));
    }
    persistNoteToStateAndSync(n);
    renderNoteTagSheet();
    if (currentView === 'timeline') renderNotesWorkspace();
  }

  function addNoteTagFromInput() {
    var inp = document.getElementById('noteTagInput'), tag = normalizeTag(inp.value);
    if (!tag) return;
    inp.value = '';
    toggleNoteTag(tag);
  }

  // 今のメモより前（古い方）にある、タグのないメモ
  function nextUntaggedNote() {
    var list = (db.notes || []).filter(function(n) { return n.content || n.title; }).slice().sort(function(a, b) {
      return String(b.createdAt || '').localeCompare(String(a.createdAt || '')) || String(b.time || '').localeCompare(String(a.time || ''));
    });
    var at = list.findIndex(function(n) { return n.id === tagSheetNoteId; });
    return list.slice(at + 1).concat(list.slice(0, Math.max(0, at))).find(function(n) { return !tagsOfNote(n).length; });
  }

  function openNextUntagged() {
    var n = nextUntaggedNote();
    if (n) openNoteTagSheet(n.id);
  }

  // メモの長押しでも開く
  document.addEventListener('contextmenu', function(e) {
    var card = e.target.closest && e.target.closest('[data-note]');
    if (!card || window.getSelection().toString()) return;
    e.preventDefault();
    openNoteTagSheet(card.getAttribute('data-note'));
  });



  function editNoteItem(id) {
    var n = (db.notes || []).find(function(x) { return x.id === id; });
    if (!n) return;
    document.getElementById('editNoteIdInput').value = n.id;
    document.getElementById('editNoteTitleInput').value = n.title || '';
    document.getElementById('editNoteDateInput').value = n.createdAt || formatDateLocal(new Date());
    document.getElementById('editNoteContentInput').value = n.content || '';
    photoDrafts.edit = validPhotos(n).slice();
    renderPhotoBar('edit');
    selectedModalMood = n.mood || '';
    document.getElementById('noteModalSuggestBox').classList.add('hidden');
    renderQuickHashtagBar('noteModalTagBar', 'editNoteContentInput');
    renderSnsMoodSelector('noteModalMoodBar', selectedModalMood, 'toggleModalMood');
    document.getElementById('noteEditorModal').classList.remove('hidden');
  }

  function closeNoteEditorModal() {
    document.getElementById('noteEditorModal').classList.add('hidden');
  }

  function saveNoteFromModal() {
    var id = document.getElementById('editNoteIdInput').value;
    var title = document.getElementById('editNoteTitleInput').value.trim();
    var content = document.getElementById('editNoteContentInput').value.trim();
    var chosenDate = document.getElementById('editNoteDateInput').value;
    if (!title && !content && !photoDrafts.edit.length) return showToast('タイトル・本文・写真のいずれかを入力してください', true);

    var dateInp = document.getElementById('targetDate');
    var fallbackDate = (dateInp && dateInp.value) ? dateInp.value : formatDateLocal(new Date());
    var dateStr = chosenDate || fallbackDate;
    var existing = id ? (db.notes || []).find(function(x) { return x.id === id; }) : null;
    var tags = extractHashtagsFromText(title + ' ' + content);
    if (!tagLimitOk(tags, existing ? tagsOfNote(existing) : [])) return;

    // 画面で扱わない項目（以前の形式の付加情報など）は、そのまま残す
    var noteObj = Object.assign({}, existing || {}, {
      id: existing ? existing.id : ('note_' + Date.now() + Math.random().toString(36).slice(2, 5)),
      title: title,
      content: content,
      tags: canonicalTags(tags),
      mood: selectedModalMood || '',
      createdAt: dateStr,
      time: existing ? (existing.time || getCurrentHHMM()) : getCurrentHHMM(),
      isLongNote: !!(title || content.length >= 120),
      pinned: existing ? !!existing.pinned : false,
      replies: existing ? (existing.replies || []) : []
    });

    var before = existing ? validPhotos(existing) : [];
    var after = photoDrafts.edit.slice();
    if (after.length || before.length) noteObj.images = after;
    closeNoteEditorModal();
    persistNoteToStateAndSync(noteObj);
    discardPhotos(before.filter(function(p) { return !after.some(function(q) { return q.id === p.id; }); }));
    processPhotoQueue();
    renderNotesWorkspace();
    showToast('保存しました');
  }

  function togglePinSnsNote(id) {
    var n = (db.notes || []).find(function(x) { return x.id === id; });
    if (!n) return;
    n.pinned = !n.pinned;
    persistNoteToStateAndSync(n);
    renderNotesWorkspace();
    showToast(n.pinned ? '投稿を最上部にピン留めしました' : 'ピン留めを解除しました');
  }

  function appendSnsThreadReply(id) {
    var n = (db.notes || []).find(function(x) { return x.id === id; });
    if (!n) return;
    var replyText = window.prompt('この投稿への追記・スレッドメモ:');
    if (!replyText || !replyText.trim()) return;
    if (!Array.isArray(n.replies)) n.replies = [];
    n.replies.push({
      date: formatDateLocal(new Date()),
      time: getCurrentHHMM(),
      text: replyText.trim()
    });
    persistNoteToStateAndSync(n);
    renderNotesWorkspace();
    showToast('スレッドに追記しました');
  }

  // 削除はすぐ反映し、数秒のあいだ元に戻せる
  function deleteSnsNote(id) {
    var removed = (db.notes || []).find(function(n) { return n.id === id; });
    if (!removed) return;
    db.notes = db.notes.filter(function(n) { return n.id !== id; });
    saveNotesImmediate();
    renderNotesWorkspace();
    showUndo('メモを削除しました', function() {
      if (!(db.notes || []).some(function(n) { return n.id === id; })) db.notes.unshift(removed);
      saveNotesImmediate();
      if (currentView === 'timeline') renderNotesWorkspace();
      showToast('元に戻しました');
    }, function() {
      if (!(db.notes || []).some(function(n) { return n.id === id; })) discardPhotos(validPhotos(removed));
    });
  }

  var undoTimer = null;
  var undoExpire = null; // 取り消せる時間が過ぎたら行う後片付け
  function showUndo(msg, fn, onExpire) {
    finishUndo();
    undoExpire = onExpire || null;
    var bar = document.getElementById('undoBar');
    document.getElementById('undoMsg').textContent = msg;
    document.getElementById('undoBtn').onclick = function() { undoExpire = null; hideUndo(); fn(); };
    bar.classList.remove('hidden');
    clearTimeout(undoTimer);
    undoTimer = setTimeout(finishUndo, 8000);
  }

  function finishUndo() {
    hideUndo();
    var f = undoExpire;
    undoExpire = null;
    if (f) f();
  }

  function hideUndo() {
    clearTimeout(undoTimer);
    document.getElementById('undoBar').classList.add('hidden');
  }

  function toggleSnsTagFilter(tag) {
    var t = tag === UNTAGGED ? UNTAGGED : normalizeTag(tag);
    activeSnsTagFilter = activeSnsTagFilter === t || (t !== UNTAGGED && activeSnsTagFilter && tagKey(activeSnsTagFilter) === tagKey(t)) ? '' : t;
    feedLimit = FEED_PAGE;
    renderNotesWorkspace();
  }

  function clearSnsTagFilter() {
    activeSnsTagFilter = '';
    var sInp = document.getElementById('snsSearchInput');
    if (sInp) sInp.value = '';
    feedLimit = FEED_PAGE;
    renderNotesWorkspace();
  }

  function renderNotesWorkspace() {
    var dateInp = document.getElementById('targetDate');
    var dateLbl = document.getElementById('snsSelectedDateLabel');
    if (dateLbl && dateInp) dateLbl.textContent = dateInp.value && dateInp.value !== formatDateLocal(new Date()) ? dateInp.value.slice(5).replace('-', '/') + ' として保存' : '';

    restoreSnsDraft();
    renderQuickHashtagBar('snsQuickTagBar', 'snsQuickPostInput');
    renderStickyState();

    var clearBtn = document.getElementById('snsClearTagFilterBtn');
    if (clearBtn) clearBtn.classList.toggle('hidden', !activeSnsTagFilter && !feedQuery());
    renderPhotoBar('sns');

    var filterBar = document.getElementById('snsFilterTagsBar');
    if (filterBar) {
      var rec = recentTags(db.notes);
      var used = uniqTags(rec.map(function(t) { return tagParent(t) || t; }).concat(rec));
      var count = function(t) { return (db.notes || []).filter(function(n) { return tagMatches(userTagsOf(n), t); }).length; };
      var untagged = (db.notes || []).filter(function(n) { return (n.content || n.title) && !tagsOfNote(n).length; }).length;
      var shown = feedAllTags ? used : used.slice(0, 10);
      if (activeSnsTagFilter && activeSnsTagFilter !== UNTAGGED && !hasTag(shown, activeSnsTagFilter)) shown = [activeSnsTagFilter].concat(shown);
      var chip = function(tg, label, n) {
        var active = activeSnsTagFilter === tg || (!!activeSnsTagFilter && tg !== UNTAGGED && activeSnsTagFilter !== UNTAGGED && tagKey(activeSnsTagFilter) === tagKey(tg));
        return '<button type="button" data-tag="' + escapeHtml(tg) + '" onclick="toggleSnsTagFilter(this.getAttribute(\'data-tag\'))" class="feed-chip' + (active ? ' is-active' : '') + '">' + escapeHtml(label) + (n ? ' <span class="opacity-60">' + n + '</span>' : '') + '</button>';
      };
      filterBar.innerHTML = shown.map(function(tg) { return chip(tg, tg, count(tg)); }).join('') +
        (used.length > 10 ? '<button type="button" onclick="feedAllTags = !feedAllTags; renderNotesWorkspace()" class="feed-chip">' + (feedAllTags ? '閉じる' : '他 ' + (used.length - 10)) + '</button>' : '') +
        (untagged ? chip(UNTAGGED, 'タグなし', untagged) : '');
    }

    var feed = document.getElementById('snsTimelineFeedList');
    if (!feed) return;

    var q = feedQuery();
    var items = buildFeed(q, activeSnsTagFilter);
    renderFeedSummary(items, q);
    if (items.length === 0) {
      feed.innerHTML = '<div class="text-sm text-slate-500 text-center py-8">' + (q || activeSnsTagFilter ? '見つかりませんでした' : 'まだメモがありません') + '</div>';
      return;
    }
    var lastGroup = null, html = '';
    items.slice(0, feedLimit).forEach(function(it) {
      var group = it.pinned ? 'pin' : it.date;
      if (group !== lastGroup) { html += dayHeaderHtml(group); lastGroup = group; }
      html += noteCardHtml(it.note);
    });
    feed.innerHTML = html + (items.length > feedLimit
      ? '<button type="button" onclick="showMoreFeed()" class="w-full py-3 rounded-xl bg-white border border-slate-300 text-sm font-bold text-slate-700">さらに表示（残り ' + (items.length - feedLimit) + ' 件）</button>'
      : '');
    updateMoreButtons(feed);
    hydratePhotos(feed);
  }

  // 日付の見出し（土曜は青、日曜は赤）
  function dayHeaderHtml(group) {
    if (group === 'pin') return '<div class="feed-day"><i class="fa-solid fa-thumbtack text-amber-600"></i>ピン留め</div>';
    var d = new Date(group + 'T12:00:00');
    if (isNaN(d)) return '<div class="feed-day">日付なし</div>';
    var label = (d.getFullYear() !== new Date().getFullYear() ? d.getFullYear() + '年' : '') + (d.getMonth() + 1) + '月' + d.getDate() + '日';
    var wd = ['日', '月', '火', '水', '木', '金', '土'][d.getDay()];
    var cls = d.getDay() === 0 ? 'is-sun' : (d.getDay() === 6 ? 'is-sat' : '');
    return '<div class="feed-day">' + label + ' <small class="' + cls + '">' + wd + '</small>' + (group === formatDateLocal(new Date()) ? '<small>TODAY</small>' : '') + '</div>';
  }

  // 種類は、白いカードの左の細い印で示す
  var FEED_MARK = { post: '#36528f', long: '#0c172e', pin: '#b08d45' };
  function feedCard(kind, inner, noteId) {
    return '<article class="feed-card space-y-2"' + (noteId ? ' data-note="' + escapeHtml(noteId) + '"' : '') + ' style="--feed-mark:' + FEED_MARK[kind] + '">' + inner + '</article>';
  }

  function feedIcon(icon, title, action, cls) {
    return '<button type="button" onclick="' + action + '" title="' + title + '" aria-label="' + title + '" class="feed-icon-btn ' + (cls || '') + '"><i class="' + icon + '"></i></button>';
  }

  function noteCardHtml(n) {
    var isLong = !!(n.isLongNote || n.title || (n.content && n.content.length >= 120));
    var id = escapeHtml(n.id);
    var act = function(fn) { return fn + '(\'' + id + '\')'; };
    var chips = (isLong ? '<span class="feed-kind">NOTE</span>' : '') + '<span class="text-xs font-bold text-slate-500">' + escapeHtml(n.time || '') + '</span>' +
      (n.mood ? '<span class="px-2 py-0.5 rounded-md text-[10px] font-bold ' + getMoodBadgeClass(n.mood) + '">' + escapeHtml(n.mood) + '</span>' : '') +
      (n.pinned ? '<span class="text-[11px] text-slate-500">' + escapeHtml(String(n.createdAt || '').slice(0, 10).replace(/-/g, '/')) + '</span>' : '');
    var replies = (Array.isArray(n.replies) && n.replies.length) ? '<div class="space-y-1.5">' + n.replies.map(function(rep) {
      return '<div class="border-l-2 border-slate-300 pl-2.5 py-0.5 text-[13px] text-slate-800 whitespace-pre-wrap break-words"><span class="text-[10px] text-slate-500 mr-1.5">' + escapeHtml((rep.date || '').slice(5).replace('-', '/')) + ' ' + escapeHtml(rep.time || '') + '</span>' + formatContentWithClickableTags(rep.text || '') + '</div>';
    }).join('') + '</div>' : '';

    return feedCard(n.pinned ? 'pin' : (isLong ? 'long' : 'post'),
      '<div class="flex items-center gap-2 flex-wrap">' + chips + '</div>' +
      (n.title ? '<h3 class="text-[15px] font-bold text-slate-950 leading-snug">' + escapeHtml(n.title) + '</h3>' : '') +
      (n.content ? clampedHtml('n:' + n.id, formatContentWithClickableTags(n.content)) : '') +
      photoGridHtml(n) + replies +
      '<div class="flex items-center justify-between -mb-1">' +
        '<div class="flex items-center">' +
          feedIcon('fa-solid fa-hashtag', 'タグ', act('openNoteTagSheet')) +
          feedIcon('fa-solid fa-pen', '編集', act('editNoteItem')) +
          feedIcon('fa-solid fa-reply', '追記', act('appendSnsThreadReply')) +
                    feedIcon('fa-solid fa-thumbtack', 'ピン留め', act('togglePinSnsNote'), n.pinned ? 'is-on' : '') +
        '</div>' +
        feedIcon('fa-solid fa-trash-can', '削除', act('deleteSnsNote')) +
      '</div>', n.id);
  }

  // ---- 長い文章の折りたたみ ----
  var openTexts = {};
  function clampedHtml(key, inner) {
    var k = escapeHtml(key), open = !!openTexts[key] || !!feedQuery();
    return '<div><div data-clamp="' + k + '" class="text-[14px] text-slate-900 whitespace-pre-wrap leading-relaxed break-words' + (open ? '' : ' feed-clamp') + '">' + inner + '</div>' +
      '<button type="button" data-more="' + k + '" onclick="toggleMore(this)" class="hidden mt-1 py-1 text-[13px] font-bold text-blue-700 underline underline-offset-4 decoration-slate-300">もっと見る</button></div>';
  }

  // 6 行に収まらないものだけにボタンを出す
  function updateMoreButtons(root) {
    root.querySelectorAll('[data-clamp]').forEach(function(el) {
      var btn = el.nextElementSibling, key = el.getAttribute('data-clamp');
      var long = el.classList.contains('feed-clamp') ? el.scrollHeight > el.clientHeight + 2 : !!openTexts[key];
      btn.classList.toggle('hidden', !long);
      btn.textContent = el.classList.contains('feed-clamp') ? 'もっと見る' : '閉じる';
    });
  }

  function toggleMore(btn) {
    var el = btn.previousElementSibling, key = btn.getAttribute('data-more');
    var opening = el.classList.contains('feed-clamp');
    openTexts[key] = opening;
    el.classList.toggle('feed-clamp', !opening);
    btn.textContent = opening ? '閉じる' : 'もっと見る';
    if (!opening) el.closest('article').scrollIntoView({ block: 'nearest' });
  }

  // ------------------------------------------------------------
  // 表示の切り替え・検索
  // ------------------------------------------------------------
  var FEED_PAGE = 60;
  var feedLimit = FEED_PAGE;
  var feedAllTags = false;
  var feedSearchTimer = null;

  function feedQuery() { return ((document.getElementById('snsSearchInput') || {}).value || '').trim(); }

  function onFeedSearchInput() {
    clearTimeout(feedSearchTimer);
    feedSearchTimer = setTimeout(function() {
      feedLimit = FEED_PAGE;
      renderNotesWorkspace();
    }, 200);
  }

  function showMoreFeed() {
    feedLimit += FEED_PAGE;
    renderNotesWorkspace();
  }

  function renderFeedSummary(items, q) {
    var el = document.getElementById('feedResultSummary');
    if (!el) return;
    var on = !!(q || activeSnsTagFilter);
    el.classList.toggle('hidden', !on);
    if (!on) return;
    el.textContent = items.length + ' 件' + (activeSnsTagFilter ? '（' + (activeSnsTagFilter === UNTAGGED ? 'タグなし' : activeSnsTagFilter) + '）' : '');
  }

  App.on('data:loaded', function() {
    if (currentView === 'timeline') renderNotesWorkspace();
  });
  window.addEventListener('DOMContentLoaded', function() { setTimeout(takeSharedItem, 0); });
  // アプリを開いたまま共有されたときも受け取る
  document.addEventListener('visibilitychange', function() { if (document.visibilityState === 'visible') takeSharedItem(); });
  document.addEventListener('keydown', function(e) {
    if (e.target && e.target.id === 'snsQuickPostInput' && e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); submitQuickSnsPost(); }
  });
</script>

  <script>
    if (typeof bootAppFast === 'function') bootAppFast();
  </script>
</body>
</html>
