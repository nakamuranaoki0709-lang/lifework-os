<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Life & Work OS</title>
  <style>
  /* 配色は 04_開発ツール/theme.mjs で一元管理。ここは部品の形だけを決める */
  :root {
    --bg-canvas: #f1f3f6;
    --surface-card: #ffffff;
    --ink: #0a101d;
    --primary: #142445;
    --accent: #284379;
    --line: #e2e6ec;
    --muted: #667085;
  }

  html, body {
    height: auto;
    min-height: 100%;
    overflow-y: auto !important;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', 'Yu Gothic', sans-serif;
    font-feature-settings: 'palt' 1;
    background-color: var(--bg-canvas);
    color: #111827;
    -webkit-tap-highlight-color: transparent;
    -webkit-font-smoothing: antialiased;
  }

  .hidden { display: none !important; }

  button, input, select, textarea { touch-action: manipulation; }
  input:focus-visible, textarea:focus-visible, select:focus-visible { border-color: var(--accent) !important; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }

  /* カード: 縁の色分けはせず、白・細線・薄い影で統一 */
  .card-surface {
    background: var(--surface-card);
    border: 1px solid var(--line) !important;
    border-radius: 14px;
    box-shadow: 0 1px 2px rgba(10, 16, 29, 0.04), 0 10px 24px -20px rgba(10, 16, 29, 0.25);
    background-image: none !important;
  }
  .card-surface h2, .card-surface h3 { letter-spacing: 0.01em; }
  .tracking-widest { white-space: nowrap; }

  /* 記録画面: 見出しは小見出しの下に置き、狭い幅でも折り返さない */
  #journalEditWorkspace .items-baseline:has(> .tracking-widest) { flex-direction: column; align-items: flex-start; gap: 1px; }
  #journalEditWorkspace .items-baseline > .tracking-widest { color: var(--muted); }
  #journalHeroSummaryCard { border-radius: 14px; }
  #journalHeroSummaryCard > div:first-child { flex-wrap: wrap; row-gap: 2px; }

  #journalEditWorkspace > .card-surface .grid span { white-space: nowrap; }
  @media (max-width: 480px) {
    #journalHeroSummaryCard .grid-cols-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); row-gap: 8px; }
  }

  #slot-modals > div:not([id]) { position: static !important; }

  /* 左サイドレール */
  #leftSideRail {
    position: fixed;
    top: 0;
    left: 0;
    bottom: 0;
    width: 58px;
    z-index: 40;
    background: var(--ink);
    padding-bottom: env(safe-area-inset-bottom, 6px);
  }

  #mainShellWrap {
    width: 100%;
    min-height: 100vh;
    padding-left: 0;
    padding-bottom: 28px;
  }

  .rail-tab-active {
    background: rgba(255, 255, 255, 0.1);
    color: #ffffff;
    font-weight: 800;
    position: relative;
  }
  .rail-tab-active::before {
    content: '';
    position: absolute;
    left: 0;
    top: 22%;
    bottom: 22%;
    width: 2px;
    border-radius: 2px;
    background: #cbab63;
  }
  .rail-tab-inactive { color: #98a2b3; font-weight: 600; }
  .rail-tab-inactive:hover { color: #ffffff; }

  /* 未記録の入力がある印 */
  #btnViewForm { position: relative; }
  #btnViewForm.has-draft::after {
    content: '';
    position: absolute;
    right: 8px;
    top: 5px;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #cbab63;
  }

  /* 打刻ボタン（打刻済みは点灯） */
  .stamp-circle-btn {
    width: 46px;
    height: 34px;
    border-radius: 10px;
    border: 1px solid rgba(255, 255, 255, 0.14);
    color: #98a2b3;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1px;
    transition: all 0.14s ease;
  }
  .stamp-circle-btn:active { transform: scale(0.93); }
  .stamp-circle-btn.is-stamped { background: #284379; color: #ffffff; border-color: #4f69a3; }

  /* Today */
  .today-hero { background: var(--ink); color: #ffffff; border-radius: 16px; padding: 14px 14px 12px; }
  .today-hero-top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .today-hero-date { flex: none; display: flex; align-items: baseline; gap: 7px; }
  .today-hero-date b { font-size: 21px; font-weight: 800; letter-spacing: 0.01em; }
  .today-hero-date span { font-size: 13px; color: #aebcd8; }
  .today-hero-date em { font-style: normal; font-size: 11px; font-weight: 700; color: #dcc791; }
  .today-hero-credo { min-width: 0; font-size: 11px; line-height: 1.45; color: #aebcd8; text-align: right; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
  .today-next { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; margin-top: 11px; padding: 10px 13px; text-align: left; border-radius: 12px; background: rgba(255, 255, 255, 0.09); border-left: 3px solid #cbab63; }
  .today-next:active { background: rgba(255, 255, 255, 0.15); }
  .today-next span { min-width: 0; }
  .today-next small { display: block; font-size: 11px; color: #dcc791; }
  .today-next b { display: block; font-size: 15px; font-weight: 700; line-height: 1.4; overflow-wrap: anywhere; }
  .today-next i { font-size: 11px; color: #7f94c0; }
  .today-progress { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 12px; }
  .today-progress button { text-align: left; }
  .today-progress span { font-size: 11px; line-height: 20px; color: #aebcd8; }
  .today-progress b { float: right; font-size: 13px; line-height: 20px; font-variant-numeric: tabular-nums; }
  .today-progress small { font-size: 11px; font-weight: 500; color: #7f94c0; }
  .today-progress i { display: block; clear: both; height: 3px; margin-top: 5px; border-radius: 3px; background: rgba(255, 255, 255, 0.14); overflow: hidden; }
  .today-progress s { display: block; height: 100%; background: #cbab63; }

  .today-card { padding: 10px 14px 8px; }
  .today-head { display: flex; align-items: center; gap: 8px; min-height: 32px; }
  .today-head h2 { font-size: 15px; font-weight: 800; color: #0a101d; }
  .today-none { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .today-icon-btn { width: 36px; height: 32px; border-radius: 9px; font-size: 12px; color: #667085; }
  .today-icon-btn:active { background: #eef0f4; }
  .today-text-btn { padding: 5px 9px; border-radius: 8px; border: 1px solid var(--line); font-size: 11px; font-weight: 700; color: #475467; }
  .today-text-btn.is-on { background: var(--primary); border-color: var(--primary); color: #ffffff; }
  .today-group { display: flex; align-items: center; justify-content: space-between; padding: 9px 0 3px; font-size: 11px; font-weight: 700; color: var(--muted); }
  .today-group button { padding: 4px 9px; border-radius: 8px; border: 1px solid var(--line); color: #344054; }
  .is-late, .today-head h2.is-late { color: #9c3a43; }

  .today-event { display: flex; align-items: center; gap: 11px; padding: 8px 0 8px 10px; border-left: 3px solid var(--ev); margin-bottom: 5px; }
  .today-event-time { flex: none; width: 44px; font-size: 14px; font-weight: 800; color: #142445; font-variant-numeric: tabular-nums; line-height: 1.25; }
  .today-event-time small { display: block; font-size: 11px; font-weight: 500; color: var(--muted); }
  .today-event-title { flex: 1; min-width: 0; font-size: 14px; color: #111827; overflow-wrap: anywhere; }
  .today-event.is-past { opacity: 0.45; }
  .today-event.is-now { background: #f4f6fa; border-radius: 0 10px 10px 0; padding-right: 8px; }
  .today-log-btn { flex: none; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line); font-size: 11px; font-weight: 700; color: #344054; }

  .task-row { position: relative; overflow: hidden; border-top: 1px solid #eef0f4; touch-action: pan-y; }
  .today-head + div > .task-row:first-child, .today-group + .task-row { border-top: 0; }
  .task-front { position: relative; display: flex; align-items: flex-start; background: #ffffff; transition: transform 0.16s ease; }
  .task-row.is-swiping .task-front { transition: none; }
  .task-under { position: absolute; inset: 0; display: none; align-items: center; justify-content: space-between; padding: 0 14px; background: #98a2b3; color: #ffffff; font-size: 13px; font-weight: 700; }
  .task-row.is-swiping .task-under { display: flex; }
  .task-row.to-right .task-under span:last-child, .task-row:not(.to-right) .task-under span:first-child { visibility: hidden; }
  .task-row.is-armed .task-under { background: var(--primary); }
  .today-check { flex: none; width: 42px; height: 44px; margin-left: -10px; display: flex; align-items: center; justify-content: center; }
  .today-check i { width: 22px; height: 22px; border-radius: 50%; border: 2px solid #98a2b3; color: transparent; font-size: 11px; display: flex; align-items: center; justify-content: center; }
  .today-check.prio-1 i { border-color: #b24a52; }
  .today-check.prio-2 i { border-color: #b08d45; }
  .today-check.prio-3 i { border-color: #36528f; }
  .today-check:active i, .today-check.is-on i, .task-sub.is-done .today-check i, .task-row.is-done .today-check i { background: var(--primary); border-color: var(--primary); color: #ffffff; }
  .today-todo-body { flex: 1; min-width: 0; padding: 11px 0 10px; cursor: pointer; }
  .today-todo-title { font-size: 15px; line-height: 1.45; color: #111827; overflow-wrap: anywhere; }
  .task-row.is-done .today-todo-title, .task-sub.is-done > span { color: #98a2b3; text-decoration: line-through; }
  .today-todo-meta { display: flex; flex-wrap: wrap; gap: 3px 10px; margin-top: 2px; font-size: 12px; color: var(--muted); }
  .today-empty { display: block; width: 100%; padding: 12px 0; text-align: left; font-size: 13px; color: var(--muted); }
  .today-fold { display: flex; align-items: center; justify-content: space-between; width: 100%; padding: 11px 0; border-top: 1px solid #eef0f4; font-size: 12px; font-weight: 600; color: #475467; }
  .today-fold i { font-size: 10px; color: #98a2b3; margin-right: 12px; }

  #habitDailyListArea > div > .today-habit:first-child { border-top: 0; }
  /* タスク画面 */
  .task-tabs { display: grid; grid-template-columns: repeat(5, auto); gap: 2px; padding: 3px; border-radius: 12px; background: #e2e6ec; }
  .task-tabs button { padding: 9px 2px; border-radius: 9px; font-size: 12px; font-weight: 700; color: #475467; white-space: nowrap; }
  .task-tabs button.is-on { background: var(--primary); color: #ffffff; }
  .task-tabs small { margin-left: 3px; font-size: 11px; font-weight: 700; color: #937434; }
  .task-tabs .is-on small { color: #dcc791; }
  .task-subbar { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
  .task-subbar .feed-chip { flex: none; padding: 7px 12px; font-size: 12px; }
  .task-sub { display: flex; align-items: center; }
  .task-sub > span { flex: 1; min-width: 0; font-size: 14px; overflow-wrap: anywhere; }
  .quick-preview { display: flex; flex-wrap: wrap; gap: 6px; }
  .quick-preview button { display: flex; align-items: center; gap: 6px; padding: 6px 9px; border-radius: 8px; background: #e8ecf4; color: #142445; font-size: 12px; font-weight: 700; }
  .quick-preview i { font-size: 11px; color: #667085; }

  /* 下から出るシート */
  .sheet { position: fixed; inset: 0; z-index: 50; background: rgba(10, 16, 29, 0.5); display: flex; align-items: flex-end; justify-content: center; padding-bottom: var(--kb, 0px); }
  .sheet-panel { width: 100%; max-width: 32rem; max-height: calc(92dvh - var(--kb, 0px)); overflow-y: auto; padding: 8px 14px calc(16px + env(safe-area-inset-bottom, 0px)); border-radius: 18px 18px 0 0; background: #ffffff; display: flex; flex-direction: column; gap: 10px; }
  .sheet-grip { flex: none; width: 38px; height: 4px; margin: 0 auto 2px; border-radius: 4px; background: #cbd2dc; }
  .sheet-title { flex: 1; min-width: 0; padding: 9px 0; font-size: 17px; font-weight: 700; line-height: 1.4; color: #0a101d; resize: none; outline: none; overflow: hidden; }
  .sheet-row { display: flex; align-items: center; gap: 10px; min-height: 40px; }
  .sheet-row > span:first-child { flex: none; width: 60px; font-size: 12px; font-weight: 700; color: var(--muted); }
  .sheet-value { flex: 1; min-width: 0; padding: 9px 11px; border: 1px solid var(--line); border-radius: 10px; background: #ffffff; text-align: left; font-size: 14px; color: #111827; }
  .sheet-input { width: 100%; padding: 9px 11px; border: 1px solid var(--line); border-radius: 10px; font-size: 14px; outline: none; resize: none; background: #ffffff; }
  .sheet-pick { display: flex; align-items: center; gap: 8px; padding: 8px 11px; border: 1px solid var(--line); border-radius: 10px; font-size: 12px; color: var(--muted); }
  .sheet-pick input { flex: 1; min-width: 0; font-size: 14px; color: #111827; background: transparent; outline: none; }
  .task-prio { flex: 1; display: grid; grid-template-columns: repeat(4, auto); gap: 4px; }
  .task-prio button { padding: 8px 2px; border: 1px solid var(--line); border-radius: 9px; font-size: 11px; font-weight: 700; color: #475467; white-space: nowrap; }
  .task-prio i { display: inline-block; width: 8px; height: 8px; margin-right: 4px; border-radius: 50%; border: 2px solid #98a2b3; }
  .task-prio .prio-1 i { border-color: #b24a52; }
  .task-prio .prio-2 i { border-color: #b08d45; }
  .task-prio .prio-3 i { border-color: #36528f; }
  .task-prio .is-on { background: var(--primary); border-color: var(--primary); color: #ffffff; }
  .task-dates { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .task-dates button { padding: 10px 2px; border: 1px solid var(--line); border-radius: 10px; text-align: center; }
  .task-dates b { display: block; font-size: 13px; color: #142445; white-space: nowrap; }
  .task-dates small { font-size: 11px; color: var(--muted); white-space: nowrap; }
  .task-dates .is-on { background: var(--primary); border-color: var(--primary); }
  .task-dates .is-on b, .task-dates .is-on small { color: #ffffff; }

  .today-habit { display: flex; align-items: center; gap: 11px; width: 100%; min-height: 44px; padding: 5px 0; text-align: left; border-top: 1px solid #eef0f4; }
  .today-group + .today-habit { border-top: 0; }
  .today-habit-box { flex: none; width: 22px; height: 22px; border-radius: 7px; border: 2px solid #98a2b3; color: transparent; font-size: 11px; display: flex; align-items: center; justify-content: center; }
  .today-habit.is-done .today-habit-box { background: var(--primary); border-color: var(--primary); color: #ffffff; }
  .today-habit-body { flex: 1; min-width: 0; }
  .today-habit-body b { display: block; font-size: 14px; font-weight: 600; color: #111827; }
  .today-habit.is-done b { color: #98a2b3; }
  .today-habit-body small { display: block; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .today-habit-side { flex: none; font-size: 11px; color: #937434; font-weight: 700; }

  /* 5 段階の評価 */
  .slim-rating-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 4px 0;
  }
  .slim-seg-group {
    display: inline-grid;
    grid-template-columns: repeat(5, 32px);
    gap: 2px;
    background: #eef0f4;
    padding: 2px;
    border-radius: 9px;
  }
  .slim-seg-btn {
    height: 26px;
    border-radius: 7px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-size: 12px;
    font-weight: 700;
    color: #667085;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.1s ease;
  }
  .slim-seg-btn:hover { color: #111827; }
  .slim-seg-btn.is-selected { background: var(--primary); color: #ffffff; }

  /* メモの入力 */
  .memo-compose { padding: 10px 12px; display: flex; flex-direction: column; gap: 7px; }
  .memo-title { width: 100%; padding: 4px 2px; font-size: 16px; font-weight: 700; color: #0a101d; outline: none; border-bottom: 1px solid var(--line); }
  .memo-input { width: 100%; min-height: 84px; max-height: 50vh; padding: 4px 2px; font-size: 16px; line-height: 1.6; color: #111827; resize: none; outline: none; background: transparent; }
  .memo-tagline { display: flex; align-items: center; gap: 6px; }
  .tag-row { display: flex; gap: 6px; overflow-x: auto; flex: 1; min-width: 0; padding: 2px 0; scrollbar-width: none; }
  .tag-row::-webkit-scrollbar { display: none; }
  .memo-sticky, .memo-addtag { flex: none; width: 34px; height: 32px; border-radius: 8px; border: 1px solid var(--line); color: #98a2b3; font-size: 12px; font-weight: 700; }
  .memo-sticky.is-on { background: var(--primary); border-color: var(--primary); color: #dcc791; }
  .memo-sticky-note { font-size: 12px; color: #775d2a; }
  .memo-sticky-note button { margin-left: 8px; font-weight: 700; text-decoration: underline; color: #475467; }
  .memo-chip { padding: 8px 12px; border-radius: 9px; border: 1px solid var(--line); background: #ffffff; font-size: 13px; font-weight: 700; color: #344054; }
  .memo-chip.is-on { background: var(--primary); border-color: var(--primary); color: #ffffff; }
  .memo-tag-preview { font-size: 13px; line-height: 1.5; color: #475467; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden; }

  /* 1人SNS */
  .feed-card {
    position: relative;
    background: var(--surface-card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 12px 14px 12px 18px;
    box-shadow: 0 1px 2px rgba(10, 16, 29, 0.04), 0 10px 24px -20px rgba(10, 16, 29, 0.25);
  }
  .feed-card::before {
    content: '';
    position: absolute;
    left: 7px;
    top: 14px;
    bottom: 14px;
    width: 3px;
    border-radius: 3px;
    background: var(--feed-mark, #284379);
  }
  .feed-kind {
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.06em;
    color: var(--feed-mark, #284379);
  }
  /* 行動記録（打刻など）の投稿 */
  .feed-time { flex: none; font-size: 12px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
  .feed-event-label { font-size: 13px; font-weight: 800; color: #142445; }
  .feed-day {
    display: flex;
    align-items: center;
    gap: 10px;
    padding-top: 10px;
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 0.04em;
    color: #1f2937;
  }
  .feed-day::after { content: ''; flex: 1; height: 1px; background: #cbd2dc; }
  .feed-day small { font-size: 11px; font-weight: 700; color: var(--muted); }
  .feed-day .is-sun { color: #9c3a43; }
  .feed-day .is-sat { color: #36528f; }
  .feed-icon-btn { width: 38px; height: 34px; border-radius: 9px; font-size: 13px; color: #98a2b3; }
  .feed-icon-btn:hover { color: #1f2937; }
  .feed-icon-btn:active { background: #eef0f4; }
  .feed-icon-btn.is-on { color: #b08d45; }
  .feed-tag { font-weight: 700; color: #36528f; }
  .feed-chip {
    padding: 5px 10px;
    border-radius: 9px;
    border: 1px solid var(--line);
    background: #ffffff;
    font-size: 11px;
    font-weight: 700;
    color: #344054;
  }
  .feed-chip.is-active { background: var(--primary); border-color: var(--primary); color: #ffffff; }
  /* 長い文章は 6 行で折りたたむ */
  .feed-clamp {
    display: -webkit-box;
    -webkit-line-clamp: 6;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .clamp-2 {
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .clamp-3 {
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .grid-cols-14 { display: grid; grid-template-columns: repeat(14, minmax(0, 1fr)); }
  .grid-cols-30 { display: grid; grid-template-columns: repeat(30, minmax(0, 1fr)); }
  .grid-cols-12 { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); }

  #targetDate::-webkit-calendar-picker-indicator {
    filter: invert(1);
    opacity: 0.65;
    cursor: pointer;
    width: 10px;
    height: 10px;
  }
</style>

<script>
  // ------------------------------------------------------------
  // サーバーとの通信は全てここを通る（POST 本文にトークンを入れ、URL には載せない）
  // ------------------------------------------------------------
  var KEY_API_TOKEN = 'lifework_os_api_token';
  var apiAuthRejected = false;

  function getApiToken() {
    try { return localStorage.getItem(KEY_API_TOKEN) || ''; } catch (e) { return ''; }
  }

  // 未接続・トークン不一致の間は送信せず、端末に溜めておく
  function canCallApi() {
    return !!getApiToken() && !apiAuthRejected;
  }

  function apiError(message, code) {
    var err = new Error(message);
    err.code = code;
    return err;
  }

  function postApi(token, fn, args, timeoutMs) {
    var ctrl = new AbortController();
    var timer = setTimeout(function() { ctrl.abort(); }, timeoutMs || 45000);
    return fetch(window.LWOS_ENDPOINT, {
      method: 'POST',
      redirect: 'follow',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ token: token, fn: fn, args: args }),
      signal: ctrl.signal
    }).then(function(r) { return r.text(); }).then(function(txt) {
      clearTimeout(timer);
      var res;
      try { res = JSON.parse(txt); } catch (e) { throw apiError('サーバーの応答を読み取れません', 'BAD_RESPONSE'); }
      if (!res || !res.ok) throw apiError((res && res.error) || 'サーバーエラー', (res && res.code) || 'ERROR');
      return res.result;
    }, function(err) {
      clearTimeout(timer);
      throw apiError(err && err.name === 'AbortError' ? '通信がタイムアウトしました' : '通信できませんでした', 'NETWORK');
    });
  }

  function callApi(fn, args, timeoutMs) {
    if (!getApiToken()) return Promise.reject(apiError('接続トークンが未設定です', 'NO_TOKEN'));
    return postApi(getApiToken(), fn, args, timeoutMs).catch(function(err) {
      if (err.code === 'UNAUTHORIZED' && !apiAuthRejected) {
        apiAuthRejected = true;
        openConnectModal('トークンが一致しません。新しい接続トークンを入力してください。入力済みの記録はこの端末に保存されています。');
        updateSyncBadge();
      }
      throw err;
    });
  }

  window.runGas = function(fnName, arg, timeoutMs) {
    return callApi(fnName, arg === undefined ? [] : [arg], timeoutMs);
  };

  function openConnectModal(msg) {
    document.getElementById('connectModalMsg').textContent = msg ||
      'この端末で最初に 1 回だけ、接続トークンを入力してください。未接続でも記録でき、接続後にまとめて送信されます。';
    document.getElementById('connectTokenInput').value = '';
    document.getElementById('connectModal').classList.remove('hidden');
  }

  function closeConnectModal() {
    document.getElementById('connectModal').classList.add('hidden');
  }

  function submitConnectToken(e) {
    e.preventDefault();
    var token = document.getElementById('connectTokenInput').value.trim();
    var btn = document.getElementById('connectSubmitBtn');
    if (!token) return;
    btn.disabled = true;
    btn.textContent = '確認中...';
    // 正しいトークンだと確認できてから保存する（未知の操作 = 認証は通過）
    postApi(token, '__ping__', [], 30000).catch(function(err) {
      if (err.code !== 'UNKNOWN_ACTION') throw err;
    }).then(function() {
      try { localStorage.setItem(KEY_API_TOKEN, token); } catch (err) {}
      apiAuthRejected = false;
      closeConnectModal();
      showToast('接続しました');
      syncAndFetchBundle(false);
    }).catch(function(err) {
      document.getElementById('connectModalMsg').textContent = err.code === 'UNAUTHORIZED'
        ? 'トークンが違います。もう一度確認してください。'
        : (err.message + '。通信状態を確認して、もう一度お試しください。');
    }).then(function() {
      btn.disabled = false;
      btn.textContent = '接続する';
    });
  }
</script>

  <script>
  var KEY_DB_CACHE = 'worklife_os_db_cache_v3';
  var KEY_SYNC_QUEUE = 'worklife_os_sync_queue_v3';
  var KEY_FAILED_QUEUE = 'worklife_os_failed_queue_v3';

  var db = {
    workLogs: [],
    privateLogs: [],
    notes: [],
    todos: [],
    habits: [],
    workHabits: [],
    privateHabits: [],
    habitLogs: [],
    workGoals: { current: {}, history: [] },
    privateGoals: { current: {}, history: [] },
    meta: {}
  };

  var syncQueue = [];
  var failedQueue = [];
  var isSyncingNow = false;
  var lastSyncError = '';

  function formatDateLocal(d) {
    if (!d) d = new Date();
    if (typeof d === 'string') return d.slice(0, 10);
    var y = d.getFullYear();
    var m = ('0' + (d.getMonth() + 1)).slice(-2);
    var day = ('0' + d.getDate()).slice(-2);
    return y + '-' + m + '-' + day;
  }

  function getShiftDateStr(baseDateStr, offsetDays) {
    var parts = String(baseDateStr || formatDateLocal(new Date())).split('-');
    var d = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]) + offsetDays, 12, 0, 0);
    return formatDateLocal(d);
  }

  function getMonday(d) {
    var dt = new Date(d);
    var day = dt.getDay();
    var diff = dt.getDate() - day + (day === 0 ? -6 : 1);
    dt.setDate(diff);
    return formatDateLocal(dt);
  }

  function escapeHtml(str) {
    return String(str == null ? '' : str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function showToast(msg, isWarn) {
    var t = document.getElementById('toast');
    var m = document.getElementById('toastMsg');
    var ic = document.getElementById('toastIcon');
    if (!t || !m) return;
    m.textContent = msg;
    if (ic) {
      ic.className = isWarn
        ? 'fa-solid fa-circle-exclamation text-amber-400'
        : 'fa-solid fa-check text-emerald-400';
    }
    t.classList.remove('opacity-0');
    clearTimeout(window._toastTimer);
    window._toastTimer = setTimeout(function() {
      t.classList.add('opacity-0');
    }, 2400);
  }

  function mergeDbSnapshot(incoming) {
    if (!incoming || typeof incoming !== 'object') return;
    if (Array.isArray(incoming.workLogs)) db.workLogs = incoming.workLogs;
    if (Array.isArray(incoming.privateLogs)) db.privateLogs = incoming.privateLogs;
    if (Array.isArray(incoming.notes)) {
      db.notes = incoming.notes;
      if (typeof KEY_LOCAL_NOTES !== 'undefined') {
        try { localStorage.setItem(KEY_LOCAL_NOTES, JSON.stringify(db.notes)); } catch (e) {}
      }
    }
    if (Array.isArray(incoming.todos)) {
      db.todos = incoming.todos;
      if (typeof KEY_LOCAL_TODOS !== 'undefined') {
        try { localStorage.setItem(KEY_LOCAL_TODOS, JSON.stringify(db.todos)); } catch (e) {}
      }
    }
    if (Array.isArray(incoming.habits)) db.habits = incoming.habits;
    if (Array.isArray(incoming.workHabits)) {
      db.workHabits = incoming.workHabits;
      if (!Array.isArray(incoming.habits)) db.habits = incoming.workHabits;
    }
    if (Array.isArray(incoming.privateHabits)) db.privateHabits = incoming.privateHabits;
    if (Array.isArray(incoming.habitLogs)) db.habitLogs = incoming.habitLogs;
    if (incoming.workGoals) db.workGoals = incoming.workGoals;
    if (incoming.privateGoals) db.privateGoals = incoming.privateGoals;
    if (incoming.meta) db.meta = incoming.meta;
  }

  // 未送信の記録を最優先で保存する。保存できないときは黙って続けず、知らせる
  var localSaveFailed = false;
  function saveLocalCache() {
    var ok = true;
    [[KEY_SYNC_QUEUE, syncQueue], [KEY_FAILED_QUEUE, failedQueue], [KEY_DB_CACHE, db]].forEach(function(pair) {
      try { localStorage.setItem(pair[0], JSON.stringify(pair[1])); } catch (e) { ok = false; }
    });
    if (!ok && !localSaveFailed) {
      showToast('端末の保存容量が足りません。同期が終わるまでアプリを閉じないでください', true);
    }
    localSaveFailed = !ok;
    updateSyncBadge();
  }

  function loadLocalCache() {
    try {
      var rawDb = localStorage.getItem(KEY_DB_CACHE);
      if (rawDb) mergeDbSnapshot(JSON.parse(rawDb));
      var rawQ = localStorage.getItem(KEY_SYNC_QUEUE);
      if (rawQ) {
        var parsedQ = JSON.parse(rawQ);
        if (Array.isArray(parsedQ)) syncQueue = parsedQ;
      }
      var rawF = localStorage.getItem(KEY_FAILED_QUEUE);
      if (rawF) {
        var parsedF = JSON.parse(rawF);
        if (Array.isArray(parsedF)) failedQueue = parsedF;
      }
    } catch (e) {}
    resetSyncBase();
    restoreSyncBaseFromQueue();
    resetSettingsBase();
    migrateLegacyStorage();
    updateSyncBadge();
  }

  // ------------------------------------------------------------
  // 差分同期: サーバーと一致していた時点の控え（syncBase）からの変更分だけを送る
  // ------------------------------------------------------------
  var syncBase = { work: {}, priv: {}, notes: {}, todos: {} };
  var DIFF_SPECS = {
    syncWorkDailyLog: { kind: 'work', list: 'workLogs', prefix: 'work_' },
    syncPrivateDailyLog: { kind: 'priv', list: 'privateLogs', prefix: 'priv_' },
    saveNotesList: { kind: 'notes', list: 'notes', key: 'all_notes', send: 'applyNoteChanges' },
    saveTodoList: { kind: 'todos', list: 'todos', key: 'all_todos', send: 'applyTodoChanges' }
  };
  DIFF_SPECS.applyNoteChanges = DIFF_SPECS.saveNotesList;
  DIFF_SPECS.applyTodoChanges = DIFF_SPECS.saveTodoList;
  var LINE_FIELDS = ['scheduleText', 'memo'];

  function cloneJson(v) { return v === undefined ? undefined : JSON.parse(JSON.stringify(v)); }
  function sameJson(a, b) { return JSON.stringify(a) === JSON.stringify(b); }

  function blankLogFor(kind, dateStr) {
    return kind === 'work' ? newBlankWorkLog(dateStr) : newBlankPrivateLog(dateStr);
  }

  // db の現在値を、サーバーと一致した控えとして記録
  function resetSyncBase() {
    syncBase = { work: {}, priv: {}, notes: {}, todos: {} };
    (db.workLogs || []).forEach(function(l) { if (l && l.date) syncBase.work[l.date] = cloneJson(l); });
    (db.privateLogs || []).forEach(function(l) { if (l && l.date) syncBase.priv[l.date] = cloneJson(l); });
    (db.notes || []).forEach(function(n) { if (n && n.id) syncBase.notes[n.id] = cloneJson(n); });
    (db.todos || []).forEach(function(t) { if (t && t.id) syncBase.todos[t.id] = cloneJson(t); });
  }

  // 未送信の変更は、送信待ちに控えておいた変更前の値を基準に戻す
  function restoreSyncBaseFromQueue() {
    syncQueue.forEach(function(q) {
      var spec = DIFF_SPECS[q.action];
      if (!spec || !q.base) return;
      Object.keys(q.base).forEach(function(k) {
        if (q.base[k] === null) delete syncBase[spec.kind][k];
        else syncBase[spec.kind][k] = cloneJson(q.base[k]);
      });
    });
  }

  function buildLogPatch(spec, dateStr) {
    var cur = (db[spec.list] || []).find(function(l) { return l.date === dateStr; });
    if (!cur) return null;
    var stored = syncBase[spec.kind][dateStr];
    var base = stored || blankLogFor(spec.kind, dateStr);
    var patch = { set: {}, habits: {}, lines: {} };
    var changed = false;
    Object.keys(cur).forEach(function(k) {
      if (k === 'date' || k === 'id' || k === 'updatedAt' || k === 'photoUrls' || k === 'habitMap') return;
      if (cur[k] === undefined || sameJson(cur[k], base[k])) return;
      changed = true;
      if (LINE_FIELDS.indexOf(k) !== -1) patch.lines[k] = { base: base[k] || '', next: cur[k] || '' };
      else patch.set[k] = cloneJson(cur[k]);
    });
    var cm = cur.habitMap || {}, bm = base.habitMap || {};
    Object.keys(cm).concat(Object.keys(bm)).forEach(function(id) {
      if (id.charAt(0) === '_' || cm[id] === bm[id]) return;
      changed = true;
      patch.habits[id] = (cm[id] === undefined) ? null : cm[id];
    });
    if (!changed) return null;
    var baseRec = {};
    baseRec[dateStr] = stored ? cloneJson(stored) : null;
    return { payload: { date: dateStr, _patch: patch }, base: baseRec, after: cloneJson(cur) };
  }

  function buildListChanges(spec) {
    var base = syncBase[spec.kind];
    var payload = { upserts: [], deletes: [] };
    var baseRec = {}, seen = {};
    (db[spec.list] || []).forEach(function(it) {
      if (!it || !it.id) return;
      seen[it.id] = true;
      if (base[it.id] && sameJson(base[it.id], it)) return;
      payload.upserts.push(cloneJson(it));
      baseRec[it.id] = base[it.id] ? cloneJson(base[it.id]) : null;
    });
    Object.keys(base).forEach(function(id) {
      if (seen[id]) return;
      payload.deletes.push(id);
      baseRec[id] = cloneJson(base[id]);
    });
    if (payload.upserts.length === 0 && payload.deletes.length === 0) return null;
    return { payload: payload, base: baseRec };
  }

  // 送信が成功した変更を控えへ反映
  function commitSyncBase(item) {
    var spec = DIFF_SPECS[item.action];
    if (!spec || !item.base) return;
    if (item.payload._patch) {
      syncBase[spec.kind][item.payload.date] = cloneJson(item.after);
    } else {
      item.payload.upserts.forEach(function(it) { syncBase[spec.kind][it.id] = cloneJson(it); });
      item.payload.deletes.forEach(function(id) { delete syncBase[spec.kind][id]; });
    }
  }

  function queueItem(action, key, payload) {
    var item = {
      id: 'q_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
      action: action, key: key, payload: payload,
      retries: 0, lastError: '', timestamp: new Date().toISOString()
    };
    var idx = syncQueue.findIndex(function(q) { return q.action === action && q.key === key; });
    if (idx !== -1) syncQueue[idx] = item;
    else syncQueue.push(item);
    return item;
  }

  // dateStr は日次ログのみ。変更がなければ送信待ちから外す
  function queueDiff(action, dateStr) {
    var spec = DIFF_SPECS[action];
    var key = spec.prefix ? (spec.prefix + dateStr) : spec.key;
    var sendAs = spec.send || action;
    var diff = spec.prefix ? buildLogPatch(spec, dateStr) : buildListChanges(spec);
    if (!diff) {
      syncQueue = syncQueue.filter(function(q) { return !(q.action === sendAs && q.key === key && q.base); });
      return;
    }
    var item = queueItem(sendAs, key, diff.payload);
    item.base = diff.base;
    if (diff.after) item.after = diff.after;
  }

  function enqueueSync(action, dedupeKey, payload) {
    if (DIFF_SPECS[action]) {
      queueDiff(action, payload && payload.date);
    } else {
      queueItem(action, dedupeKey || ('k_' + Date.now()), cloneJson(payload));
    }
    saveLocalCache();

  var SETTING_STORES = {
    // 以前の画面の設定。今は画面がないので、端末に残っている値を変えずに持っておくだけ
    dreams: { ls: 'worklife_os_dreams_v2', read: function() { return lsJson('worklife_os_dreams_v2', []); } },
    credos: { ls: 'worklife_os_credos_v1', read: function() { return lsJson('worklife_os_credos_v1', []); } },
    capsules: { ls: 'worklife_os_capsules_v1', read: function() { return lsJson('worklife_os_capsules_v1', []); } },
    masterOptions: { ls: 'worklife_os_master_options_v2', read: function() { return lsJson('worklife_os_master_options_v2', {}); } },

      try { localStorage.setItem(SETTING_STORES[k].ls, JSON.stringify(kv[k])); } catch (e) {}
    });
    // 旧形式（periodReviews に全期間）→ 期間ごとの値の順で重ねる
    var reviews = getPeriodReviewsStore();
    var old = (kv.periodReviews && typeof kv.periodReviews === 'object') ? kv.periodReviews : {};
    Object.keys(old).forEach(function(k) { reviews[k] = String(old[k]); });
    // サーバーにない総括メモ（以前の不具合で消えたもの）は、端末に残っていれば送り直す
    var lost = Object.keys(reviews).filter(function(k) {
      return reviews[k] && old[k] === undefined && kv[REVIEW_PREFIX + k] === undefined;
    });

  var mergeLegacySettingsLater = false;
  function mergeLegacySettings(kv) {

  function updateSyncBadge() {

    var failed = failedQueue.length;

      if (label) label.textContent = pending > 0 ? ('OFFLINE (' + pending + ')') : 'OFFLINE';
    } else if (!canCallApi()) {

  function processSyncQueue(isManual) {

  function syncAndFetchBundle(isManual) {

    }
    if (isSyncingNow) return;
    if (!canCallApi()) {
      updateSyncBadge();
      if (isManual) openConnectModal();
      return;
    }
    if (Array.isArray(syncQueue) && syncQueue.length > 0) {
      processSyncQueue(isManual);
      return;

    updateSyncBadge();

    runGas('getFullAppBundle').then(function(bundle) {

        updateSyncBadge();
        processSyncQueue(isManual);
        return;

  function isUserTyping() {

  var MAX_TAGS = 3;

  var URL_PATTERN = /https?:\/\/[A-Za-z0-9\-._~:\/?#\[\]@!$&()*+,;=%]+/gi;

      var url = trimUrlTail(m);
      if (!isHttpUrl(url)) return m;
      if (pos > last) out.push({ text: s.slice(last, pos) });
      out.push({ url: url });
      last = pos + url.length;
      return m;

  function getPinnedHashtags() {

      list = [norm].concat(list).slice(0, 30);

  <script>
  // ------------------------------------------------------------
  // メモの検索と並べ方
  // ------------------------------------------------------------
  // 全角半角・大文字小文字を区別せず、空白区切りの語をすべて含むものを探す
  function normSearch(s) { return String(s == null ? '' : s).normalize('NFKC').toLowerCase(); }
  function searchTokens(q) { return normSearch(q).split(/\s+/).filter(Boolean); }
  function matchesTokens(text, tokens) {
    var t = normSearch(text);
    return tokens.every(function(k) { return t.indexOf(k) !== -1; });
  }

  function noteText(n) {
    return [n.title, n.content, n.mood, tagsOfNote(n).join(' '), (n.replies || []).map(function(r) { return r.text; }).join('\n'), n.createdAt, String(n.createdAt || '').replace(/-/g, '/')].join('\n');
  }

  // tag: 親のタグなら子も含める。UNTAGGED ならタグのないメモ（自動の投稿は除く）
  // 並び: ピン留め → 新しい日 → 新しい時刻
  function buildFeed(query, tag) {
    var tokens = searchTokens(query), items = [];
    var minsOf = function(t) { var m = String(t || '').match(/^(\d{1,2}):(\d{2})/); return m ? Number(m[1]) * 60 + Number(m[2]) : -1; };
    (db.notes || []).forEach(function(n) {
      if (tag === UNTAGGED ? tagsOfNote(n).length > 0 : (tag && !tagMatches(tagsOfNote(n), tag))) return;
      if (tokens.length && !matchesTokens(noteText(n), tokens)) return;
      items.push({ kind: 'note', date: String(n.createdAt || '').slice(0, 10), order: minsOf(n.time), pinned: !!n.pinned, note: n });
    });
    items.sort(function(a, b) {
      if (a.pinned !== b.pinned) return a.pinned ? -1 : 1;
      return b.date.localeCompare(a.date) || b.order - a.order;
    });
    return items;
  }

  function hostOf(url) {

    u.searchParams.forEach(function(v, k) { if (!TRACKING_PARAMS.test(k)) keep.push([k, v]); });
    u.search = '';
    keep.forEach(function(p) { u.searchParams.append(p[0], p[1]); });
    var out = u.toString();
    return out.replace(/\?$/, '');
  }

  // {title, text, url} → {title, body}。題名は題名欄へ、URL と残りの文章を本文へ
  function buildSharedMemo(data) {
    var title = String((data && data.title) || '').trim();
    var text = String((data && data.text) || '').trim();
    var url = String((data && data.url) || '').trim();
    var m = (url || text).match(SHARE_URL_RE);
    url = m ? cleanSharedUrl(m[0]) : '';
    if (m) text = text.replace(m[0], ' ');
    text = text.replace(/[ \t　]+/g, ' ').replace(/^\s+|\s+$/g, '');
    if (text === title) text = '';
    // YouTube などは題名の後ろにサービス名が付く（「… - YouTube」）
    title = title.replace(/\s+[-–|]\s+YouTube$/i, '');
    if (!title && text && text.length <= 80 && text.indexOf('\n') === -1) { title = text; text = ''; }
    return { title: title, body: [url, text].filter(Boolean).join('\n') };
  }

  // 本文の URL と同じサイトのメモで使ったタグ（多い順）
  function siteTags(items, text) {
    var hosts = [];
    String(text || '').replace(new RegExp(SHARE_URL_RE.source, 'g'), function(u) { var h = hostOf(u); if (h && hosts.indexOf(h) === -1) hosts.push(h); return u; });
    if (!hosts.length) return [];
    var cnt = {}, label = {};
    (items || []).forEach(function(n) {
      var body = (n.title || '') + ' ' + (n.content || '');
      var hit = (body.match(new RegExp(SHARE_URL_RE.source, 'g')) || []).some(function(u) { return hosts.indexOf(hostOf(u)) !== -1; });
      if (!hit) return;
      userTagsOf(n).forEach(function(t) { var k = tagKey(t); cnt[k] = (cnt[k] || 0) + 1; if (!label[k]) label[k] = t; });
    });
    return Object.keys(cnt).sort(function(a, b) { return cnt[b] - cnt[a]; }).map(function(k) { return label[k]; });
  }
</script>

<div id="photoViewer" onclick="closePhotoViewer()" class="fixed inset-0 z-[9998] bg-black/95 flex items-center justify-center hidden">

  <button type="button" id="photoViewerPrev" onclick="event.stopPropagation(); movePhotoViewer(-1)" class="absolute left-2 top-1/2 w-11 h-11 rounded-full bg-white/20 text-white"><i class="fa-solid fa-chevron-left"></i></button>

<script>
  // ------------------------------------------------------------
  // 写真: 端末で圧縮し、端末内（IndexedDB）に置いてから裏で送信する。オフラインでも投稿できる
  // 圧縮時に描き直すので、撮影場所などの付加情報（EXIF）は残らない
  // ------------------------------------------------------------
  var PHOTO_MAX = 4;
  var PHOTO_FULL_EDGE = 1600;
  var PHOTO_THUMB_EDGE = 640;
  var KEY_PHOTO_DRAFT = 'lifework_os_photo_draft';
  var photoDrafts = { sns: [], quick: [], edit: [] };
  try {
    var savedDrafts = JSON.parse(localStorage.getItem(KEY_PHOTO_DRAFT) || '{}') || {};
    ['sns', 'quick'].forEach(function(k) { if (Array.isArray(savedDrafts[k])) photoDrafts[k] = savedDrafts[k]; });
  } catch (e) {}
  var photoPickKey = 'sns';
  var photoUrls = {};      // 表示用 URL（キー: id:size）
  var photoPending = 0;    // 未送信の枚数
  var photoUploading = false;
  var photoFetchFailedAt = {};

  // ---- 端末内の保存 ----
  var photoDbPromise = null;
  function photoDb() {
    if (!photoDbPromise) {
      photoDbPromise = new Promise(function(resolve, reject) {
        var r = indexedDB.open('lifework_photos', 1);
        r.onupgradeneeded = function() {
          r.result.createObjectStore('blobs', { keyPath: 'key' });
          r.result.createObjectStore('meta', { keyPath: 'id' });
        };
        r.onsuccess = function() { resolve(r.result); };
        r.onerror = function() { photoDbPromise = null; reject(r.error); };
      });
    }
    return photoDbPromise;
  }

  function photoTx(store, mode, fn) {
    return photoDb().then(function(d) {
      return new Promise(function(resolve, reject) {
        var tx = d.transaction(store, mode), req = fn(tx.objectStore(store));
        tx.oncomplete = function() { resolve(req && req.result); };
        tx.onerror = tx.onabort = function() { reject(tx.error); };
      });
    });
  }

  function photoPut(store, v) { return photoTx(store, 'readwrite', function(s) { return s.put(v); }); }
  function photoGet(store, k) { return photoTx(store, 'readonly', function(s) { return s.get(k); }); }
  function photoAll(store) { return photoTx(store, 'readonly', function(s) { return s.getAll(); }); }
  function photoDel(store, k) { return photoTx(store, 'readwrite', function(s) { return s.delete(k); }); }

  function savePhotoDrafts() {
    try { localStorage.setItem(KEY_PHOTO_DRAFT, JSON.stringify({ sns: photoDrafts.sns, quick: photoDrafts.quick })); } catch (e) {}
  }

  // ---- 圧縮 ----
  function loadBitmap(file) {
    if (window.createImageBitmap) {
      return createImageBitmap(file, { imageOrientation: 'from-image' }).catch(function() { return loadImageTag(file); });
    }
    return loadImageTag(file);
  }

  function loadImageTag(file) {
    return new Promise(function(resolve, reject) {
      var url = URL.createObjectURL(file), im = new Image();
      im.onload = function() { URL.revokeObjectURL(url); resolve(im); };
      im.onerror = function() { URL.revokeObjectURL(url); reject(new Error('この形式の画像は読み込めません')); };
      im.src = url;
    });
  }

  function shrink(bmp, edge, quality) {
    var w = bmp.width || bmp.naturalWidth, h = bmp.height || bmp.naturalHeight;
    var scale = Math.min(1, edge / Math.max(w, h));
    var c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(w * scale));
    c.height = Math.max(1, Math.round(h * scale));
    var ctx = c.getContext('2d');
    ctx.fillStyle = '#ffffff'; // 透過画像の背景
    ctx.fillRect(0, 0, c.width, c.height);
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(bmp, 0, 0, c.width, c.height);
    var toBlob = function(mime) { return new Promise(function(res) { c.toBlob(res, mime, quality); }); };
    return toBlob('image/webp').then(function(b) {
      return (b && b.type === 'image/webp') ? b : toBlob('image/jpeg');
    }).then(function(b) {
      if (!b) throw new Error('画像を圧縮できませんでした');
      return { blob: b, w: c.width, h: c.height };
    });
  }

  function compressPhoto(file) {
    return loadBitmap(file).then(function(bmp) {
      return shrink(bmp, PHOTO_FULL_EDGE, 0.8).then(function(full) {
        return full.blob.size > 700 * 1024 ? shrink(bmp, PHOTO_FULL_EDGE, 0.6) : full;
      }).then(function(full) {
        return shrink(bmp, PHOTO_THUMB_EDGE, 0.7).then(function(thumb) { return { full: full, thumb: thumb }; });
      });
    });
  }

  // ---- 添付 ----
  function pickPhotos(key) {
    if (photoDrafts[key].length >= PHOTO_MAX) return showToast('写真は 1 回に ' + PHOTO_MAX + ' 枚までです', true);
    photoPickKey = key;
    var p = document.getElementById('photoPicker');
    p.value = '';
    p.click();
  }

  function onPhotosPicked(input) {
    var key = photoPickKey, files = Array.prototype.slice.call(input.files || []);
    var room = PHOTO_MAX - photoDrafts[key].length;
    if (files.length > room) showToast('写真は 1 回に ' + PHOTO_MAX + ' 枚までです', true);
    return addPhotos(key, files.slice(0, room));
  }

  function addPhotos(key, files) {
    if (!files.length) return Promise.resolve();
    showToast('写真を圧縮しています…');
    return files.reduce(function(chain, f) {
      return chain.then(function() { return addOnePhoto(key, f); });
    }, Promise.resolve()).then(function() {
      renderPhotoBar(key);
      showToast('写真を追加しました');
    }).catch(function(e) {
      renderPhotoBar(key);
      showToast('写真を追加できませんでした: ' + ((e && e.message) || e), true);
    });
  }

  function addOnePhoto(key, file) {
    return compressPhoto(file).then(function(p) {
      var id = 'ph_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8);
      var now = Date.now();
      return photoPut('blobs', { key: id + ':full', blob: p.full.blob, at: now })
        .then(function() { return photoPut('blobs', { key: id + ':thumb', blob: p.thumb.blob, at: now }); })
        .then(function() { return photoPut('meta', { id: id, mime: p.full.blob.type, thumbMime: p.thumb.blob.type, uploaded: false, fails: 0, at: now }); })
        .then(function() {
          photoDrafts[key].push({ id: id, w: p.full.w, h: p.full.h });
          savePhotoDrafts();
        });
    });
  }

  function removeDraftPhoto(key, id) {
    photoDrafts[key] = photoDrafts[key].filter(function(p) { return p.id !== id; });
    savePhotoDrafts();
    renderPhotoBar(key);
  }

  // 投稿に使う写真を取り出し、入力欄を空にする
  function takeDraftPhotos(key) {
    var list = photoDrafts[key];
    photoDrafts[key] = [];
    savePhotoDrafts();
    renderPhotoBar(key);
    return list;
  }

  function renderPhotoBar(key) {
    var box = document.getElementById('photoBar_' + key);
    if (!box) return;
    var list = photoDrafts[key];
    box.classList.toggle('hidden', list.length === 0);
    box.innerHTML = list.map(function(p) {
      return '<div class="relative w-20 h-20 shrink-0">' + photoImgHtml(p, 'w-20 h-20 object-cover rounded-lg') +
        '<button type="button" onclick="removeDraftPhoto(\'' + key + '\', \'' + p.id + '\')" class="absolute -right-1 -top-1 w-7 h-7 rounded-full bg-slate-950 text-white text-xs" title="外す"><i class="fa-solid fa-xmark"></i></button></div>';
    }).join('');
    hydratePhotos(box);
  }

  function validPhotos(n) {
    return (Array.isArray(n.images) ? n.images : []).filter(function(p) { return p && /^ph_[a-z0-9_]+$/.test(p.id || ''); });
  }

  // ---- 表示 ----
  function photoImgHtml(p, cls) {
    var url = photoUrls[p.id + ':thumb'];
    return '<img data-photo="' + escapeHtml(p.id) + '"' + (url ? ' src="' + url + '"' : '') + ' alt="写真" class="bg-slate-200 ' + cls + '">';
  }

  function photoGridHtml(n) {
    var list = validPhotos(n);
    if (!list.length) return '';
    var one = list.length === 1;
    return '<div class="' + (one ? '' : 'grid grid-cols-2 gap-1.5') + '">' + list.map(function(p, i) {
      var ratio = one && p.w && p.h ? ' style="aspect-ratio:' + Number(p.w) + '/' + Number(p.h) + ';max-height:320px"' : ' style="aspect-ratio:1/1"';
      return '<button type="button" data-note="' + escapeHtml(n.id) + '" onclick="event.stopPropagation(); openPhotoViewer(this.getAttribute(\'data-note\'), ' + i + ')" class="block w-full overflow-hidden rounded-xl bg-slate-200"' + ratio + '>' + photoImgHtml(p, 'w-full h-full object-cover') + '</button>';
    }).join('') + '</div>';
  }

  function blobUrl(key, blob) {
    if (!photoUrls[key]) photoUrls[key] = URL.createObjectURL(blob);
    return photoUrls[key];
  }

  // まず端末内、無ければサーバーから取得して端末内に残す
  function hydratePhotos(root) {
    var need = [];
    var imgs = Array.prototype.slice.call((root || document).querySelectorAll('img[data-photo]')).filter(function(im) { return !im.getAttribute('src'); });
    return Promise.all(imgs.map(function(im) {
      var id = im.getAttribute('data-photo'), key = id + ':thumb';
      if (photoUrls[key]) { im.src = photoUrls[key]; return null; }
      return photoGet('blobs', key).then(function(b) {
        if (b) im.src = blobUrl(key, b.blob);
        else if (need.indexOf(id) === -1) need.push(id);
      }).catch(function() { if (need.indexOf(id) === -1) need.push(id); });
    })).then(function() { return fetchThumbs(need); });
  }

  function fetchThumbs(ids) {
    var now = Date.now();
    ids = ids.filter(function(id) { return !(now - (photoFetchFailedAt[id] || 0) < 60000); });
    if (!ids.length || !navigator.onLine || !canCallApi()) return Promise.resolve();
    var chunk = ids.slice(0, 8);
    chunk.forEach(function(id) { photoFetchFailedAt[id] = now; }); // 取得中・失敗直後の再要求を防ぐ
    return runGas('getPhotos', { ids: chunk, size: 'thumb' }, 60000).then(function(res) {
      chunk.forEach(function(id) {
        if (!res || !res[id]) return;
        delete photoFetchFailedAt[id];
        var blob = base64ToBlob(res[id].data, res[id].mime);
        photoPut('blobs', { key: id + ':thumb', blob: blob, at: Date.now() }).catch(function() {});
        var url = blobUrl(id + ':thumb', blob);
        document.querySelectorAll('img[data-photo="' + id + '"]').forEach(function(im) { im.src = url; });
      });
      return fetchThumbs(ids.slice(8));
    }).catch(function() {});
  }

  function base64ToBlob(b64, mime) {
    var bin = atob(b64), arr = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    return new Blob([arr], { type: mime === 'image/webp' ? 'image/webp' : 'image/jpeg' });
  }

  function blobToBase64(blob) {
    return new Promise(function(resolve, reject) {
      var r = new FileReader();
      r.onload = function() { resolve(String(r.result).split(',')[1] || ''); };
      r.onerror = function() { reject(r.error); };
      r.readAsDataURL(blob);
    });
  }

  // ---- 拡大表示 ----
  var viewerList = [], viewerIdx = 0;
  function isPhotoViewerOpen() { return !document.getElementById('photoViewer').classList.contains('hidden'); }

  function openPhotoViewer(noteId, idx) {
    var n = (db.notes || []).find(function(x) { return x.id === noteId; });
    if (!n) return;
    viewerList = validPhotos(n);
    viewerIdx = idx;
    document.getElementById('photoViewer').classList.remove('hidden');
    try { history.pushState({ photo: true }, ''); } catch (e) {}
    showViewerPhoto();
  }

  function closePhotoViewer(fromBack) {
    if (!isPhotoViewerOpen()) return;
    document.getElementById('photoViewer').classList.add('hidden');
    if (fromBack !== true && history.state && history.state.photo) history.back();
  }

  function movePhotoViewer(d) {
    viewerIdx = (viewerIdx + d + viewerList.length) % viewerList.length;
    showViewerPhoto();
  }

  function showViewerPhoto() {
    var p = viewerList[viewerIdx], im = document.getElementById('photoViewerImg'), note = document.getElementById('photoViewerNote');
    if (!p) return;
    var multi = viewerList.length > 1;
    ['photoViewerPrev', 'photoViewerNext'].forEach(function(id) { document.getElementById(id).classList.toggle('hidden', !multi); });
    note.textContent = multi ? (viewerIdx + 1) + ' / ' + viewerList.length : '';
    im.src = photoUrls[p.id + ':full'] || photoUrls[p.id + ':thumb'] || '';
    if (photoUrls[p.id + ':full']) return;
    photoGet('blobs', p.id + ':full').catch(function() { return null; }).then(function(b) {
      if (b) return b.blob;
      if (!navigator.onLine || !canCallApi()) return null;
      return runGas('getPhotos', { ids: [p.id], size: 'full' }, 60000).then(function(res) {
        if (!res || !res[p.id]) return null;
        var blob = base64ToBlob(res[p.id].data, res[p.id].mime);
        photoPut('blobs', { key: p.id + ':full', blob: blob, at: Date.now() }).catch(function() {});
        return blob;
      });
    }).then(function(blob) {
      if (!blob) return;
      var url = blobUrl(p.id + ':full', blob);
      if (viewerList[viewerIdx] === p) im.src = url;
    }).catch(function() {});
  }

  window.addEventListener('popstate', function() { closePhotoViewer(true); });
  document.addEventListener('keydown', function(e) {
    if (!isPhotoViewerOpen()) return;
    if (e.key === 'Escape') closePhotoViewer();
    else if (e.key === 'ArrowLeft') movePhotoViewer(-1);
    else if (e.key === 'ArrowRight') movePhotoViewer(1);
  });

  // ---- 送信 ----
  function referencedPhotoIds() {
    var set = {};
    (db.notes || []).forEach(function(n) { validPhotos(n).forEach(function(p) { set[p.id] = true; }); });
    return set;
  }

  // 投稿に使われている未送信の写真を 1 枚ずつ送る。失敗しても端末に残し、次の機会に送り直す
  function processPhotoQueue() {
    if (photoUploading || !window.indexedDB) return Promise.resolve();
    photoUploading = true;
    return photoAll('meta').then(function(all) {
      var refs = referencedPhotoIds();
      var todo = all.filter(function(m) { return !m.uploaded && refs[m.id]; }).sort(function(a, b) { return a.at - b.at; });
      photoPending = todo.length;
      updateSyncBadge();
      if (!todo.length) return cleanupPhotos(all, refs);
      if (!navigator.onLine || !canCallApi()) return null;
      return todo.reduce(function(chain, m) {
        return chain.then(function(stop) { return stop || uploadOnePhoto(m); });
      }, Promise.resolve(false));
    }).catch(function(e) { console.warn('photo queue', e); }).then(function() {
      photoUploading = false;
      updateSyncBadge();
    });
  }

  function uploadOnePhoto(m) {
    return Promise.all([photoGet('blobs', m.id + ':full'), photoGet('blobs', m.id + ':thumb')]).then(function(b) {
      if (!b[0] || !b[1]) return false;
      return Promise.all([blobToBase64(b[0].blob), blobToBase64(b[1].blob)]).then(function(d) {
        return runGas('uploadPhoto', { id: m.id, mime: m.mime, full: d[0], thumb: d[1] }, 90000);
      }).then(function() {
        m.uploaded = true;
        photoPending = Math.max(0, photoPending - 1);
        updateSyncBadge();
        return photoPut('meta', m).then(function() { return false; });
      });
    }).catch(function(e) {
      m.fails = (m.fails || 0) + 1;
      m.lastError = (e && e.message) || String(e);
      return photoPut('meta', m).catch(function() {}).then(function() {
        return !(e && e.code === 'ERROR'); // 通信の問題なら中断し、この写真だけの問題なら次へ進む
      });
    });
  }

  // どこからも使われていない 7 日以上前の写真と、拡大用の控えが増えすぎた分だけを端末から消す
  function cleanupPhotos(all, refs) {
    if (!lastFetchAt || syncQueue.length > 0) return null;
    var drafts = {};
    Object.keys(photoDrafts).forEach(function(k) { photoDrafts[k].forEach(function(p) { drafts[p.id] = true; }); });
    var old = all.filter(function(m) { return !refs[m.id] && !drafts[m.id] && Date.now() - m.at > 7 * 86400000; });
    return old.reduce(function(chain, m) {
      return chain.then(function() { return photoDel('blobs', m.id + ':full'); })
        .then(function() { return photoDel('blobs', m.id + ':thumb'); })
        .then(function() { return photoDel('meta', m.id); });
    }, Promise.resolve()).then(function() {
      return photoTx('blobs', 'readonly', function(s) { return s.getAllKeys(); });
    }).then(function(keys) {
      var waiting = {};
      all.forEach(function(m) { if (!m.uploaded) waiting[m.id] = true; });
      var fulls = (keys || []).filter(function(k) { return /:full$/.test(k) && !waiting[k.split(':')[0]]; });
      if (fulls.length <= 60) return null;
      return photoAll('blobs').then(function(bs) {
        var del = bs.filter(function(b) { return fulls.indexOf(b.key) !== -1; }).sort(function(a, b) { return a.at - b.at; }).slice(0, fulls.length - 60);
        return Promise.all(del.map(function(b) { return photoDel('blobs', b.key); }));
      });
    });
  }

  // 使わなくなった写真を Drive のゴミ箱へ（サーバー側で、他の投稿が使っていないことを確かめる）
  function discardPhotos(list) {
    var ids = list.map(function(p) { return p.id; });
    if (ids.length) enqueueSync('trashPhotos', 'trash_' + ids[0], { ids: ids });
  }

  setTimeout(processPhotoQueue, 4000);
  window.addEventListener('online', function() { processPhotoQueue(); });
  document.addEventListener('visibilitychange', function() {
    if (document.visibilityState === 'visible') processPhotoQueue();
  });
</script>


  <div id="timelineWorkspaceSection" class="space-y-2">

    <div id="photoBar_sns" class="hidden flex items-center gap-2 overflow-x-auto py-1"></div>

      <button type="button" id="snsStickyBtn" onclick="toggleStickyTags('snsQuickPostInput')" class="memo-sticky" title="次のメモにも同じタグを付ける"><i class="fa-solid fa-thumbtack"></i></button>
