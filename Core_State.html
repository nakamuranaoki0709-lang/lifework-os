<script>
  var KEY_DB_CACHE = 'worklife_os_db_cache_v3';
  var KEY_SYNC_QUEUE = 'worklife_os_sync_queue_v3';
  var KEY_FAILED_QUEUE = 'worklife_os_failed_queue_v3';

  var db = {
    workLogs: [],
    privateLogs: [],
    notes: [],
    todos: [],
    habits: [],
    workHabits: [],
    privateHabits: [],
    habitLogs: [],
    workGoals: { current: {}, history: [] },
    privateGoals: { current: {}, history: [] },
    meta: {}
  };

  var syncQueue = [];
  var failedQueue = [];
  var isSyncingNow = false;
  var lastSyncError = '';

  function formatDateLocal(d) {
    if (!d) d = new Date();
    if (typeof d === 'string') return d.slice(0, 10);
    var y = d.getFullYear();
    var m = ('0' + (d.getMonth() + 1)).slice(-2);
    var day = ('0' + d.getDate()).slice(-2);
    return y + '-' + m + '-' + day;
  }

  function getShiftDateStr(baseDateStr, offsetDays) {
    var parts = String(baseDateStr || formatDateLocal(new Date())).split('-');
    var d = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]) + offsetDays, 12, 0, 0);
    return formatDateLocal(d);
  }

  function getMonday(d) {
    var dt = new Date(d);
    var day = dt.getDay();
    var diff = dt.getDate() - day + (day === 0 ? -6 : 1);
    dt.setDate(diff);
    return formatDateLocal(dt);
  }

  function escapeHtml(str) {
    return String(str == null ? '' : str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function showToast(msg, isWarn) {
    var t = document.getElementById('toast');
    var m = document.getElementById('toastMsg');
    var ic = document.getElementById('toastIcon');
    if (!t || !m) return;
    m.textContent = msg;
    if (ic) {
      ic.className = isWarn
        ? 'fa-solid fa-circle-exclamation text-amber-400'
        : 'fa-solid fa-check text-emerald-400';
    }
    t.classList.remove('opacity-0');
    clearTimeout(window._toastTimer);
    window._toastTimer = setTimeout(function() {
      t.classList.add('opacity-0');
    }, 2400);
  }

  function mergeDbSnapshot(incoming) {
    if (!incoming || typeof incoming !== 'object') return;
    if (Array.isArray(incoming.workLogs)) db.workLogs = incoming.workLogs;
    if (Array.isArray(incoming.privateLogs)) db.privateLogs = incoming.privateLogs;
    if (Array.isArray(incoming.notes)) {
      db.notes = incoming.notes;
      if (typeof KEY_LOCAL_NOTES !== 'undefined') {
        try { localStorage.setItem(KEY_LOCAL_NOTES, JSON.stringify(db.notes)); } catch (e) {}
      }
    }
    if (Array.isArray(incoming.todos)) {
      db.todos = incoming.todos;
      if (typeof KEY_LOCAL_TODOS !== 'undefined') {
        try { localStorage.setItem(KEY_LOCAL_TODOS, JSON.stringify(db.todos)); } catch (e) {}
      }
    }
    if (Array.isArray(incoming.habits)) db.habits = incoming.habits;
    if (Array.isArray(incoming.workHabits)) {
      db.workHabits = incoming.workHabits;
      if (!Array.isArray(incoming.habits)) db.habits = incoming.workHabits;
    }
    if (Array.isArray(incoming.privateHabits)) db.privateHabits = incoming.privateHabits;
    if (Array.isArray(incoming.habitLogs)) db.habitLogs = incoming.habitLogs;
    if (incoming.workGoals) db.workGoals = incoming.workGoals;
    if (incoming.privateGoals) db.privateGoals = incoming.privateGoals;
    if (incoming.meta) db.meta = incoming.meta;
  }

  function saveLocalCache() {
    try { localStorage.setItem(KEY_DB_CACHE, JSON.stringify(db)); } catch (e) {}
    try { localStorage.setItem(KEY_SYNC_QUEUE, JSON.stringify(syncQueue)); } catch (e) {}
    try { localStorage.setItem(KEY_FAILED_QUEUE, JSON.stringify(failedQueue)); } catch (e) {}
    updateSyncBadge();
  }

  function loadLocalCache() {
    try {
      var rawDb = localStorage.getItem(KEY_DB_CACHE);
      if (rawDb) mergeDbSnapshot(JSON.parse(rawDb));
      var rawQ = localStorage.getItem(KEY_SYNC_QUEUE);
      if (rawQ) {
        var parsedQ = JSON.parse(rawQ);
        if (Array.isArray(parsedQ)) syncQueue = parsedQ;
      }
      var rawF = localStorage.getItem(KEY_FAILED_QUEUE);
      if (rawF) {
        var parsedF = JSON.parse(rawF);
        if (Array.isArray(parsedF)) failedQueue = parsedF;
      }
    } catch (e) {}
    updateSyncBadge();
  }

  function enqueueSync(action, dedupeKey, payload) {
    var clonedPayload = null;
    try { clonedPayload = JSON.parse(JSON.stringify(payload)); } catch (e) { clonedPayload = payload; }

    var item = {
      id: 'q_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
      action: action,
      key: dedupeKey || ('k_' + Date.now()),
      payload: clonedPayload,
      retries: 0,
      lastError: '',
      timestamp: new Date().toISOString()
    };
    var idx = syncQueue.findIndex(function(q) { return q.action === item.action && q.key === item.key; });
    if (idx !== -1) {
      syncQueue[idx] = item;
    } else {
      syncQueue.push(item);
    }
    saveLocalCache();
    if (navigator.onLine) {
      processSyncQueue(false);
    }
  }

  function pushCloudAppSetting(key, valueObj) {
    enqueueSync('saveAppSettingKv', 'kv_' + key, { key: key, value: valueObj });
  }

  function pullCloudAppSettings() {
    if (!navigator.onLine || typeof google === 'undefined' || !google.script || !google.script.run) return;
    google.script.run
      .withSuccessHandler(function(kv) {
        if (!kv || typeof kv !== 'object') return;
        var updated = false;
        if (Array.isArray(kv.dreams)) {
          try { localStorage.setItem('worklife_os_dreams_v2', JSON.stringify(kv.dreams)); updated = true; } catch (e) {}
        }
        if (Array.isArray(kv.credos)) {
          try { localStorage.setItem('worklife_os_credos_v1', JSON.stringify(kv.credos)); updated = true; } catch (e) {}
        }
        if (Array.isArray(kv.capsules)) {
          try { localStorage.setItem('worklife_os_capsules_v1', JSON.stringify(kv.capsules)); updated = true; } catch (e) {}
        }
        if (kv.masterOptions && typeof kv.masterOptions === 'object') {
          try { localStorage.setItem('worklife_os_master_options_v2', JSON.stringify(kv.masterOptions)); updated = true; } catch (e) {}
        }
        if (Array.isArray(kv.pinnedHashtags)) {
          try { localStorage.setItem('worklife_os_pinned_hashtags_v1', JSON.stringify(kv.pinnedHashtags)); updated = true; } catch (e) {}
        }
        if (updated && typeof renderCurrentView === 'function') {
          renderCurrentView();
        }
      })
      .getAllAppSettingsKv();
  }

  function saveNotesImmediate() {
    if (typeof KEY_LOCAL_NOTES !== 'undefined') {
      try { localStorage.setItem(KEY_LOCAL_NOTES, JSON.stringify(db.notes)); } catch (e) {}
    }
    enqueueSync('saveNotesList', 'all_notes', db.notes);
  }

  function saveTodosImmediate() {
    if (typeof KEY_LOCAL_TODOS !== 'undefined') {
      try { localStorage.setItem(KEY_LOCAL_TODOS, JSON.stringify(db.todos)); } catch (e) {}
    }
    enqueueSync('saveTodoList', 'all_todos', db.todos);
  }

  function saveTodosAndSync() {
    saveTodosImmediate();
  }

  function updateSyncBadge() {
    var dot = document.getElementById('syncDot');
    var icon = document.getElementById('refreshIcon');
    var label = document.getElementById('syncStatusText');
    var online = navigator.onLine;
    var pending = syncQueue.length;
    var failed = failedQueue.length;

    if (icon) icon.classList.toggle('fa-spin', isSyncingNow);

    if (!online) {
      if (dot) dot.className = 'w-1.5 h-1.5 rounded-full bg-amber-400';
      if (label) label.textContent = pending > 0 ? ('OFFLINE (' + pending + ')') : 'OFFLINE';
    } else if (isSyncingNow) {
      if (dot) dot.className = 'w-1.5 h-1.5 rounded-full bg-sky-400 animate-pulse';
      if (label) label.textContent = 'SYNCING';
    } else if (pending > 0) {
      if (dot) dot.className = 'w-1.5 h-1.5 rounded-full bg-amber-400';
      if (label) label.textContent = 'WAIT ' + pending;
    } else if (failed > 0) {
      if (dot) dot.className = 'w-1.5 h-1.5 rounded-full bg-rose-400';
      if (label) label.textContent = 'ERR ' + failed;
    } else {
      if (dot) dot.className = 'w-1.5 h-1.5 rounded-full bg-emerald-400';
      if (label) label.textContent = 'SYNCED';
    }
  }

  function processSyncQueue(isManual) {
    if (!navigator.onLine) {
      updateSyncBadge();
      if (isManual) showToast('オフラインのため送信できません', true);
      return;
    }
    if (isSyncingNow) return;
    if (!Array.isArray(syncQueue) || syncQueue.length === 0) {
      updateSyncBadge();
      if (isManual) syncAndFetchBundle(true);
      return;
    }
    if (typeof google === 'undefined' || !google.script || !google.script.run) {
      updateSyncBadge();
      return;
    }

    var item = syncQueue[0];
    isSyncingNow = true;
    updateSyncBadge();
    renderSyncInspectorBody();

    var runner = google.script.run
      .withSuccessHandler(function(res) {
        isSyncingNow = false;
        var curIdx = syncQueue.findIndex(function(q) { return q.id === item.id; });
        if (curIdx !== -1) {
          syncQueue.splice(curIdx, 1);
        }
        lastSyncError = '';
        saveLocalCache();
        renderSyncInspectorBody();

        if (syncQueue.length > 0) {
          processSyncQueue(isManual);
        } else {
          if (isManual) showToast('すべてのデータを統合スプレッドシートに同期しました');
          syncAndFetchBundle(false);
        }
      })
      .withFailureHandler(function(err) {
        isSyncingNow = false;
        var errMsg = (err && err.message) ? err.message : String(err || '通信エラー');
        lastSyncError = errMsg;
        var curIdx = syncQueue.findIndex(function(q) { return q.id === item.id; });
        if (curIdx !== -1) {
          syncQueue[curIdx].retries = (syncQueue[curIdx].retries || 0) + 1;
          syncQueue[curIdx].lastError = errMsg;
          if (syncQueue[curIdx].retries >= 3) {
            var failedItem = syncQueue.splice(curIdx, 1)[0];
            failedQueue.push(failedItem);
          }
        }
        saveLocalCache();
        renderSyncInspectorBody();
        if (isManual) {
          showToast('同期エラー: ' + errMsg, true);
        }
        if (syncQueue.length > 0 && curIdx === -1) {
          processSyncQueue(isManual);
        }
      });

    if (typeof runner[item.action] !== 'function') {
      isSyncingNow = false;
      var unknownErr = '未定義の関数です: ' + item.action;
      lastSyncError = unknownErr;
      var uIdx = syncQueue.findIndex(function(q) { return q.id === item.id; });
      if (uIdx !== -1) {
        var bad = syncQueue.splice(uIdx, 1)[0];
        bad.lastError = unknownErr;
        failedQueue.push(bad);
      }
      saveLocalCache();
      renderSyncInspectorBody();
      if (syncQueue.length > 0) processSyncQueue(isManual);
      return;
    }

    runner[item.action](item.payload);
  }

  function syncAndFetchBundle(isManual) {
    if (!navigator.onLine) {
      updateSyncBadge();
      if (isManual) showToast('オフラインのため再読込できません', true);
      return;
    }
    if (isSyncingNow) return;
    if (typeof google === 'undefined' || !google.script || !google.script.run) {
      updateSyncBadge();
      return;
    }
    if (Array.isArray(syncQueue) && syncQueue.length > 0) {
      processSyncQueue(isManual);
      return;
    }

    isSyncingNow = true;
    updateSyncBadge();

    google.script.run
      .withSuccessHandler(function(bundle) {
        isSyncingNow = false;
        if (bundle && typeof bundle === 'object') {
          mergeDbSnapshot(bundle);
          lastSyncError = '';
          saveLocalCache();
          if (typeof refreshAll === 'function') {
            try { refreshAll(); } catch (e) { console.error(e); }
          }
          renderSyncInspectorBody();
          pullCloudAppSettings();
          if (isManual) showToast('統合スプレッドシートから最新データを読み込みました');
        } else {
          updateSyncBadge();
        }
      })
      .withFailureHandler(function(err) {
        isSyncingNow = false;
        var errMsg = (err && err.message) ? err.message : String(err || '取得エラー');
        lastSyncError = errMsg;
        updateSyncBadge();
        renderSyncInspectorBody();
        if (isManual) showToast('読込エラー: ' + errMsg, true);
      })
      .getFullAppBundle();
  }

  function manualSyncNow() {
    openSyncInspectorModal();
  }

  function ensureSyncInspectorDom() {
    if (document.getElementById('syncInspectorModal')) return;
    var div = document.createElement('div');
    div.id = 'syncInspectorModal';
    div.className = 'fixed inset-0 z-[9999] bg-slate-900/60 backdrop-blur-xs hidden flex items-center justify-center p-4';
    div.innerHTML =
      '<div class="bg-white w-full max-w-md rounded-2xl shadow-2xl border border-slate-200 overflow-hidden text-slate-800">' +
        '<div class="px-4 py-3 bg-slate-900 text-white flex items-center justify-between">' +
          '<div class="flex items-center gap-2 font-bold text-sm"><i class="fa-solid fa-database text-sky-400"></i>統合データベース 同期モニター</div>' +
          '<button type="button" onclick="closeSyncInspectorModal()" class="text-slate-400 hover:text-white px-2 py-1 text-xs">閉じる</button>' +
        '</div>' +
        '<div id="syncInspectorBody" class="p-4 space-y-3 max-h-[75vh] overflow-y-auto text-xs"></div>' +
      '</div>';
    document.body.appendChild(div);
  }

  function openSyncInspectorModal() {
    ensureSyncInspectorDom();
    renderSyncInspectorBody();
    document.getElementById('syncInspectorModal').classList.remove('hidden');
  }

  function closeSyncInspectorModal() {
    var m = document.getElementById('syncInspectorModal');
    if (m) m.classList.add('hidden');
  }

  function renderSyncInspectorBody() {
    var body = document.getElementById('syncInspectorBody');
    if (!body) return;
    var meta = db.meta || {};
    var sheetUrl = meta.workSheetUrl || meta.privateSheetUrl || '';
    var sheetName = meta.workSheetName || meta.privateSheetName || '統合スプレッドシート';
    var html = '';

    html += '<div class="p-3 rounded-xl bg-slate-50 border border-slate-200 space-y-1.5">' +
      '<div class="font-bold text-slate-700">接続先データベース（全9シート統合）</div>' +
      '<div>' + (sheetUrl ? '<a href="' + escapeHtml(sheetUrl) + '" target="_blank" class="text-blue-700 underline font-semibold"><i class="fa-solid fa-table-cells mr-1"></i>' + escapeHtml(sheetName) + ' を開く</a>' : '<span class="text-slate-400">未取得（下の再読込を押してください）</span>') + '</div>' +
    '</div>';

    html += '<div class="flex flex-wrap gap-2">' +
      '<button type="button" onclick="retryAllSyncFromInspector()" class="flex-1 py-2 px-3 rounded-xl bg-blue-950 text-white font-bold hover:bg-blue-900">今すぐ送信・同期</button>' +
      '<button type="button" onclick="forcePullFromInspector()" class="flex-1 py-2 px-3 rounded-xl bg-slate-100 text-slate-800 border border-slate-300 font-bold hover:bg-slate-200">シートから再読込</button>' +
    '</div>';

    if (lastSyncError) {
      html += '<div class="p-2.5 rounded-xl bg-rose-50 border border-rose-200 text-rose-800 break-all">' +
        '<div class="font-bold mb-0.5">直近の通信エラー:</div>' + escapeHtml(lastSyncError) +
      '</div>';
    }

    html += '<div class="space-y-1.5">' +
      '<div class="flex items-center justify-between font-bold text-slate-700">' +
        '<span>送信待機キュー (' + syncQueue.length + '件)</span>' +
        (syncQueue.length > 0 ? '<button type="button" onclick="clearStuckSyncQueue()" class="text-[11px] text-rose-600 underline">待機をクリア</button>' : '') +
      '</div>';

    if (syncQueue.length === 0) {
      html += '<div class="p-2.5 rounded-xl bg-emerald-50 border border-emerald-200 text-emerald-800">未送信データはありません（すべて反映済み）</div>';
    } else {
      syncQueue.forEach(function(q) {
        html += '<div class="p-2 rounded-lg bg-amber-50 border border-amber-200 space-y-0.5">' +
          '<div class="font-bold text-amber-900">' + escapeHtml(q.action) + ' <span class="font-normal text-amber-700">(' + escapeHtml(q.key) + ')</span></div>' +
          (q.lastError ? '<div class="text-rose-700 break-all">理由: ' + escapeHtml(q.lastError) + '</div>' : '<div class="text-amber-700">送信待機中（試行 ' + (q.retries || 0) + '回）</div>') +
        '</div>';
      });
    }
    html += '</div>';

    if (failedQueue.length > 0) {
      html += '<div class="space-y-1.5">' +
        '<div class="flex items-center justify-between font-bold text-rose-700">' +
          '<span>エラー隔離済み (' + failedQueue.length + '件)</span>' +
          '<button type="button" onclick="clearFailedSyncQueue()" class="text-[11px] text-slate-500 underline">履歴を消去</button>' +
        '</div>';
      failedQueue.forEach(function(f) {
        html += '<div class="p-2 rounded-lg bg-rose-50 border border-rose-200">' +
          '<div class="font-bold text-rose-900">' + escapeHtml(f.action) + ' (' + escapeHtml(f.key) + ')</div>' +
          '<div class="text-rose-700 break-all">' + escapeHtml(f.lastError || 'エラー') + '</div>' +
        '</div>';
      });
      html += '</div>';
    }

    body.innerHTML = html;
  }

  function retryAllSyncFromInspector() {
    if (failedQueue.length > 0) {
      failedQueue.forEach(function(f) { f.retries = 0; syncQueue.push(f); });
      failedQueue = [];
      saveLocalCache();
    }
    if (syncQueue.length > 0) processSyncQueue(true);
    else syncAndFetchBundle(true);
    renderSyncInspectorBody();
  }

  function forcePullFromInspector() {
    syncAndFetchBundle(true);
    renderSyncInspectorBody();
  }

  function clearStuckSyncQueue() {
    syncQueue = [];
    lastSyncError = '';
    saveLocalCache();
    renderSyncInspectorBody();
    showToast('送信待機キューをクリアしました');
  }

  function clearFailedSyncQueue() {
    failedQueue = [];
    lastSyncError = '';
    saveLocalCache();
    renderSyncInspectorBody();
  }

  window.getPrivateSteps = function(p) {
    if (!p) return '';
    if (p.steps !== undefined && p.steps !== null && p.steps !== '') return Number(p.steps);
    if (p.memo) {
      var m = String(p.memo).match(/\[歩数\]\s*(\d+)/);
      if (m) return parseInt(m[1], 10);
    }
    return '';
  };

  window.runGas = function(fnName, arg, timeoutMs) {
    return new Promise(function(resolve, reject) {
      if (typeof google === 'undefined' || !google.script || !google.script.run) {
        reject(new Error('Google Script 環境ではありません'));
        return;
      }
      var timer = setTimeout(function() {
        reject(new Error('GAS呼び出しがタイムアウトしました: ' + fnName));
      }, timeoutMs || 15000);
      var runner = google.script.run
        .withSuccessHandler(function(res) {
          clearTimeout(timer);
          resolve(res);
        })
        .withFailureHandler(function(err) {
          clearTimeout(timer);
          reject(err);
        });
      if (typeof runner[fnName] !== 'function') {
        clearTimeout(timer);
        reject(new Error('未定義のGAS関数: ' + fnName));
        return;
      }
      if (arg !== undefined) {
        runner[fnName](arg);
      } else {
        runner[fnName]();
      }
    });
  };

  window.addEventListener('DOMContentLoaded', function() {
    var statusEl = document.getElementById('syncStatusText');
    if (statusEl && statusEl.parentElement) {
      statusEl.parentElement.style.cursor = 'pointer';
      statusEl.parentElement.title = 'タップして同期ステータスとスプレッドシートリンクを表示';
      statusEl.parentElement.onclick = function(e) {
        e.preventDefault();
        e.stopPropagation();
        openSyncInspectorModal();
      };
    }
  });
</script>
