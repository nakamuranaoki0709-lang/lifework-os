<div id="timelineWorkspaceSection" class="space-y-2">

  <!-- クイック投稿カード -->
  <div class="card-surface p-2.5 space-y-1.5 border-t-2 border-t-blue-950">
    <div class="flex items-center justify-between">
      <div class="flex items-baseline gap-2">
        <span class="text-[9px] font-mono tracking-widest text-blue-950 font-bold">STREAM</span>
        <h2 class="font-bold text-xs text-slate-900">ひとりSNS</h2>
      </div>
      <div class="flex items-center gap-1.5">
        <span id="snsSelectedDateLabel" class="text-[9px] font-mono text-slate-400"></span>
        <button type="button" onclick="openNewNoteComposer()" class="px-2 py-0.5 rounded bg-indigo-950 hover:bg-indigo-900 text-white text-[9px] font-bold transition">
          長文ノート
        </button>
      </div>
    </div>

    <div class="relative space-y-1.5">
      <textarea id="snsQuickPostInput" rows="2" oninput="handleHashtagTyping(this, 'snsQuickSuggestBox'); renderQuickHashtagBar('snsQuickTagBar', 'snsQuickPostInput');" placeholder="思考・気づき・メモ（#でタグ候補表示）..." class="w-full px-2.5 py-1.5 border border-slate-200 rounded-lg text-xs bg-slate-50/60 focus:bg-white outline-none focus:border-blue-950 leading-snug"></textarea>

      <!-- # 入力時のリアルタイム候補ポップアップ -->
      <div id="snsQuickSuggestBox" class="hidden flex items-center gap-1 flex-wrap p-1 rounded-md bg-blue-950 text-white text-[10px] shadow-md"></div>

      <!-- ワンタップ・ハッシュタグバー -->
      <div class="flex items-center gap-1 flex-wrap">
        <div id="snsQuickTagBar" class="flex items-center gap-1 flex-wrap flex-1"></div>
        <button type="button" onclick="promptAddCustomHashtag('snsQuickPostInput', 'snsQuickTagBar')" class="px-1.5 py-0.5 rounded border border-dashed border-slate-300 text-[9px] font-bold text-slate-600 hover:border-blue-950 hover:text-blue-950 shrink-0">+ タグ</button>
      </div>

      <!-- 任意気分選択 ＆ 投稿ボタン -->
      <div class="flex items-center justify-between gap-1.5 pt-1 border-t border-slate-100">
        <div id="snsQuickMoodBar" class="flex items-center gap-1 flex-wrap"></div>
        <button type="button" onclick="submitQuickSnsPost()" class="px-3.5 py-1 rounded-lg bg-blue-950 hover:bg-blue-900 text-white text-[11px] font-bold transition active:scale-95 shrink-0">
          投稿
        </button>
      </div>
    </div>
  </div>

  <!-- コンパクト検索 ＆ ハッシュタグ集計・絞り込み -->
  <div class="card-surface p-2 space-y-1.5">
    <div class="flex items-center gap-1.5">
      <div class="relative flex-1">
        <i class="fa-solid fa-magnifying-glass text-[9px] text-slate-400 absolute left-2.5 top-2"></i>
        <input type="text" id="snsSearchInput" oninput="renderNotesWorkspace()" placeholder="キーワード・#タグ検索..." class="w-full pl-6 pr-2 py-1 border border-slate-200 rounded-md text-[11px] bg-slate-50 focus:bg-white outline-none focus:border-blue-950">
      </div>
      <button type="button" id="snsClearTagFilterBtn" onclick="clearSnsTagFilter()" class="px-2 py-1 rounded-md bg-rose-900 text-white text-[9px] font-bold hidden shrink-0">
        解除
      </button>
    </div>

    <div id="snsFilterTagsBar" class="flex items-center gap-1 flex-wrap"></div>
  </div>

  <!-- 投稿ストリーム一覧 -->
  <div id="snsTimelineFeedList" class="space-y-1.5"></div>

</div>

<!-- 長文ノート作成・編集モーダル -->
<div id="noteEditorModal" class="fixed inset-0 z-50 bg-slate-950/50 backdrop-blur-xs flex items-end sm:items-center justify-center p-2.5 hidden">
  <div class="bg-white w-full max-w-md rounded-2xl border border-slate-200 shadow-2xl p-3.5 space-y-2">
    <div class="flex items-center justify-between border-b border-slate-100 pb-1.5">
      <h3 id="noteModalHeading" class="text-xs font-bold text-slate-900">長文ノート</h3>
      <button type="button" onclick="closeNoteEditorModal()" class="w-6 h-6 rounded-md bg-slate-100 text-slate-600 hover:text-slate-900 text-xs flex items-center justify-center">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>

    <input type="hidden" id="editNoteIdInput" value="">
    <div class="grid grid-cols-[1fr_118px] gap-1.5">
      <input type="text" id="editNoteTitleInput" placeholder="タイトル（任意）..." class="w-full px-2.5 py-1.5 border border-slate-200 rounded-lg text-xs font-bold outline-none focus:border-blue-950">
      <input type="date" id="editNoteDateInput" class="px-2 py-1.5 border border-slate-200 rounded-lg text-[10px] font-mono font-bold text-slate-700 bg-slate-50 outline-none">
    </div>

    <div class="relative space-y-1">
      <textarea id="editNoteContentInput" rows="5" oninput="handleHashtagTyping(this, 'noteModalSuggestBox'); renderQuickHashtagBar('noteModalTagBar', 'editNoteContentInput');" placeholder="本文を入力（#でタグ補完）..." class="w-full px-2.5 py-1.5 border border-slate-200 rounded-lg text-xs bg-slate-50/50 focus:bg-white outline-none focus:border-blue-950 leading-relaxed"></textarea>
      <div id="noteModalSuggestBox" class="hidden flex items-center gap-1 flex-wrap p-1 rounded-md bg-blue-950 text-white text-[10px] shadow-md"></div>
    </div>

    <div class="space-y-1">
      <div class="flex items-center justify-between">
        <span class="text-[9px] font-mono text-slate-400 font-semibold">HASHTAGS</span>
        <button type="button" onclick="promptAddCustomHashtag('editNoteContentInput', 'noteModalTagBar')" class="text-[9px] font-bold text-blue-950 hover:underline">+ 新規タグ</button>
      </div>
      <div id="noteModalTagBar" class="flex items-center gap-1 flex-wrap max-h-16 overflow-y-auto"></div>
    </div>

    <div id="noteModalMoodBar" class="flex items-center gap-1 flex-wrap pt-1 border-t border-slate-100"></div>

    <div class="flex items-center justify-end gap-1.5 pt-1 border-t border-slate-100">
      <button type="button" onclick="closeNoteEditorModal()" class="px-3 py-1 rounded-lg bg-slate-100 text-slate-700 text-xs font-bold">キャンセル</button>
      <button type="button" onclick="saveNoteFromModal()" class="px-4 py-1 rounded-lg bg-blue-950 hover:bg-blue-900 text-white text-xs font-bold">保存する</button>
    </div>
  </div>
</div>

<script>
  App.mount('#slot-timeline-main', 'timelineWorkspaceSection');

  var KEY_PINNED_HASHTAGS = 'worklife_os_pinned_hashtags_v1';
  var DEFAULT_PINNED_HASHTAGS = ['#思考整理', '#仕事メモ', '#学び', '#アイデア', '#読書', '#振り返り', '#開発', '#メモ'];
  var activeSnsTagFilter = '';
  var selectedQuickMood = '';
  var selectedModalMood = '';

  var SNS_MOOD_OPTIONS = [
    { label: '集中', activeCls: 'bg-blue-950 text-white border-blue-950', badgeCls: 'bg-blue-950 text-blue-50' },
    { label: '充実', activeCls: 'bg-emerald-900 text-white border-emerald-900', badgeCls: 'bg-emerald-900 text-emerald-50' },
    { label: '穏やか', activeCls: 'bg-teal-900 text-white border-teal-900', badgeCls: 'bg-teal-900 text-teal-50' },
    { label: '思考中', activeCls: 'bg-indigo-900 text-white border-indigo-900', badgeCls: 'bg-indigo-900 text-indigo-50' },
    { label: '停滞', activeCls: 'bg-rose-900 text-white border-rose-900', badgeCls: 'bg-rose-900 text-rose-50' }
  ];

  function getMoodBadgeClass(moodLabel) {
    var found = SNS_MOOD_OPTIONS.find(function(m) { return m.label === moodLabel; });
    return found ? found.badgeCls : 'bg-slate-800 text-white';
  }

  function toggleQuickMood(label) {
    selectedQuickMood = (selectedQuickMood === label) ? '' : label;
    renderSnsMoodSelector('snsQuickMoodBar', selectedQuickMood, 'toggleQuickMood');
  }

  function toggleModalMood(label) {
    selectedModalMood = (selectedModalMood === label) ? '' : label;
    renderSnsMoodSelector('noteModalMoodBar', selectedModalMood, 'toggleModalMood');
  }

  function renderSnsMoodSelector(barId, currentMood, fnName) {
    var bar = document.getElementById(barId);
    if (!bar) return;
    bar.innerHTML = '<span class="text-[9px] text-slate-400 mr-0.5">気分(任意):</span>' +
      SNS_MOOD_OPTIONS.map(function(m) {
        var isSel = (currentMood === m.label);
        return '<button type="button" data-m="' + escapeHtml(m.label) + '" onclick="' + fnName + '(this.getAttribute(\'data-m\'))" class="px-1.5 py-0.5 rounded text-[9px] font-bold border transition ' +
          (isSel ? m.activeCls : 'bg-white text-slate-500 border-slate-200 hover:border-slate-400') + '">' +
          escapeHtml(m.label) +
        '</button>';
      }).join('');
  }

  function getPinnedHashtags() {
    try {
      var raw = localStorage.getItem(KEY_PINNED_HASHTAGS);
      if (raw) {
        var arr = JSON.parse(raw);
        if (Array.isArray(arr) && arr.length > 0) return arr;
      }
    } catch (e) {}
    return DEFAULT_PINNED_HASHTAGS.slice();
  }

  function addPinnedHashtag(tag) {
    if (!tag) return;
    var norm = tag.charAt(0) === '#' ? tag : ('#' + tag);
    norm = norm.replace(/\s+/g, '');
    if (norm.length < 2) return;
    var list = getPinnedHashtags();
    if (list.indexOf(norm) === -1) {
      list.unshift(norm);
      try { localStorage.setItem(KEY_PINNED_HASHTAGS, JSON.stringify(list.slice(0, 30))); } catch (e) {}
      if (typeof pushCloudAppSetting === 'function') pushCloudAppSetting('pinnedHashtags', list.slice(0, 30));
    }
    return norm;
  }

  function getCombinedHashtagPool() {
    var pool = [];
    getPinnedHashtags().forEach(function(t) { if (pool.indexOf(t) === -1) pool.push(t); });
    getAllKnownHashtags().forEach(function(t) { if (pool.indexOf(t) === -1) pool.push(t); });
    return pool;
  }

  function computeTagFrequencyMap() {
    var counts = {};
    (db.notes || []).forEach(function(n) {
      var uniq = {};
      (n.tags || []).concat(extractHashtagsFromText((n.title || '') + ' ' + (n.content || ''))).forEach(function(t) {
        if (t) uniq[t] = true;
      });
      Object.keys(uniq).forEach(function(t) {
        counts[t] = (counts[t] || 0) + 1;
      });
    });
    return counts;
  }

  function toggleHashtagInTextarea(textareaId, barId, tag) {
    var ta = document.getElementById(textareaId);
    if (!ta) return;
    var cur = ta.value || '';
    var escaped = tag.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    var re = new RegExp('(^|\\s)' + escaped + '(?=\\s|$)', 'g');

    if (re.test(cur)) {
      ta.value = cur.replace(re, '$1').replace(/[ \t]+/g, ' ').trim();
    } else {
      var sep = (cur.length > 0 && !/\s$/.test(cur)) ? ' ' : '';
      ta.value = cur + sep + tag + ' ';
    }
    ta.focus();
    renderQuickHashtagBar(barId, textareaId);
  }

  function renderQuickHashtagBar(barId, textareaId) {
    var bar = document.getElementById(barId);
    var ta = document.getElementById(textareaId);
    if (!bar) return;
    var currentTags = ta ? extractHashtagsFromText(ta.value) : [];
    var pool = getCombinedHashtagPool().slice(0, 12);

    bar.innerHTML = pool.map(function(tag) {
      var isAttached = currentTags.indexOf(tag) !== -1;
      return '<button type="button" data-tag="' + escapeHtml(tag) + '" onclick="toggleHashtagInTextarea(\'' + textareaId + '\', \'' + barId + '\', this.getAttribute(\'data-tag\'))" class="px-1.5 py-0.5 rounded text-[9px] font-mono font-semibold border transition ' +
        (isAttached
          ? 'bg-indigo-950 text-white border-indigo-950'
          : 'bg-slate-50 text-slate-700 border-slate-200 hover:border-indigo-900') + '">' +
        escapeHtml(tag) +
      '</button>';
    }).join('');
  }

  function promptAddCustomHashtag(textareaId, barId) {
    var raw = window.prompt('追加するハッシュタグ名を入力してください（#は自動付与されます）:');
    if (!raw || !raw.trim()) return;
    var norm = addPinnedHashtag(raw.trim());
    if (norm) {
      toggleHashtagInTextarea(textareaId, barId, norm);
    }
  }

  function handleHashtagTyping(ta, suggestBoxId) {
    var box = document.getElementById(suggestBoxId);
    if (!box || !ta) return;
    var pos = ta.selectionStart || ta.value.length;
    var before = ta.value.slice(0, pos);
    var m = before.match(/(?:^|\s)(#[^\s#、。,.!?！？]*)$/);

    if (!m) {
      box.classList.add('hidden');
      return;
    }
    var query = m[1].toLowerCase();
    var pool = getCombinedHashtagPool();
    var matches = pool.filter(function(t) { return t.toLowerCase().indexOf(query) === 0; }).slice(0, 6);

    if (query.length > 1 && matches.indexOf(m[1]) === -1) {
      matches.push(m[1]);
    }
    if (matches.length === 0) {
      box.classList.add('hidden');
      return;
    }

    box.classList.remove('hidden');
    box.innerHTML = '<span class="text-[9px] font-mono text-sky-300 mr-1">候補:</span>' +
      matches.map(function(tg) {
        return '<button type="button" data-tg="' + escapeHtml(tg) + '" onclick="applySuggestedHashtag(\'' + ta.id + '\', \'' + suggestBoxId + '\', this.getAttribute(\'data-tg\'))" class="px-1.5 py-0.5 rounded bg-white/15 hover:bg-white/30 text-white font-mono font-bold">' +
          escapeHtml(tg) +
        '</button>';
      }).join('');
  }

  function applySuggestedHashtag(textareaId, suggestBoxId, tag) {
    var ta = document.getElementById(textareaId);
    var box = document.getElementById(suggestBoxId);
    if (!ta) return;
    var pos = ta.selectionStart || ta.value.length;
    var before = ta.value.slice(0, pos);
    var after = ta.value.slice(pos);
    var replacedBefore = before.replace(/(^|\s)#[^\s#、。,.!?！？]*$/, '$1' + tag + ' ');
    ta.value = replacedBefore + after;
    ta.focus();
    addPinnedHashtag(tag);
    if (box) box.classList.add('hidden');
    renderQuickHashtagBar(textareaId === 'snsQuickPostInput' ? 'snsQuickTagBar' : 'noteModalTagBar', textareaId);
  }

  function persistNoteToStateAndSync(noteObj) {
    if (!Array.isArray(db.notes)) db.notes = [];
    var idx = db.notes.findIndex(function(n) { return n.id === noteObj.id; });
    if (idx !== -1) {
      db.notes[idx] = noteObj;
    } else {
      db.notes.unshift(noteObj);
    }
    (noteObj.tags || []).forEach(function(t) { addPinnedHashtag(t); });

    if (typeof saveNotesImmediate === 'function') {
      saveNotesImmediate();
    } else {
      scheduleBgSync('saveNoteItem', 'note_' + noteObj.id, noteObj);
    }
  }

  function submitQuickSnsPost() {
    var ta = document.getElementById('snsQuickPostInput');
    if (!ta) return;
    var text = ta.value.trim();
    if (!text) return showToast('投稿内容を入力してください', true);

    var dateInp = document.getElementById('targetDate');
    var dateStr = (dateInp && dateInp.value) ? dateInp.value : formatDateLocal(new Date());
    var tags = extractHashtagsFromText(text);

    var noteObj = {
      id: 'note_' + Date.now(),
      title: '',
      content: text,
      tags: tags,
      mood: selectedQuickMood || '',
      createdAt: dateStr,
      time: getCurrentHHMM(),
      isLongNote: text.length >= 120
    };

    ta.value = '';
    selectedQuickMood = '';
    document.getElementById('snsQuickSuggestBox').classList.add('hidden');
    persistNoteToStateAndSync(noteObj);
    renderNotesWorkspace();
    showToast('投稿しました');
  }

  function pushAutoSnsEvent(type, text) {
    var dateStr = formatDateLocal(new Date());
    var tags = extractHashtagsFromText(text);
    if (tags.indexOf('#マイルストーン') === -1) tags.push('#マイルストーン');
    var noteObj = {
      id: 'note_' + Date.now(),
      title: '',
      content: text + ' #マイルストーン',
      tags: tags,
      mood: '',
      createdAt: dateStr,
      time: getCurrentHHMM(),
      isLongNote: false
    };
    persistNoteToStateAndSync(noteObj);
  }

  function sendSnsPostToJournal(noteId) {
    var n = (db.notes || []).find(function(x) { return x.id === noteId; });
    if (!n) return;
    var targetDs = n.createdAt || formatDateLocal(new Date());
    var wLog = ensureWorkLog(targetDs);
    var snippet = '・' + (n.title ? ('【' + n.title + '】') : '') + (n.content || '');
    wLog.memo = wLog.memo ? (wLog.memo + '\n' + snippet) : snippet;
    scheduleBgSync('syncWorkDailyLog', 'work_' + targetDs, wLog);
    showToast(targetDs.slice(5) + ' の自由日記へ転記しました');
  }

  function openNewNoteComposer() {
    var dateInp = document.getElementById('targetDate');
    var dateStr = (dateInp && dateInp.value) ? dateInp.value : formatDateLocal(new Date());
    document.getElementById('noteModalHeading').textContent = '新規長文ノート';
    document.getElementById('editNoteIdInput').value = '';
    document.getElementById('editNoteTitleInput').value = '';
    document.getElementById('editNoteDateInput').value = dateStr;
    document.getElementById('editNoteContentInput').value = '';
    selectedModalMood = '';
    document.getElementById('noteModalSuggestBox').classList.add('hidden');
    renderQuickHashtagBar('noteModalTagBar', 'editNoteContentInput');
    renderSnsMoodSelector('noteModalMoodBar', selectedModalMood, 'toggleModalMood');
    document.getElementById('noteEditorModal').classList.remove('hidden');
    setTimeout(function() { document.getElementById('editNoteTitleInput').focus(); }, 50);
  }

  function editNoteItem(id) {
    var n = (db.notes || []).find(function(x) { return x.id === id; });
    if (!n) return;
    document.getElementById('noteModalHeading').textContent = '投稿・ノートの編集';
    document.getElementById('editNoteIdInput').value = n.id;
    document.getElementById('editNoteTitleInput').value = n.title || '';
    document.getElementById('editNoteDateInput').value = n.createdAt || formatDateLocal(new Date());
    document.getElementById('editNoteContentInput').value = n.content || '';
    selectedModalMood = n.mood || '';
    document.getElementById('noteModalSuggestBox').classList.add('hidden');
    renderQuickHashtagBar('noteModalTagBar', 'editNoteContentInput');
    renderSnsMoodSelector('noteModalMoodBar', selectedModalMood, 'toggleModalMood');
    document.getElementById('noteEditorModal').classList.remove('hidden');
  }

  function closeNoteEditorModal() {
    document.getElementById('noteEditorModal').classList.add('hidden');
  }

  function saveNoteFromModal() {
    var id = document.getElementById('editNoteIdInput').value;
    var title = document.getElementById('editNoteTitleInput').value.trim();
    var content = document.getElementById('editNoteContentInput').value.trim();
    var chosenDate = document.getElementById('editNoteDateInput').value;
    if (!title && !content) return showToast('タイトルまたは本文を入力してください', true);

    var dateInp = document.getElementById('targetDate');
    var fallbackDate = (dateInp && dateInp.value) ? dateInp.value : formatDateLocal(new Date());
    var dateStr = chosenDate || fallbackDate;
    var existing = id ? (db.notes || []).find(function(x) { return x.id === id; }) : null;
    var tags = extractHashtagsFromText(title + ' ' + content);

    var noteObj = {
      id: existing ? existing.id : ('note_' + Date.now()),
      title: title,
      content: content,
      tags: tags,
      mood: selectedModalMood || '',
      createdAt: dateStr,
      time: existing ? (existing.time || getCurrentHHMM()) : getCurrentHHMM(),
      isLongNote: !!(title || content.length >= 120),
      pinned: existing ? !!existing.pinned : false,
      replies: existing ? (existing.replies || []) : []
    };

    closeNoteEditorModal();
    persistNoteToStateAndSync(noteObj);
    renderNotesWorkspace();
    showToast('ノートを保存しました');
  }

  function togglePinSnsNote(id) {
    var n = (db.notes || []).find(function(x) { return x.id === id; });
    if (!n) return;
    n.pinned = !n.pinned;
    persistNoteToStateAndSync(n);
    renderNotesWorkspace();
    showToast(n.pinned ? '投稿を最上部にピン留めしました' : 'ピン留めを解除しました');
  }

  function appendSnsThreadReply(id) {
    var n = (db.notes || []).find(function(x) { return x.id === id; });
    if (!n) return;
    var replyText = window.prompt('この投稿への追記・スレッドメモ:');
    if (!replyText || !replyText.trim()) return;
    if (!Array.isArray(n.replies)) n.replies = [];
    n.replies.push({
      date: formatDateLocal(new Date()),
      time: getCurrentHHMM(),
      text: replyText.trim()
    });
    persistNoteToStateAndSync(n);
    renderNotesWorkspace();
    showToast('スレッドに追記しました');
  }

  function deleteSnsNote(id) {
    if (!Array.isArray(db.notes)) return;
    db.notes = db.notes.filter(function(n) { return n.id !== id; });
    if (typeof saveNotesImmediate === 'function') {
      saveNotesImmediate();
    } else {
      scheduleBgSync('deleteNoteItem', 'del_note_' + id, { id: id });
    }
    renderNotesWorkspace();
    showToast('投稿を削除しました');
  }

  function toggleSnsTagFilter(tag) {
    activeSnsTagFilter = (activeSnsTagFilter === tag) ? '' : tag;
    renderNotesWorkspace();
  }

  function clearSnsTagFilter() {
    activeSnsTagFilter = '';
    var sInp = document.getElementById('snsSearchInput');
    if (sInp) sInp.value = '';
    renderNotesWorkspace();
  }

  function formatContentWithClickableTags(rawText) {
    var escaped = escapeHtml(rawText || '');
    return escaped.replace(/(#[^\s#、。,.!?！？&]+)/g, function(match) {
      return '<button type="button" data-tag="' + match + '" onclick="event.stopPropagation(); toggleSnsTagFilter(this.getAttribute(\'data-tag\'))" class="font-mono font-bold text-indigo-900 underline decoration-indigo-300 hover:decoration-indigo-900">' + match + '</button>';
    });
  }

  function renderNotesWorkspace() {
    var dateInp = document.getElementById('targetDate');
    var dateLbl = document.getElementById('snsSelectedDateLabel');
    if (dateLbl && dateInp) dateLbl.textContent = dateInp.value.replace(/-/g, '.');

    renderQuickHashtagBar('snsQuickTagBar', 'snsQuickPostInput');
    renderSnsMoodSelector('snsQuickMoodBar', selectedQuickMood, 'toggleQuickMood');

    var clearBtn = document.getElementById('snsClearTagFilterBtn');
    if (clearBtn) clearBtn.classList.toggle('hidden', !activeSnsTagFilter);

    var filterBar = document.getElementById('snsFilterTagsBar');
    if (filterBar) {
      var allTags = getCombinedHashtagPool();
      var freqMap = computeTagFrequencyMap();
      filterBar.innerHTML = allTags.map(function(tg) {
        var active = (activeSnsTagFilter === tg);
        var cnt = freqMap[tg] || 0;
        return '<button type="button" data-tag="' + escapeHtml(tg) + '" onclick="toggleSnsTagFilter(this.getAttribute(\'data-tag\'))" class="px-1.5 py-0.5 rounded text-[9px] font-mono font-semibold transition ' +
          (active ? 'bg-blue-950 text-white' : 'bg-slate-100 text-slate-700 hover:bg-slate-200') + '">' +
          escapeHtml(tg) + (cnt > 0 ? ' <span class="opacity-65">(' + cnt + ')</span>' : '') +
        '</button>';
      }).join('');
    }

    var feed = document.getElementById('snsTimelineFeedList');
    if (!feed) return;

    var q = ((document.getElementById('snsSearchInput') || {}).value || '').trim().toLowerCase();
    var notes = (db.notes || []).slice().sort(function(a, b) {
      if (!!a.pinned !== !!b.pinned) return a.pinned ? -1 : 1;
      var cmpDate = String(b.createdAt || '').localeCompare(String(a.createdAt || ''));
      if (cmpDate !== 0) return cmpDate;
      return String(b.time || '').localeCompare(String(a.time || ''));
    });

    var filtered = notes.filter(function(n) {
      var nTags = (n.tags || []).concat(extractHashtagsFromText((n.title || '') + ' ' + (n.content || '')));
      if (activeSnsTagFilter && nTags.indexOf(activeSnsTagFilter) === -1) return false;
      if (q) {
        var hay = ((n.title || '') + ' ' + (n.content || '') + ' ' + (n.mood || '') + ' ' + nTags.join(' ')).toLowerCase();
        if (hay.indexOf(q) === -1) return false;
      }
      return true;
    });

    if (filtered.length === 0) {
      feed.innerHTML = '<div class="text-xs text-slate-400 text-center py-6">表示する投稿がありません</div>';
      return;
    }

    feed.innerHTML = filtered.map(function(n) {
      var isLong = !!(n.isLongNote || n.title || (n.content && n.content.length >= 120));
      var dotDate = String(n.createdAt || '').replace(/-/g, '.');
      var moodBadge = n.mood
        ? '<span class="px-1.5 py-0.2 rounded text-[8px] font-bold ' + getMoodBadgeClass(n.mood) + '">' + escapeHtml(n.mood) + '</span>'
        : '';

      var repliesHtml = (Array.isArray(n.replies) && n.replies.length > 0)
        ? '<div class="mt-1.5 pt-1 border-t border-slate-100 space-y-1">' +
            n.replies.map(function(rep) {
              return '<div class="pl-2 border-l-2 border-sky-700 text-[11px] text-slate-700">' +
                '<span class="text-[8px] font-mono text-slate-400 mr-1.5">' + escapeHtml((rep.date || '').slice(5)) + ' ' + escapeHtml(rep.time || '') + '</span>' +
                formatContentWithClickableTags(rep.text || '') +
              '</div>';
            }).join('') +
          '</div>'
        : '';

      return '<article onclick="editNoteItem(\'' + n.id + '\')" class="card-surface px-2.5 py-2 space-y-1 cursor-pointer hover:border-blue-900 transition border-l-3 ' + (n.pinned ? 'border-l-amber-600 bg-amber-50/20' : (isLong ? 'border-l-indigo-900' : 'border-l-blue-950')) + '">' +
        '<div class="flex items-center justify-between text-[9px] font-mono text-slate-400">' +
          '<div class="flex items-center gap-1.5">' +
            (n.pinned ? '<span class="px-1 py-0.2 rounded bg-amber-800 text-amber-50 font-bold text-[8px]">PIN</span>' : '') +
            '<span class="font-bold text-slate-700">' + escapeHtml(dotDate) + '</span>' +
            '<span>' + escapeHtml(n.time || '') + '</span>' +
            moodBadge +
            (isLong ? '<span class="px-1 py-0.2 rounded bg-indigo-950 text-indigo-50 font-bold text-[8px]">NOTE</span>' : '') +
          '</div>' +
          '<div class="flex items-center gap-1">' +
            '<button type="button" onclick="event.stopPropagation(); sendSnsPostToJournal(\'' + n.id + '\')" class="text-slate-400 hover:text-emerald-800 px-1" title="自由日記へ転記"><i class="fa-solid fa-book-medical"></i></button>' +
            '<button type="button" onclick="event.stopPropagation(); appendSnsThreadReply(\'' + n.id + '\')" class="text-slate-400 hover:text-blue-950 px-1" title="スレッド追記"><i class="fa-solid fa-reply"></i></button>' +
            '<button type="button" onclick="event.stopPropagation(); togglePinSnsNote(\'' + n.id + '\')" class="' + (n.pinned ? 'text-amber-700' : 'text-slate-300 hover:text-amber-700') + ' px-1" title="ピン留め"><i class="fa-solid fa-thumbtack"></i></button>' +
            '<button type="button" onclick="event.stopPropagation(); deleteSnsNote(\'' + n.id + '\')" class="text-slate-300 hover:text-rose-800 px-1" title="削除"><i class="fa-solid fa-xmark"></i></button>' +
          '</div>' +
        '</div>' +
        (n.title ? '<h3 class="text-xs font-bold text-slate-900 leading-tight">' + escapeHtml(n.title) + '</h3>' : '') +
        '<div class="text-xs text-slate-800 whitespace-pre-wrap leading-snug break-words">' +
          formatContentWithClickableTags(n.content || '') +
        '</div>' +
        repliesHtml +
      '</article>';
    }).join('');
  }

  App.on('data:loaded', function() {
    if (currentView === 'timeline') renderNotesWorkspace();
  });
</script>
