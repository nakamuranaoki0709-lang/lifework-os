<!-- 成長インサイト＆今日の行動フォーカスカード -->
<div id="growthInsightCard" class="card-surface p-3 space-y-2 border-l-2 border-l-emerald-600 bg-gradient-to-r from-emerald-50/40 to-white">
  <div class="flex items-center justify-between">
    <span class="text-[10px] font-bold text-emerald-900 flex items-center gap-1.5 uppercase tracking-wider">
      <i class="fa-solid fa-seedling text-emerald-600"></i> Growth Insight（記録からの発見）
    </span>
    <div class="flex items-center gap-2">
      <button type="button" onclick="switchView('timeline')" class="text-[9px] font-semibold text-indigo-800 hover:underline">メモ検索</button>
      <button type="button" onclick="switchView('analytics')" class="text-[9px] font-semibold text-emerald-800 hover:underline">相関分析 →</button>
    </div>
  </div>
  <div id="growthInsightMessage" class="text-[11px] font-medium text-slate-800 leading-relaxed">
    記録が蓄積されると、あなたのパフォーマンスが高まる条件を自動分析して表示します。
  </div>
</div>

<script>
  App.mount('#slot-home-growth', 'growthInsightCard');
  App.on('data:loaded', renderDailyGrowthInsight);

  function computeGrowthCorrelations() {
    var insights = [];
    var allHabits = (db.workHabits || []).concat(db.privateHabits || []);
    var totalHab = allHabits.length || 1;

    var highSleepHab = [], lowSleepHab = [];
    var highStepsScore = [], lowStepsScore = [];
    var highHabScore = [], lowHabScore = [];
    var overWorkNextCond = [], normalWorkNextCond = [];

    (db.workLogs || []).forEach(function(w) {
      var p = (db.privateLogs || []).find(function(pl) { return pl.date === w.date; });
      var sleep = (p && p.sleepHours) ? Number(p.sleepHours) : (w.sleepHours ? Number(w.sleepHours) : null);
      var steps = (typeof getPrivateSteps === 'function')
        ? getPrivateSteps(p)
        : ((p && p.steps !== undefined && p.steps !== null && p.steps !== '') ? Number(p.steps) : '');
      var score = w.growthScore ? Number(w.growthScore) : null;

      var done = 0;
      (db.workHabits || []).forEach(function(h) { if (w.habitMap && w.habitMap[h.id]) done++; });
      (db.privateHabits || []).forEach(function(h) { if (p && p.habitMap && p.habitMap[h.id]) done++; });
      var habRate = Math.round((done / totalHab) * 100);

      if (sleep !== null && sleep > 0) {
        if (sleep >= 7.0) highSleepHab.push(habRate);
        else lowSleepHab.push(habRate);
      }
      if (steps !== '' && !isNaN(Number(steps)) && score !== null) {
        if (Number(steps) >= 7000) highStepsScore.push(score);
        else lowStepsScore.push(score);
      }
      if (score !== null && allHabits.length > 0) {
        if (habRate >= 75) highHabScore.push(score);
        else lowHabScore.push(score);
      }
      if (w.overtimeHours !== undefined) {
        var nextDate = getShiftDateStr(w.date, 1);
        var nextW = (db.workLogs || []).find(function(nl) { return nl.date === nextDate; });
        if (nextW && nextW.condition) {
          if (Number(w.overtimeHours) >= 2.0) overWorkNextCond.push(Number(nextW.condition));
          else normalWorkNextCond.push(Number(nextW.condition));
        }
      }
    });

    function avg(arr) {
      if (!arr || arr.length === 0) return null;
      return arr.reduce(function(a, b) { return a + b; }, 0) / arr.length;
    }

    if (highSleepHab.length >= 2 && lowSleepHab.length >= 2) {
      var diffSleep = Math.round(avg(highSleepHab) - avg(lowSleepHab));
      if (diffSleep > 0) {
        insights.push({
          title: '睡眠時間と習慣達成率の相関',
          text: '睡眠 7.0時間以上 の日は、7時間未満の日に比べて習慣達成率が平均 +' + diffSleep + '% 向上しています。',
          metric: '+' + diffSleep + '%'
        });
      }
    }
    if (highStepsScore.length >= 2 && lowStepsScore.length >= 2) {
      var diffSteps = (avg(highStepsScore) - avg(lowStepsScore)).toFixed(1);
      if (Number(diffSteps) > 0) {
        insights.push({
          title: '歩数（7,000歩以上）と自己評価',
          text: '1日 7,000歩以上 歩いた日は、自己評価★が平均 +' + diffSteps + 'pt 高くなる傾向があります。',
          metric: '+' + diffSteps + 'pt'
        });
      }
    }
    if (highHabScore.length >= 2 && lowHabScore.length >= 2) {
      var diffHab = (avg(highHabScore) - avg(lowHabScore)).toFixed(1);
      if (Number(diffHab) > 0) {
        insights.push({
          title: '習慣達成（75%以上）と充実度',
          text: '習慣を75%以上クリアした日は、1日の満足度・成長評価が平均 +' + diffHab + 'pt 高い結果が出ています。',
          metric: '+' + diffHab + 'pt'
        });
      }
    }
    if (overWorkNextCond.length >= 2 && normalWorkNextCond.length >= 2) {
      var diffOver = (avg(normalWorkNextCond) - avg(overWorkNextCond)).toFixed(1);
      if (Number(diffOver) > 0) {
        insights.push({
          title: '残業時間と翌日の体調',
          text: '残業 2時間以上 の翌日は、通常退勤の翌日に比べて体調スコアが平均 ' + diffOver + 'pt 低下する傾向があります。',
          metric: '-' + diffOver + 'pt'
        });
      }
    }

    return insights;
  }

  function renderDailyGrowthInsight() {
    var msgEl = document.getElementById('growthInsightMessage');
    if (!msgEl) return;
    var insights = computeGrowthCorrelations();
    if (insights.length > 0) {
      var dayIdx = new Date().getDate() % insights.length;
      msgEl.innerHTML = '<span class="font-bold text-emerald-900">[' + escapeHtml(insights[dayIdx].title) + ']</span> ' + escapeHtml(insights[dayIdx].text);
    } else {
      var totalLogs = (db.workLogs || []).length + (db.privateLogs || []).length;
      msgEl.textContent = '現在 ' + totalLogs + ' 件のログを記録中。睡眠・歩数・習慣・評価のデータが揃うと、あなたの「勝ちパターン」を自動分析して表示します。';
    }
  }
</script>
