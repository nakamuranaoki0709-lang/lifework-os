<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Life & Work OS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" media="print" onload="this.media='all'">
  <?!= include('Styles'); ?>
</head>
<body class="selection:bg-blue-950 selection:text-white">

  <div id="loading" class="hidden"></div>

  <div id="toast" class="fixed top-11 left-16 z-50 bg-slate-950/95 text-white px-3.5 py-1.5 rounded-full shadow-lg flex items-center gap-2 text-xs font-medium opacity-0 pointer-events-none transition-all duration-150 border border-sky-400/25">
    <i id="toastIcon" class="fa-solid fa-check text-emerald-400"></i>
    <span id="toastMsg">保存しました</span>
  </div>

  <!-- 左サイドレール -->
  <aside id="leftSideRail" class="flex flex-col items-center pt-1.5 pb-2 px-1 gap-1 select-none">

    <nav class="w-full space-y-0.5">
      <button id="btnViewHome" onclick="switchView('home')" class="w-full py-1.5 rounded-xl flex flex-col items-center justify-center gap-0.5 transition text-[9px] rail-tab-active">
        <i class="fa-solid fa-compass text-xs"></i>
        <span>Today</span>
      </button>
      <button id="btnViewForm" onclick="switchView('form')" class="w-full py-1.5 rounded-xl flex flex-col items-center justify-center gap-0.5 transition text-[9px] rail-tab-inactive">
        <i class="fa-solid fa-book-open text-xs"></i>
        <span>記録</span>
      </button>
      <button id="btnViewTimeline" onclick="switchView('timeline')" class="w-full py-1.5 rounded-xl flex flex-col items-center justify-center gap-0.5 transition text-[9px] rail-tab-inactive">
        <i class="fa-solid fa-hashtag text-xs"></i>
        <span>1人SNS</span>
      </button>
      <button id="btnViewFuture" onclick="switchView('future')" class="w-full py-1.5 rounded-xl flex flex-col items-center justify-center gap-0.5 transition text-[9px] rail-tab-inactive">
        <i class="fa-solid fa-flag text-xs"></i>
        <span>将来</span>
      </button>
      <button id="btnViewTodo" onclick="switchView('todo')" class="w-full py-1.5 rounded-xl flex flex-col items-center justify-center gap-0.5 transition text-[9px] rail-tab-inactive">
        <i class="fa-solid fa-list-check text-xs"></i>
        <span>タスク</span>
      </button>
      <button id="btnViewAnalytics" onclick="switchView('analytics')" class="w-full py-1.5 rounded-xl flex flex-col items-center justify-center gap-0.5 transition text-[9px] rail-tab-inactive">
        <i class="fa-solid fa-chart-simple text-xs"></i>
        <span>集計</span>
      </button>
    </nav>

    <div class="flex-1"></div>

    <!-- 打刻ボタン4種 -->
    <div class="flex flex-col items-center gap-1 pt-1.5 border-t border-white/10">
      <button id="hdrBtnWake" type="button" onclick="stampSleep('wake')" class="stamp-circle-btn" title="起床打刻">
        <i class="fa-regular fa-sun text-[10px]"></i>
        <span id="railSubWake" class="text-[8px] font-mono font-bold leading-none">起床</span>
      </button>
      <button id="hdrBtnStart" type="button" onclick="stampAttendance('start')" class="stamp-circle-btn" title="出勤打刻">
        <i class="fa-solid fa-arrow-right-to-bracket text-[10px]"></i>
        <span id="railSubStart" class="text-[8px] font-mono font-bold leading-none">出勤</span>
      </button>
      <button id="hdrBtnEnd" type="button" onclick="stampAttendance('end')" class="stamp-circle-btn" title="退勤打刻">
        <i class="fa-solid fa-arrow-right-from-bracket text-[10px]"></i>
        <span id="railSubEnd" class="text-[8px] font-mono font-bold leading-none">退勤</span>
      </button>
      <button id="hdrBtnBed" type="button" onclick="stampSleep('bed')" class="stamp-circle-btn" title="就寝打刻">
        <i class="fa-regular fa-moon text-[10px]"></i>
        <span id="railSubBed" class="text-[8px] font-mono font-bold leading-none">就寝</span>
      </button>
    </div>

    <!-- 記録＋ ＆ タブ切替 -->
    <div class="w-full space-y-1 pt-1.5 border-t border-white/10">
      <button id="leftHandFabBtn" type="button" onclick="toggleQuickAddFabMenu()" title="クイック記録・投稿" class="w-full py-1.5 rounded-xl bg-white/10 hover:bg-white/20 text-white border border-white/15 flex flex-col items-center justify-center gap-0.5 active:scale-95 transition">
        <i class="fa-solid fa-plus text-xs"></i>
        <span class="text-[8px] font-bold">記録＋</span>
      </button>

      <button id="leftBottomCycleTabBtn" type="button" onclick="cycleNextView()" title="次のタブへ順番に切替" class="w-full py-2 rounded-xl bg-blue-900 hover:bg-blue-800 text-white border border-sky-400/30 font-extrabold shadow-md flex flex-col items-center justify-center gap-0.5 active:scale-95 transition">
        <i class="fa-solid fa-angles-down text-[11px]"></i>
        <span class="text-[9px] leading-tight">タブ切替</span>
      </button>
    </div>

  </aside>

  <!-- 左下クイック記録（＋）メニュー -->
  <div id="leftHandFabBackdrop" onclick="toggleQuickAddFabMenu(false)" class="fixed inset-0 z-40 bg-slate-950/25 backdrop-blur-[1px] hidden"></div>
  <div id="leftHandFabMenu" class="fixed left-[64px] bottom-14 z-50 flex flex-col items-start gap-1.5 hidden select-none">
    <button type="button" onclick="triggerQuickFabAction('tweet')" class="flex items-center gap-2.5 px-3.5 py-2 rounded-full bg-white text-slate-900 border border-slate-200 shadow-lg hover:bg-slate-50 active:scale-95 text-xs font-bold transition">
      <span class="w-5 h-5 rounded-full bg-blue-950 text-white flex items-center justify-center text-[10px]"><i class="fa-solid fa-hashtag"></i></span>
      <span>つぶやく（1人SNS）</span>
    </button>
    <button type="button" onclick="triggerQuickFabAction('note')" class="flex items-center gap-2.5 px-3.5 py-2 rounded-full bg-white text-slate-900 border border-slate-200 shadow-lg hover:bg-slate-50 active:scale-95 text-xs font-bold transition">
      <span class="w-5 h-5 rounded-full bg-indigo-900 text-white flex items-center justify-center text-[10px]"><i class="fa-solid fa-pen-nib"></i></span>
      <span>長文メモを書く</span>
    </button>
    <button type="button" onclick="triggerQuickFabAction('activity')" class="flex items-center gap-2.5 px-3.5 py-2 rounded-full bg-white text-slate-900 border border-slate-200 shadow-lg hover:bg-slate-50 active:scale-95 text-xs font-bold transition">
      <span class="w-5 h-5 rounded-full bg-teal-900 text-white flex items-center justify-center text-[10px]"><i class="fa-regular fa-clock"></i></span>
      <span>活動ログ（1日記録）</span>
    </button>
    <button type="button" onclick="triggerQuickFabAction('todo')" class="flex items-center gap-2.5 px-3.5 py-2 rounded-full bg-white text-slate-900 border border-slate-200 shadow-lg hover:bg-slate-50 active:scale-95 text-xs font-bold transition">
      <span class="w-5 h-5 rounded-full bg-emerald-900 text-white flex items-center justify-center text-[10px]"><i class="fa-solid fa-check"></i></span>
      <span>タスク追加</span>
    </button>
    <button type="button" onclick="triggerQuickFabAction('capsule')" class="flex items-center gap-2.5 px-3.5 py-2 rounded-full bg-white text-slate-900 border border-slate-200 shadow-lg hover:bg-slate-50 active:scale-95 text-xs font-bold transition">
      <span class="w-5 h-5 rounded-full bg-amber-900 text-white flex items-center justify-center text-[10px]"><i class="fa-regular fa-envelope"></i></span>
      <span>未来の自分へ手紙</span>
    </button>
  </div>

  <!-- メイン領域 -->
  <div id="mainShellWrap" class="flex flex-col">

    <!-- スリム統合ヘッダー -->
    <header class="sticky top-0 z-30 bg-slate-950/95 backdrop-blur-md text-white border-b border-white/10">
      <div class="max-w-lg mx-auto px-2.5 sm:px-4 h-9 flex items-center justify-between gap-1.5">
        <div class="flex items-center bg-white/10 rounded-md px-0.5 shrink-0">
          <button type="button" onclick="shiftTargetDate(-1)" class="w-5 h-5 flex items-center justify-center text-slate-300 hover:text-white text-[9px] transition" title="前日">
            <i class="fa-solid fa-chevron-left"></i>
          </button>
          <input type="date" id="targetDate" onchange="onTargetDateChanged()" class="bg-transparent text-[10px] font-mono tabular-nums font-semibold text-white outline-none w-[86px] text-center">
          <button type="button" onclick="shiftTargetDate(1)" class="w-5 h-5 flex items-center justify-center text-slate-300 hover:text-white text-[9px] transition" title="翌日">
            <i class="fa-solid fa-chevron-right"></i>
          </button>
        </div>

        <div class="flex items-center gap-2 min-w-0">
          <span id="headerXpBadge" class="text-[9px] font-mono tabular-nums truncate"></span>
          <span id="headerQuickStats" class="hidden"></span>
          <button id="syncStatusBadge" onclick="manualSyncNow()" title="タップで手動同期" class="px-1.5 h-5 rounded-md text-[8px] font-semibold flex items-center gap-1 bg-white/10 text-slate-200 border border-white/10 transition active:scale-95 shrink-0">
            <span id="syncDot" class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span><span id="syncStatusText">SYNCED</span>
            <i id="refreshIcon" class="fa-solid fa-rotate text-[8px]"></i>
          </button>
        </div>
      </div>
    </header>

    <main class="max-w-lg w-full mx-auto px-2.5 sm:px-4 pt-2.5 space-y-2.5">
      <!-- 1. Today -->
      <div id="homeView" class="space-y-2.5">
        <!-- マイクレド -->
        <div onclick="switchView('future')" class="px-3 py-2 rounded-xl bg-gradient-to-r from-slate-950 via-blue-950 to-indigo-950 text-white flex items-center justify-between gap-2 text-[10px] cursor-pointer active:scale-[0.99] transition border border-indigo-800/40">
          <div class="min-w-0 flex-1">
            <span class="text-[8px] font-mono uppercase tracking-widest text-amber-300 font-bold mr-2">CREDO</span>
            <span id="homeCredoText" class="font-medium text-slate-100">小さな一歩の積み重ねが、1年後の自分を創る。</span>
          </div>
          <i class="fa-solid fa-chevron-right text-[9px] text-slate-400 shrink-0"></i>
        </div>

        <div class="flex items-center justify-between px-0.5">
          <button type="button" onclick="toggleTodayCustomizerPanel()" class="text-[10px] font-semibold px-2 py-0.5 rounded-md bg-white border border-slate-200 hover:bg-slate-100 text-slate-700 transition">
            <i class="fa-solid fa-sliders text-[9px] mr-1 text-blue-950"></i>表示・並び替え
          </button>
          <span class="text-[10px] font-mono font-bold text-blue-950/60 uppercase tracking-widest">TODAY</span>
        </div>

        <div id="todayCustomizerPanel" class="card-surface p-2.5 space-y-1.5 hidden">
          <div class="text-[9px] text-slate-500 font-semibold">Todayに表示する項目と順番をカスタマイズできます</div>
          <div id="todayCustomizerList" class="space-y-1"></div>
        </div>

        <div id="todaySectionsContainer" class="space-y-2.5">
          <div id="slot-home-goals" data-today-key="goals" data-today-title="現在の目標（Objectives）"></div>
          <div id="slot-home-calendar" data-today-key="calendar" data-today-title="本日の予定（Googleカレンダー）"></div>
          <div id="slot-home-todo" data-today-key="todo" data-today-title="本日のタスク（ToDo）"></div>
          <div id="slot-home-prevtry" data-today-key="prevtry" data-today-title="前回のTry"></div>
          <div id="slot-home-growth" data-today-key="growth" data-today-title="Growth Insight"></div>
          <div id="slot-home-habits" data-today-key="habits" data-today-title="今日の習慣"></div>
        </div>
      </div>

      <!-- 2. 記録 -->
      <div id="formView" class="space-y-2.5 hidden">
        <div id="slot-journal-main"></div>
      </div>

      <!-- 3. 1人SNS -->
      <div id="timelineView" class="space-y-2.5 hidden">
        <div id="slot-timeline-main"></div>
      </div>

      <!-- 4. 将来 -->
      <div id="futureView" class="space-y-2.5 hidden">
        <div id="slot-future-main"></div>
      </div>

      <!-- 5. タスク -->
      <div id="todoView" class="space-y-2.5 hidden">
        <div id="slot-todo-main"></div>
      </div>

      <!-- 6. 集計 -->
      <div id="analyticsView" class="space-y-2.5 hidden">
        <div id="slot-weekly-coach"></div>
        <div id="slot-views"></div>
      </div>
    </main>
  </div>

  <!-- 項目カスタマイズモーダル -->
  <div id="masterOptionModal" class="fixed inset-0 z-50 bg-slate-950/50 backdrop-blur-xs flex items-end sm:items-center justify-center p-3 hidden">
    <div class="bg-white w-full max-w-md rounded-2xl border border-slate-200 shadow-2xl p-4 space-y-3">
      <div class="flex items-center justify-between border-b border-slate-100 pb-2">
        <h3 class="text-xs font-bold text-slate-900">カテゴリ・領域の設定</h3>
        <button type="button" onclick="closeMasterOptionManager()" class="w-6 h-6 rounded-md bg-slate-100 text-slate-600 hover:text-slate-900 text-xs flex items-center justify-center">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <div class="grid grid-cols-2 gap-1 bg-slate-100 p-1 rounded-lg text-[10px]">
        <button type="button" id="mOptTabActivity" onclick="switchMasterOptionTab('activityCats')" class="py-1.5 rounded-md bg-blue-950 text-white font-bold">活動ログカテゴリ</button>
        <button type="button" id="mOptTabTodo" onclick="switchMasterOptionTab('todoProjects')" class="py-1.5 rounded-md text-slate-500 font-semibold">タスク領域</button>
      </div>

      <form onsubmit="addMasterOptionItem(event)" class="flex items-center gap-1.5">
        <button type="submit" class="px-3 py-1.5 bg-blue-950 hover:bg-blue-900 text-white rounded-lg text-xs font-bold shrink-0">+ 追加</button>
        <input type="text" id="masterOptionNewInput" placeholder="新しい項目名を入力..." class="flex-1 px-2.5 py-1.5 border border-slate-200 rounded-lg text-xs outline-none focus:border-blue-950">
      </form>

      <div id="masterOptionListArea" class="max-h-56 overflow-y-auto space-y-1.5 pr-0.5"></div>
    </div>
  </div>

  <div id="slot-modals"></div>

  <!-- コア基盤 -->
  <?!= include('Core_State'); ?>
  <?!= include('Core_App'); ?>

  <!-- 機能モジュール -->
  <?!= include('Mod_Journal'); ?>
  <?!= include('Mod_Timeline'); ?>
  <?!= include('Mod_Future'); ?>
  <?!= include('Mod_Growth'); ?>
  <?!= include('Mod_Habits'); ?>
  <?!= include('Mod_Todo'); ?>
  <?!= include('Mod_Analytics'); ?>

  <script>
    if (typeof bootAppFast === 'function') bootAppFast();
  </script>
</body>
</html>
