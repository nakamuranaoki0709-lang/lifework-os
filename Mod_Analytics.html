<!-- 集計・アナリティクスビュー -->
<div id="analyticsSection" class="space-y-3 hidden">
  <!-- 集計タブ：表示項目選択・並び替えカスタマイザー -->
<div id="analyticsCustomizerBox" class="card-surface p-2.5 space-y-2 border-l-2 border-l-slate-700">
  <div class="flex items-center justify-between">
    <span class="text-[10px] font-bold text-slate-700 flex items-center gap-1.5">
      <i class="fa-solid fa-sliders text-slate-900"></i> 集計ダッシュボード表示設定
    </span>
    <button type="button" onclick="toggleAnalyticsCustomizerPanel()" class="text-[10px] font-semibold px-2 py-0.5 rounded bg-slate-100 hover:bg-slate-200 text-slate-800 transition">
      項目選択・並び替え
    </button>
  </div>
  <div id="analyticsCustomizerPanel" class="hidden pt-2 border-t border-slate-100 space-y-1.5">
    <div class="text-[9px] text-slate-400">チェックで表示/非表示を切替、↑↓で表示順を並び替えます</div>
    <div id="analyticsCustomizerList" class="space-y-1"></div>
  </div>
</div>
  <!-- 勝ちパターン相関分析 -->
  <div id="secAnalyticsGrowth" class="card-surface p-3.5 space-y-2.5 border-l-2 border-l-emerald-600">
    <div class="flex items-center justify-between border-b border-slate-100 pb-2">
      <h2 class="font-semibold text-[11px] text-emerald-900 uppercase tracking-wider">
        <i class="fa-solid fa-seedling text-emerald-600 mr-1.5"></i>Growth Correlation（勝ちパターン分析）
      </h2>
    </div>
    <div id="analyticsGrowthInsightsArea" class="space-y-2"></div>
  </div>

  <div class="card-surface p-3.5 space-y-2">
    <div class="flex items-center justify-between border-b border-slate-100 pb-2">
      <h2 class="font-semibold text-[11px] text-slate-600 uppercase tracking-wider">
        <i class="fa-solid fa-wave-square text-slate-900 mr-1.5"></i>Condition & Habit Matrix
      </h2>
      <select id="analyticsRange" onchange="renderAnalytics()" class="px-2 py-1 border border-slate-200 rounded-md text-[11px] font-semibold text-slate-800 bg-slate-50 outline-none">
        <option value="month">当月</option>
        <option value="week">今週</option>
        <option value="all">全期間</option>
      </select>
    </div>
    <div><canvas id="conditionTrendChart" class="w-full h-44"></canvas></div>
  </div>

  <div class="card-surface p-3.5 space-y-2">
    <div class="flex items-center justify-between border-b border-slate-100 pb-2">
      <h2 class="font-semibold text-[11px] text-slate-600 uppercase tracking-wider">
        <i class="fa-solid fa-heart-pulse text-slate-900 mr-1.5"></i>Weight, BP & Steps
      </h2>
      <span id="vitalsSummaryBadge" class="text-[9px] font-mono tabular-nums font-semibold text-slate-700 bg-slate-100 border border-slate-200/70 px-2 py-0.5 rounded-md">
        記録なし
      </span>
    </div>
    <div><canvas id="vitalsTrendChart" class="w-full h-44"></canvas></div>
  </div>

  <div id="secAnalyticsCondition" class="card-surface p-3.5 space-y-2.5">
    <div class="flex items-center justify-between border-b border-slate-100 pb-2">
      <h2 class="font-semibold text-[11px] text-slate-600 uppercase tracking-wider">
        <i class="fa-solid fa-table-cells text-slate-900 mr-1.5"></i>Weekly Habit Tracker
      </h2>
      <div class="flex items-center gap-1 font-mono tabular-nums text-[10px] font-semibold text-slate-800 bg-slate-100 border border-slate-200/70 px-1.5 py-0.5 rounded-md">
        <button onclick="shiftAnalyticsHabitWeek(-1)" class="px-1 hover:text-slate-950" title="前週"><i class="fa-solid fa-chevron-left"></i></button>
        <span id="analyticsHabitWeekLabel">11/9〜11/15</span>
        <button onclick="shiftAnalyticsHabitWeek(1)" class="px-1 hover:text-slate-950" title="次週"><i class="fa-solid fa-chevron-right"></i></button>
      </div>
    </div>
    <div id="analyticsHabitWeeklyTable" class="space-y-1.5"></div>
    <div class="flex items-center justify-between text-[9px] text-slate-400 pt-1.5 border-t border-slate-100">
      <span>縦：習慣項目 ／ 横：1週間の達成状況</span>
      <div class="flex items-center gap-2">
        <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-xs bg-emerald-600 inline-block"></span>通常</span>
        <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-xs bg-amber-500 inline-block"></span>最小</span>
        <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-xs bg-slate-100 border border-slate-300 inline-block"></span>未達</span>
      </div>
    </div>
  </div>

  <div class="card-surface p-3.5 space-y-3">
    <div class="flex items-center justify-between border-b border-slate-100 pb-2">
      <h2 class="font-semibold text-[11px] text-slate-600 uppercase tracking-wider">
        <i class="fa-solid fa-chart-pie text-slate-900 mr-1.5"></i>Time Allocation (<span id="analyticsDomainTitle">仕事</span>)
      </h2>
    </div>
    <div class="bg-slate-50 border border-slate-200/80 p-3 rounded-lg flex items-center justify-between">
      <div>
        <div class="text-[9px] text-slate-400 font-semibold uppercase tracking-wider">Total Logged Time</div>
        <div id="analyticsTotalTime" class="text-base font-bold font-mono tabular-nums text-slate-900">0時間0分</div>
      </div>
      <i class="fa-regular fa-clock text-slate-400 text-lg"></i>
    </div>
    <div class="py-1"><canvas id="analyticsChart" class="max-w-[180px] mx-auto"></canvas></div>
    <div id="analyticsCategoryList" class="space-y-1.5 pt-1 border-t border-slate-100"></div>
  </div>
</div>

<script>
  App.mount('#slot-views', 'analyticsSection');

  var chartInstance = null;
  var conditionChartInstance = null;
  var vitalsChartInstance = null;

  App.on('domain:changed', function() {
    document.getElementById('analyticsDomainTitle').textContent =
      currentDomain === 'private' ? '私用・学習' : (currentDomain === 'all' ? '仕事＋私用 統合' : '仕事');
  });
  App.on('view:changed:analytics', renderAnalytics);

  function renderAnalytics() {
    var growthArea = document.getElementById('analyticsGrowthInsightsArea');
    if (growthArea && typeof computeGrowthCorrelations === 'function') {
      var insights = computeGrowthCorrelations();
      growthArea.innerHTML = '';
      if (insights.length === 0) {
        growthArea.innerHTML = '<div class="text-[11px] text-slate-400 py-1">複数日の睡眠・歩数・習慣・評価データが溜まると、ここに相関パターンが表示されます。</div>';
      } else {
        insights.forEach(function(item) {
          var box = document.createElement('div');
          box.className = 'p-2.5 rounded-lg bg-emerald-50/50 border border-emerald-200/80 flex items-start justify-between gap-2 text-xs';
          box.innerHTML =
            '<div class="space-y-0.5"><div class="font-bold text-emerald-950 text-[11px]">' + escapeHtml(item.title) + '</div>' +
            '<div class="text-[11px] text-slate-700 leading-relaxed">' + escapeHtml(item.text) + '</div></div>' +
            '<span class="font-mono font-bold text-xs px-2 py-0.5 rounded bg-emerald-600 text-white shrink-0">' + escapeHtml(item.metric) + '</span>';
          growthArea.appendChild(box);
        });
      }
    }

    var range = document.getElementById('analyticsRange').value;
    var today = new Date();
    var todayStr = formatDateLocal(today);
    var monthPrefix = todayStr.substring(0, 7);
    var monStr = formatDateLocal(getMonday(today));
    var sunDate = getMonday(today); sunDate.setDate(sunDate.getDate() + 6);
    var sunStr = formatDateLocal(sunDate);

    function inRange(d) {
      if (!d) return false;
      if (range === 'month') return d.indexOf(monthPrefix) === 0;
      if (range === 'week') return d >= monStr && d <= sunStr;
      return true;
    }

    var fWork = db.workLogs.filter(function(l) { return inRange(l.date); });
    var fPriv = db.privateLogs.filter(function(l) { return inRange(l.date); });

    var dateSet = {};
    fWork.forEach(function(l) { dateSet[l.date] = true; });
    fPriv.forEach(function(l) { dateSet[l.date] = true; });
    var dates = Object.keys(dateSet).sort();

    var labels = dates.map(function(d) { return d.substring(5); });
    var condArr = [], sleepArr = [], habitRateArr = [];
    var activeHabits = getHabitsForCurrentDomain();
    var totalHabits = activeHabits.length || 1;

    dates.forEach(function(d) {
      var w = fWork.find(function(l) { return l.date === d; });
      var p = fPriv.find(function(l) { return l.date === d; });
      condArr.push(w ? (w.condition || 3) : 3);

      var calcSleep = computeSleepForDate(d).sleepHours;
      var sVal = (calcSleep !== null) ? calcSleep : ((p && p.sleepHours !== null && p.sleepHours !== undefined) ? p.sleepHours : ((w && w.sleepHours !== undefined) ? w.sleepHours : 7));
      sleepArr.push(sVal);

      var doneCount = 0;
      activeHabits.forEach(function(h) {
        var st = (h.domain === 'work') ? (w && w.habitMap ? w.habitMap[h.id] : '') : (p && p.habitMap ? p.habitMap[h.id] : '');
        if (st === 'min' || st === 'normal') doneCount++;
      });
      habitRateArr.push(Math.round((doneCount / totalHabits) * 100));
    });

    var ctx1 = document.getElementById('conditionTrendChart').getContext('2d');
    if (conditionChartInstance) conditionChartInstance.destroy();
    conditionChartInstance = new Chart(ctx1, {
      type: 'bar',
      data: {
        labels: labels,
        datasets: [
          { label: '習慣達成(%)', type: 'bar', data: habitRateArr, backgroundColor: 'rgba(15, 23, 42, 0.14)', borderColor: '#334155', borderWidth: 1, yAxisID: 'y2', barThickness: 12 },
          { label: '体調(1-5)', type: 'line', data: condArr, borderColor: '#d97706', backgroundColor: '#d97706', borderWidth: 2, tension: 0.3, pointRadius: 2.5, yAxisID: 'y1' },
          { label: '睡眠(h)', type: 'line', data: sleepArr, borderColor: '#059669', backgroundColor: '#059669', borderWidth: 2, borderDash: [3, 3], tension: 0.3, pointRadius: 2.5, yAxisID: 'y1' }
        ]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: true, position: 'top', labels: { boxWidth: 10, font: { size: 9 } } } },
        scales: {
          y1: { type: 'linear', position: 'left', min: 0, max: 10, ticks: { stepSize: 2, font: { size: 9 } } },
          y2: { type: 'linear', position: 'right', min: 0, max: 100, ticks: { stepSize: 25, font: { size: 9 } }, grid: { drawOnChartArea: false } },
          x: { ticks: { font: { size: 9 } } }
        }
      }
    });

    var vitalDates = [], weightArr = [], sysArr = [], diaArr = [];
    var wSum = 0, wCnt = 0, sysSum = 0, diaSum = 0, bpCnt = 0, stepSum = 0, stepCnt = 0;

    dates.forEach(function(d) {
      var p = fPriv.find(function(l) { return l.date === d; });
      var stVal = getPrivateSteps(p);
      if (stVal) { stepSum += Number(stVal); stepCnt++; }
      if (p && (p.weight || p.bpSys || p.bpDia)) {
        vitalDates.push(d.substring(5));
        var wNum = p.weight ? Number(p.weight) : null;
        var sNum = p.bpSys ? Number(p.bpSys) : null;
        var dNum = p.bpDia ? Number(p.bpDia) : null;
        weightArr.push(wNum); sysArr.push(sNum); diaArr.push(dNum);
        if (wNum) { wSum += wNum; wCnt++; }
        if (sNum && dNum) { sysSum += sNum; diaSum += dNum; bpCnt++; }
      }
    });

    var badgeText = [];
    if (stepCnt > 0) badgeText.push('歩数AVG ' + Math.round(stepSum / stepCnt).toLocaleString());
    if (wCnt > 0) badgeText.push((wSum / wCnt).toFixed(1) + 'kg');
    if (bpCnt > 0) badgeText.push(Math.round(sysSum / bpCnt) + '/' + Math.round(diaSum / bpCnt));
    document.getElementById('vitalsSummaryBadge').textContent = badgeText.length > 0 ? badgeText.join(' | ') : 'NO DATA';

    var ctxV = document.getElementById('vitalsTrendChart').getContext('2d');
    if (vitalsChartInstance) vitalsChartInstance.destroy();
    vitalsChartInstance = new Chart(ctxV, {
      type: 'line',
      data: {
        labels: vitalDates,
        datasets: [
          { label: '体重(kg)', data: weightArr, borderColor: '#0f172a', backgroundColor: '#0f172a', borderWidth: 2, tension: 0.3, pointRadius: 2.5, spanGaps: true, yAxisID: 'yWeight' },
          { label: '最高血圧', data: sysArr, borderColor: '#e11d48', backgroundColor: '#e11d48', borderWidth: 2, borderDash: [4, 2], tension: 0.3, pointRadius: 2.5, spanGaps: true, yAxisID: 'yBp' },
          { label: '最低血圧', data: diaArr, borderColor: '#0284c7', backgroundColor: '#0284c7', borderWidth: 2, borderDash: [4, 2], tension: 0.3, pointRadius: 2.5, spanGaps: true, yAxisID: 'yBp' }
        ]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: true, position: 'top', labels: { boxWidth: 10, font: { size: 9 } } } },
        scales: {
          yWeight: { type: 'linear', position: 'left', ticks: { font: { size: 9 } } },
          yBp: { type: 'linear', position: 'right', min: 40, max: 180, ticks: { stepSize: 20, font: { size: 9 } }, grid: { drawOnChartArea: false } },
          x: { ticks: { font: { size: 9 } } }
        }
      }
    });

    renderAnalyticsHabitWeeklyTable();

    var targetLogs = [];
    if (currentDomain === 'work' || currentDomain === 'all') targetLogs = targetLogs.concat(fWork);
    if (currentDomain === 'private' || currentDomain === 'all') targetLogs = targetLogs.concat(fPriv);

    var catTotals = {}, totalMin = 0;
    targetLogs.forEach(function(l) {
      if (!l.scheduleText) return;
      l.scheduleText.split('\n').forEach(function(line) {
        var m = line.match(/(\d{1,2}:\d{2})\s*-\s*(\d{1,2}:\d{2})/);
        if (m) {
          var s = m[1].split(':'), e = m[2].split(':');
          var diff = (parseInt(e[0], 10) * 60 + parseInt(e[1], 10)) - (parseInt(s[0], 10) * 60 + parseInt(s[1], 10));
          if (diff < 0) diff += 1440;
          var cm = line.match(/\[(.*?)\]/);
          var cat = cm ? cm[1] : 'その他';
          catTotals[cat] = (catTotals[cat] || 0) + diff;
          totalMin += diff;
        }
      });
    });

    document.getElementById('analyticsTotalTime').textContent = Math.floor(totalMin / 60) + '時間 ' + (totalMin % 60) + '分';
    var listArea = document.getElementById('analyticsCategoryList');
    listArea.innerHTML = '';
    var cats = Object.keys(catTotals).sort(function(a, b) { return catTotals[b] - catTotals[a]; });

    if (cats.length === 0) {
      if (chartInstance) chartInstance.destroy();
      listArea.innerHTML = '<div class="text-xs text-slate-400 text-center py-4">集計データがありません</div>';
      return;
    }

    var colors = ['#0f172a', '#4338ca', '#0f766e', '#d97706', '#e11d48', '#64748b'];
    var vals = [], bg = [];
    cats.forEach(function(c, idx) {
      var mins = catTotals[c];
      var pct = totalMin > 0 ? ((mins / totalMin) * 100).toFixed(1) : 0;
      var col = colors[idx % colors.length];
      vals.push((mins / 60).toFixed(2));
      bg.push(col);
      var r = document.createElement('div');
      r.className = 'flex items-center justify-between text-xs py-1 border-b border-slate-100';
      r.innerHTML = '<div class="flex items-center gap-2"><span class="w-2 h-2 rounded-xs" style="background:' + col + '"></span><span class="font-medium text-slate-800">' + escapeHtml(c) + '</span></div>' +
                    '<span class="font-mono font-semibold text-slate-600">' + Math.floor(mins / 60) + 'h ' + (mins % 60) + 'm (' + pct + '%)</span>';
      listArea.appendChild(r);
    });

    var ctx2 = document.getElementById('analyticsChart').getContext('2d');
    if (chartInstance) chartInstance.destroy();
    chartInstance = new Chart(ctx2, {
      type: 'doughnut',
      data: { labels: cats, datasets: [{ data: vals, backgroundColor: bg, borderWidth: 2, borderColor: '#fff' }] },
      options: { responsive: true, plugins: { legend: { display: false } }, cutout: '72%' }
    });
  }

  function shiftAnalyticsHabitWeek(offsetWeeks) {
    analyticsHabitWeekMonday.setDate(analyticsHabitWeekMonday.getDate() + (offsetWeeks * 7));
    renderAnalyticsHabitWeeklyTable();
  }

  function renderAnalyticsHabitWeeklyTable() {
    var area = document.getElementById('analyticsHabitWeeklyTable');
    area.innerHTML = '';
    var weekDates = [], dayNames = ['月', '火', '水', '木', '金', '土', '日'];
    for (var i = 0; i < 7; i++) {
      var d = new Date(analyticsHabitWeekMonday);
      d.setDate(d.getDate() + i);
      weekDates.push({ dateStr: formatDateLocal(d), dayLabel: dayNames[i], dayNum: d.getDate(), monthNum: d.getMonth() + 1 });
    }
    document.getElementById('analyticsHabitWeekLabel').textContent =
      weekDates[0].monthNum + '/' + weekDates[0].dayNum + '〜' + weekDates[6].monthNum + '/' + weekDates[6].dayNum;

    var habits = getHabitsForCurrentDomain();
    if (habits.length === 0) {
      area.innerHTML = '<div class="text-xs text-slate-400 text-center py-3">登録された習慣がありません</div>';
      return;
    }

    var headerRow = document.createElement('div');
    headerRow.className = 'grid grid-cols-[1fr_repeat(7,26px)] gap-1 items-center text-center pb-1 border-b border-slate-100';
    var headHtml = '<div class="text-left text-[9px] font-semibold text-slate-400 pl-1">習慣項目 / 達成日</div>';
    weekDates.forEach(function(wd) {
      headHtml += '<div class="text-slate-500 leading-tight"><div class="text-[8px] font-semibold">' + wd.dayLabel + '</div><div class="text-[9px] font-mono tabular-nums font-bold">' + wd.dayNum + '</div></div>';
    });
    headerRow.innerHTML = headHtml;
    area.appendChild(headerRow);

    habits.forEach(function(h) {
      var doneCount = 0, targetDaysCount = 0, cellsHtml = '';
      weekDates.forEach(function(wd) {
        var isTargetDay = isHabitActiveOnDate(h, wd.dateStr);
        if (isTargetDay) targetDaysCount++;

        var targetLog = (h.domain === 'work')
          ? db.workLogs.find(function(l) { return l.date === wd.dateStr; })
          : db.privateLogs.find(function(l) { return l.date === wd.dateStr; });
        var status = (targetLog && targetLog.habitMap) ? (targetLog.habitMap[h.id] || '') : '';
        if (status === 'normal' || status === 'min') doneCount++;

        var cellCls = isTargetDay ? 'bg-slate-50 border-slate-200 text-slate-300' : 'bg-slate-100/60 border-transparent text-slate-300';
        var icon = isTargetDay ? '・' : '-';
        if (status === 'normal') { cellCls = 'bg-emerald-600 border-emerald-700 text-white font-bold'; icon = '<i class="fa-solid fa-check text-[9px]"></i>'; }
        else if (status === 'min') { cellCls = 'bg-amber-500 border-amber-600 text-white font-bold'; icon = '<i class="fa-solid fa-bolt text-[8px]"></i>'; }

        cellsHtml += '<button type="button" onclick="jumpToEditDate(\'' + wd.dateStr + '\')" title="' + wd.dateStr + ' ' + escapeHtml(h.name) + '" class="w-6.5 h-6.5 rounded-md border flex items-center justify-center transition hover:opacity-80 ' + cellCls + '">' + icon + '</button>';
      });

      var denom = targetDaysCount || 7;
      var domainPill = (currentDomain === 'all')
        ? (h.domain === 'work' ? '<span class="text-[8px] font-semibold bg-slate-800 text-white px-1 rounded">仕</span>' : '<span class="text-[8px] font-semibold bg-indigo-700 text-white px-1 rounded">私</span>')
        : '';

      var row = document.createElement('div');
      row.className = 'grid grid-cols-[1fr_repeat(7,26px)] gap-1 items-center py-1 border-b border-slate-50';
      row.innerHTML =
        '<div class="min-w-0 pr-1">' +
          '<div class="flex items-center gap-1">' + domainPill + '<span class="font-semibold text-[11px] text-slate-900 truncate">' + escapeHtml(h.name) + '</span></div>' +
          '<div class="text-[9px] font-mono tabular-nums font-semibold ' + (doneCount >= Math.ceil(denom * 0.7) ? 'text-emerald-700' : 'text-slate-400') + '">' + doneCount + ' / ' + denom + '日達成</div>' +
        '</div>' + cellsHtml;
      area.appendChild(row);
    });
  }
</script>



<script>
  var KEY_ANALYTICS_LAYOUT = 'worklife_os_analytics_layout_v1';

  function toggleAnalyticsCustomizerPanel() {
    var p = document.getElementById('analyticsCustomizerPanel');
    if (!p) return;
    p.classList.toggle('hidden');
    if (!p.classList.contains('hidden')) renderAnalyticsCustomizerList();
  }

  function getAnalyticsSectionCards() {
    var view = document.getElementById('analyticsView');
    if (!view) return [];
    var cards = [];
    Array.prototype.forEach.call(view.children, function(el, idx) {
      if (el.id === 'analyticsCustomizerBox') return;
      if (!el.dataset.secKey) {
        var h = el.querySelector('h2, h3');
        var rawTitle = h ? h.textContent.replace(/\s+/g, ' ').trim() : ('セクション ' + (idx + 1));
        el.dataset.secKey = el.id || ('sec_' + idx + '_' + rawTitle.slice(0, 12));
        el.dataset.secTitle = rawTitle;
      }
      cards.push(el);
    });
    return cards;
  }

  function loadAnalyticsLayoutPref() {
    try {
      var raw = localStorage.getItem(KEY_ANALYTICS_LAYOUT);
      return raw ? JSON.parse(raw) : [];
    } catch (e) { return []; }
  }

  function saveAnalyticsLayoutPref(prefList) {
    try { localStorage.setItem(KEY_ANALYTICS_LAYOUT, JSON.stringify(prefList)); } catch (e) {}
  }

  function applyAnalyticsLayoutOrderAndVisibility() {
    var view = document.getElementById('analyticsView');
    var box = document.getElementById('analyticsCustomizerBox');
    if (!view || !box) return;
    if (view.firstChild !== box) view.insertBefore(box, view.firstChild);

    var cards = getAnalyticsSectionCards();
    var prefs = loadAnalyticsLayoutPref();
    if (!prefs || prefs.length === 0) return;

    var map = {};
    cards.forEach(function(c) { map[c.dataset.secKey] = c; });

    prefs.forEach(function(p) {
      var el = map[p.key];
      if (el) {
        el.classList.toggle('hidden', p.visible === false);
        view.appendChild(el);
      }
    });
  }

  function renderAnalyticsCustomizerList() {
    var listEl = document.getElementById('analyticsCustomizerList');
    if (!listEl) return;
    var cards = getAnalyticsSectionCards();
    var prefs = loadAnalyticsLayoutPref();
    var visMap = {};
    prefs.forEach(function(p) { visMap[p.key] = (p.visible !== false); });

    listEl.innerHTML = '';
    cards.forEach(function(c, idx) {
      var key = c.dataset.secKey;
      var title = c.dataset.secTitle || key;
      var isVis = (visMap[key] !== undefined) ? visMap[key] : !c.classList.contains('hidden');

      var row = document.createElement('div');
      row.className = 'flex items-center justify-between gap-2 px-2 py-1 rounded bg-slate-50 border border-slate-200/80 text-[11px]';
      row.innerHTML =
        '<label class="flex items-center gap-2 min-w-0 flex-1 cursor-pointer">' +
          '<input type="checkbox" ' + (isVis ? 'checked' : '') + ' onchange="toggleAnalyticsSectionVis(\'' + escapeHtml(key) + '\', this.checked)" class="rounded border-slate-300">' +
          '<span class="truncate font-medium text-slate-800">' + escapeHtml(title) + '</span>' +
        '</label>' +
        '<div class="flex items-center gap-1 shrink-0">' +
          '<button type="button" onclick="moveAnalyticsSection(\'' + escapeHtml(key) + '\', -1)" ' + (idx === 0 ? 'disabled' : '') + ' class="w-5 h-5 rounded bg-white border border-slate-200 text-[9px] flex items-center justify-center ' + (idx === 0 ? 'text-slate-200' : 'text-slate-700 hover:bg-slate-100') + '"><i class="fa-solid fa-chevron-up"></i></button>' +
          '<button type="button" onclick="moveAnalyticsSection(\'' + escapeHtml(key) + '\', 1)" ' + (idx === cards.length - 1 ? 'disabled' : '') + ' class="w-5 h-5 rounded bg-white border border-slate-200 text-[9px] flex items-center justify-center ' + (idx === cards.length - 1 ? 'text-slate-200' : 'text-slate-700 hover:bg-slate-100') + '"><i class="fa-solid fa-chevron-down"></i></button>' +
        '</div>';
      listEl.appendChild(row);
    });
  }

  function syncCurrentDomToAnalyticsPrefs() {
    var cards = getAnalyticsSectionCards();
    var prefs = cards.map(function(c) {
      return {
        key: c.dataset.secKey,
        visible: !c.classList.contains('hidden')
      };
    });
    saveAnalyticsLayoutPref(prefs);
  }

  function toggleAnalyticsSectionVis(key, checked) {
    var cards = getAnalyticsSectionCards();
    var found = cards.find(function(c) { return c.dataset.secKey === key; });
    if (found) found.classList.toggle('hidden', !checked);
    syncCurrentDomToAnalyticsPrefs();
  }

  function moveAnalyticsSection(key, delta) {
    var view = document.getElementById('analyticsView');
    var cards = getAnalyticsSectionCards();
    var idx = cards.findIndex(function(c) { return c.dataset.secKey === key; });
    var targetIdx = idx + delta;
    if (idx === -1 || targetIdx < 0 || targetIdx >= cards.length) return;

    if (delta < 0) {
      view.insertBefore(cards[idx], cards[targetIdx]);
    } else {
      view.insertBefore(cards[targetIdx], cards[idx]);
    }
    syncCurrentDomToAnalyticsPrefs();
    renderAnalyticsCustomizerList();
  }

  App.on('view:changed:analytics', function() {
    setTimeout(applyAnalyticsLayoutOrderAndVisibility, 30);
  });
</script>
