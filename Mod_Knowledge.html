<!-- 3 & 4: ナレッジ検索・プレイブック・累積投資時間・週次レポート生成モジュール -->
<div id="knowledgeAndPlaybookSection" class="card-surface p-3.5 space-y-3 border-l-2 border-l-indigo-600">
  <div class="flex items-center justify-between border-b border-slate-100 pb-2">
    <h2 class="font-semibold text-[11px] text-indigo-950 uppercase tracking-wider flex items-center gap-1.5">
      <i class="fa-solid fa-book-bookmark text-indigo-600"></i> Playbook & Knowledge Search
    </h2>
    <button type="button" onclick="toggleAddPlaybookForm()" class="text-[10px] font-semibold bg-indigo-50 hover:bg-indigo-100 text-indigo-800 border border-indigo-200 px-2 py-0.5 rounded-md transition">
      + 行動原則を追加
    </button>
  </div>

  <!-- 行動原則の直接追加フォーム -->
  <div id="addPlaybookForm" class="bg-indigo-50/50 border border-indigo-200/80 rounded-lg p-2.5 space-y-2 hidden">
    <div class="text-[10px] font-bold text-indigo-950">マイ・プレイブック（常に意識したい原則・学び）を登録</div>
    <input type="text" id="newPlaybookText" placeholder="例：迷ったら最小目標（2分ルール）から着手する" class="w-full px-2.5 py-1.5 border border-slate-200 rounded-md bg-white text-xs outline-none focus:border-indigo-600">
    <div class="flex items-center justify-end gap-1.5">
      <button type="button" onclick="toggleAddPlaybookForm()" class="px-2.5 py-1 text-[10px] font-semibold text-slate-500 hover:text-slate-800">キャンセル</button>
      <button type="button" onclick="addCustomPlaybookItem()" class="px-3 py-1 bg-indigo-700 hover:bg-indigo-800 text-white text-[10px] font-semibold rounded-md transition">ピン留め登録</button>
    </div>
  </div>

  <!-- ピン留め済みマイ・プレイブック -->
  <div class="space-y-1.5">
    <div class="flex items-center justify-between text-[10px] text-slate-500 font-semibold">
      <span><i class="fa-solid fa-thumbtack text-amber-500 mr-1"></i>マイ・プレイブック（固定中の学び）</span>
      <span id="playbookCountBadge" class="font-mono text-[9px] text-slate-400">0件</span>
    </div>
    <div id="pinnedPlaybookArea" class="space-y-1.5"></div>
  </div>

  <!-- 過去ログ横断全文検索 -->
  <div class="pt-2 border-t border-slate-100 space-y-2">
    <div class="relative">
      <i class="fa-solid fa-magnifying-glass text-slate-400 text-[11px] absolute left-2.5 top-1/2 -translate-y-1/2"></i>
      <input type="text" id="knowledgeSearchInput" oninput="renderKnowledgeSearchResults()" placeholder="過去のInsight・KPT・メモ・活動をキーワード検索..." class="w-full pl-7 pr-7 py-1.5 border border-slate-200 rounded-lg text-xs bg-slate-50 focus:bg-white outline-none focus:border-indigo-600 transition">
      <button type="button" id="clearKnowledgeSearchBtn" onclick="clearKnowledgeSearch()" class="hidden text-slate-400 hover:text-slate-700 text-xs absolute right-2.5 top-1/2 -translate-y-1/2">
        <i class="fa-solid fa-circle-xmark"></i>
      </button>
    </div>

    <div class="flex items-center gap-1 flex-wrap text-[10px]" id="knowledgeFilterChips">
      <button type="button" data-filter="all" onclick="setKnowledgeFilter('all')" class="px-2 py-0.5 rounded-md font-semibold bg-slate-900 text-white transition">すべて</button>
      <button type="button" data-filter="insight" onclick="setKnowledgeFilter('insight')" class="px-2 py-0.5 rounded-md font-semibold bg-slate-100 text-slate-600 hover:bg-slate-200 transition">💡 Insight</button>
      <button type="button" data-filter="keep" onclick="setKnowledgeFilter('keep')" class="px-2 py-0.5 rounded-md font-semibold bg-slate-100 text-slate-600 hover:bg-slate-200 transition">🏆 Keep</button>
      <button type="button" data-filter="problem" onclick="setKnowledgeFilter('problem')" class="px-2 py-0.5 rounded-md font-semibold bg-slate-100 text-slate-600 hover:bg-slate-200 transition">⚠️ Problem</button>
      <button type="button" data-filter="try" onclick="setKnowledgeFilter('try')" class="px-2 py-0.5 rounded-md font-semibold bg-slate-100 text-slate-600 hover:bg-slate-200 transition">🎯 Try</button>
      <button type="button" data-filter="log" onclick="setKnowledgeFilter('log')" class="px-2 py-0.5 rounded-md font-semibold bg-slate-100 text-slate-600 hover:bg-slate-200 transition">📝 メモ・活動</button>
    </div>

    <div id="knowledgeSearchResultsArea" class="space-y-1.5 max-h-64 overflow-y-auto"></div>
  </div>
</div>

<!-- 累積投資時間トラッカーカード -->
<div id="cumulativeTimeCard" class="card-surface p-3.5 space-y-2.5 border-l-2 border-l-amber-500">
  <div class="flex items-center justify-between border-b border-slate-100 pb-2">
    <h2 class="font-semibold text-[11px] text-slate-700 uppercase tracking-wider flex items-center gap-1.5">
      <i class="fa-solid fa-hourglass-half text-amber-500"></i> Cumulative Investment（全期間 累積投資時間）
    </h2>
    <span id="cumulativeGrandTotalBadge" class="text-[10px] font-mono tabular-nums font-bold px-2 py-0.5 rounded bg-amber-50 text-amber-900 border border-amber-200">
      累計 0.0h
    </span>
  </div>
  <p class="text-[10px] text-slate-400">
    全期間の記録からカテゴリ別の総投資時間を集計します（目標値をタップして変更可能）。
  </p>
  <div id="cumulativeCategoryBarsArea" class="space-y-2"></div>
</div>

<!-- 週次振り返りレポート自動生成カード -->
<div id="weeklyAutoReportCard" class="card-surface p-3.5 space-y-2.5 border-l-2 border-l-slate-900">
  <div class="flex items-center justify-between border-b border-slate-100 pb-2">
    <h2 class="font-semibold text-[11px] text-slate-800 uppercase tracking-wider flex items-center gap-1.5">
      <i class="fa-solid fa-file-lines text-slate-900"></i> Weekly Review Digest（週次レポート自動集約）
    </h2>
    <button type="button" onclick="copyWeeklyReportMarkdown()" class="px-2.5 py-1 bg-slate-900 hover:bg-slate-800 active:scale-95 text-white rounded-md text-[10px] font-semibold flex items-center gap-1 transition">
      <i class="fa-regular fa-copy"></i> レポートをコピー
    </button>
  </div>
  <div id="weeklyAutoReportPreview" class="bg-slate-50 border border-slate-200/80 rounded-lg p-2.5 text-[11px] text-slate-800 space-y-2 leading-relaxed"></div>
</div>

<script>
  var KEY_PINNED_PLAYBOOK = 'worklife_os_pinned_playbook_v1';
  var KEY_CATEGORY_TARGETS = 'worklife_os_category_targets_v1';
  var currentKnowledgeFilter = 'all';
  var latestWeeklyMarkdownText = '';

  function mountKnowledgeModules() {
    var knowledgeSlot = document.getElementById('analyticsView');
    var knowledgeSec = document.getElementById('knowledgeAndPlaybookSection');
    if (knowledgeSlot && knowledgeSec) {
      knowledgeSlot.appendChild(knowledgeSec);
    }

    var analyticsView = document.getElementById('analyticsView');
    var cumCard = document.getElementById('cumulativeTimeCard');
    if (analyticsView && cumCard) {
      analyticsView.appendChild(cumCard);
    }

    var weeklyView = document.getElementById('analyticsView');
    var weeklyGrid = document.getElementById('weeklyGrid');
    var reportCard = document.getElementById('weeklyAutoReportCard');
    if (weeklyView && reportCard) { weeklyView.appendChild(reportCard); }
  }

  function jumpToKnowledgeSearch() {
    switchView('analytics');
    setTimeout(function() {
      var inp = document.getElementById('knowledgeSearchInput');
      if (inp) {
        inp.scrollIntoView({ behavior: 'smooth', block: 'center' });
        inp.focus();
      }
    }, 120);
  }

  // ==========================================
  // 4. マイ・プレイブック ＆ 過去ログ全文検索
  // ==========================================
  function getPinnedPlaybook() {
    try {
      var raw = localStorage.getItem(KEY_PINNED_PLAYBOOK);
      return raw ? JSON.parse(raw) : [];
    } catch (e) { return []; }
  }

  function savePinnedPlaybook(list) {
    try { localStorage.setItem(KEY_PINNED_PLAYBOOK, JSON.stringify(list)); } catch (e) {}
  }

  function toggleAddPlaybookForm() {
    var f = document.getElementById('addPlaybookForm');
    if (!f) return;
    f.classList.toggle('hidden');
    if (!f.classList.contains('hidden')) {
      document.getElementById('newPlaybookText').focus();
    }
  }

  function addCustomPlaybookItem() {
    var inp = document.getElementById('newPlaybookText');
    var txt = (inp.value || '').trim();
    if (!txt) return showToast('行動原則を入力してください', true);
    var list = getPinnedPlaybook();
    list.unshift({
      id: 'pb_' + Date.now(),
      date: formatDateLocal(new Date()),
      domain: currentDomain === 'private' ? 'private' : 'work',
      tag: '原則',
      text: txt
    });
    savePinnedPlaybook(list);
    inp.value = '';
    toggleAddPlaybookForm();
    renderPinnedPlaybook();
    renderKnowledgeSearchResults();
    showToast('マイ・プレイブックに固定しました');
  }

  function togglePinKnowledgeItem(itemId, dateStr, domain, tag, encodedText) {
    var list = getPinnedPlaybook();
    var idx = list.findIndex(function(x) { return x.id === itemId; });
    if (idx !== -1) {
      list.splice(idx, 1);
      savePinnedPlaybook(list);
      renderPinnedPlaybook();
      renderKnowledgeSearchResults();
      showToast('ピン留めを解除しました');
    } else {
      var decodedText = decodeURIComponent(encodedText);
      list.unshift({
        id: itemId,
        date: dateStr,
        domain: domain,
        tag: tag,
        text: decodedText
      });
      savePinnedPlaybook(list);
      renderPinnedPlaybook();
      renderKnowledgeSearchResults();
      showToast('マイ・プレイブックにピン留めしました！');
    }
  }

  function renderPinnedPlaybook() {
    var area = document.getElementById('pinnedPlaybookArea');
    var badge = document.getElementById('playbookCountBadge');
    if (!area) return;
    var list = getPinnedPlaybook();
    if (badge) badge.textContent = list.length + '件';
    area.innerHTML = '';

    if (list.length === 0) {
      area.innerHTML = '<div class="text-[10px] text-slate-400 bg-slate-50 border border-dashed border-slate-200 rounded-lg p-2 text-center">下の検索結果から「📌」を押すと、重要な学びをここに固定できます</div>';
      return;
    }

    list.forEach(function(item) {
      var row = document.createElement('div');
      row.className = 'p-2 rounded-lg bg-amber-50/50 border border-amber-200/80 flex items-start justify-between gap-2 text-xs';
      row.innerHTML =
        '<div class="min-w-0 flex-1 space-y-0.5">' +
          '<div class="flex items-center gap-1.5 text-[9px] text-slate-500 font-mono">' +
            '<span class="font-semibold bg-amber-100 text-amber-900 px-1.5 py-0.2 rounded">' + escapeHtml(item.tag || '学び') + '</span>' +
            '<span>' + escapeHtml(item.date || '') + '</span>' +
          '</div>' +
          '<div class="text-[11px] font-semibold text-slate-900 whitespace-pre-wrap break-words leading-relaxed">' + escapeHtml(item.text) + '</div>' +
        '</div>' +
        '<button type="button" onclick="togglePinKnowledgeItem(\'' + escapeHtml(item.id) + '\', \'\', \'\', \'\', \'\')" class="text-amber-600 hover:text-slate-500 p-1 shrink-0" title="固定解除"><i class="fa-solid fa-thumbtack"></i></button>';
      area.appendChild(row);
    });
  }

  function setKnowledgeFilter(filterKey) {
    currentKnowledgeFilter = filterKey;
    var container = document.getElementById('knowledgeFilterChips');
    if (container) {
      var btns = container.querySelectorAll('button');
      btns.forEach(function(b) {
        var isSelected = (b.getAttribute('data-filter') === filterKey);
        b.className = isSelected
          ? 'px-2 py-0.5 rounded-md font-semibold bg-slate-900 text-white transition'
          : 'px-2 py-0.5 rounded-md font-semibold bg-slate-100 text-slate-600 hover:bg-slate-200 transition';
      });
    }
    renderKnowledgeSearchResults();
  }

  function clearKnowledgeSearch() {
    var inp = document.getElementById('knowledgeSearchInput');
    if (inp) inp.value = '';
    renderKnowledgeSearchResults();
  }

  function collectAllKnowledgeEntries() {
    var entries = [];
    (db.workLogs || []).forEach(function(w) {
      if (w.reportInsight && w.reportInsight.trim()) {
        entries.push({ id: 'w_ins_' + w.date, date: w.date, domain: 'work', type: 'insight', tag: '💡 Insight', text: w.reportInsight.trim() });
      }
      if (w.reportKeep && w.reportKeep.trim()) {
        entries.push({ id: 'w_keep_' + w.date, date: w.date, domain: 'work', type: 'keep', tag: '🏆 Keep', text: w.reportKeep.trim() });
      }
      if (w.reportProblem && w.reportProblem.trim()) {
        entries.push({ id: 'w_prob_' + w.date, date: w.date, domain: 'work', type: 'problem', tag: '⚠️ Problem', text: w.reportProblem.trim() });
      }
      if (w.reportTry && w.reportTry.trim()) {
        entries.push({ id: 'w_try_' + w.date, date: w.date, domain: 'work', type: 'try', tag: '🎯 Try', text: w.reportTry.trim() });
      }
      if (w.quickNote && w.quickNote.trim()) {
        entries.push({ id: 'w_note_' + w.date, date: w.date, domain: 'work', type: 'log', tag: '📝 仕事メモ', text: w.quickNote.trim() });
      }
      if (w.scheduleText && w.scheduleText.trim()) {
        entries.push({ id: 'w_sch_' + w.date, date: w.date, domain: 'work', type: 'log', tag: '⏱ 仕事ログ', text: w.scheduleText.trim() });
      }
    });

    (db.privateLogs || []).forEach(function(p) {
      var pNote = getPrivateQuickNote(p).trim();
      if (pNote) {
        entries.push({ id: 'p_note_' + p.date, date: p.date, domain: 'private', type: 'log', tag: '📝 私用メモ', text: pNote });
      }
      if (p.scheduleText && p.scheduleText.trim()) {
        entries.push({ id: 'p_sch_' + p.date, date: p.date, domain: 'private', type: 'log', tag: '⏱ 学習・私用ログ', text: p.scheduleText.trim() });
      }
    });

    entries.sort(function(a, b) { return a.date < b.date ? 1 : (a.date > b.date ? -1 : 0); });
    return entries;
  }

  function renderKnowledgeSearchResults() {
    var area = document.getElementById('knowledgeSearchResultsArea');
    var inp = document.getElementById('knowledgeSearchInput');
    var clearBtn = document.getElementById('clearKnowledgeSearchBtn');
    if (!area || !inp) return;

    var keyword = (inp.value || '').trim().toLowerCase();
    if (clearBtn) clearBtn.classList.toggle('hidden', keyword === '');

    var allEntries = collectAllKnowledgeEntries();
    var filtered = allEntries.filter(function(e) {
      if (currentDomain === 'work' && e.domain !== 'work') return false;
      if (currentDomain === 'private' && e.domain !== 'private') return false;
      if (currentKnowledgeFilter !== 'all' && e.type !== currentKnowledgeFilter) return false;
      if (keyword !== '' && e.text.toLowerCase().indexOf(keyword) === -1 && e.date.indexOf(keyword) === -1) return false;
      return true;
    });

    area.innerHTML = '';
    if (filtered.length === 0) {
      area.innerHTML = '<div class="text-[11px] text-slate-400 text-center py-3">一致する記録・知見が見つかりませんでした</div>';
      return;
    }

    var pinnedIds = getPinnedPlaybook().map(function(x) { return x.id; });
    var displayList = filtered.slice(0, 25);

    displayList.forEach(function(item) {
      var isPinned = pinnedIds.indexOf(item.id) !== -1;
      var encodedTxt = encodeURIComponent(item.text);
      var card = document.createElement('div');
      card.className = 'p-2.5 rounded-lg bg-slate-50 border border-slate-200/80 hover:border-slate-300 flex items-start justify-between gap-2 text-xs transition';
      card.innerHTML =
        '<div class="min-w-0 flex-1 space-y-1 cursor-pointer" onclick="jumpToEditDate(\'' + item.date + '\')" title="タップでこの日の記録へ移動">' +
          '<div class="flex items-center gap-1.5 flex-wrap">' +
            '<span class="text-[9px] font-semibold px-1.5 py-0.2 rounded bg-white border border-slate-200 text-slate-700">' + escapeHtml(item.tag) + '</span>' +
            '<span class="text-[10px] font-mono font-semibold text-slate-500">' + escapeHtml(item.date) + '</span>' +
          '</div>' +
          '<div class="text-[11px] text-slate-800 whitespace-pre-wrap break-words leading-relaxed">' + escapeHtml(item.text) + '</div>' +
        '</div>' +
        '<button type="button" onclick="togglePinKnowledgeItem(\'' + escapeHtml(item.id) + '\', \'' + escapeHtml(item.date) + '\', \'' + escapeHtml(item.domain) + '\', \'' + escapeHtml(item.tag) + '\', \'' + encodedTxt + '\')" class="px-1.5 py-1 rounded text-xs shrink-0 ' + (isPinned ? 'text-amber-500 bg-amber-50' : 'text-slate-300 hover:text-amber-500') + '" title="マイ・プレイブックに固定">' +
          '<i class="fa-solid fa-thumbtack"></i>' +
        '</button>';
      area.appendChild(card);
    });
  }

  // ==========================================
  // 3-A. 累積投資時間トラッカー
  // ==========================================
  function getCategoryTargetsMap() {
    try {
      var raw = localStorage.getItem(KEY_CATEGORY_TARGETS);
      return raw ? JSON.parse(raw) : {};
    } catch (e) { return {}; }
  }

  function setCategoryTargetHours(catName, currentHours) {
    var targets = getCategoryTargetsMap();
    var curVal = targets[catName] || getAutoMilestoneHours(currentHours);
    var input = window.prompt('「' + catName + '」の目標累積時間（時間）を入力してください:', String(curVal));
    if (input === null) return;
    var num = parseFloat(input);
    if (!isNaN(num) && num > 0) {
      targets[catName] = num;
      try { localStorage.setItem(KEY_CATEGORY_TARGETS, JSON.stringify(targets)); } catch (e) {}
      renderCumulativeInvestment();
      showToast('目標時間を ' + num + '時間 に設定しました');
    }
  }

  function getAutoMilestoneHours(hours) {
    var steps = [10, 25, 50, 100, 200, 300, 500, 1000, 2000];
    for (var i = 0; i < steps.length; i++) {
      if (hours < steps[i]) return steps[i];
    }
    return Math.ceil((hours + 100) / 500) * 500;
  }

  function renderCumulativeInvestment() {
    var area = document.getElementById('cumulativeCategoryBarsArea');
    var grandBadge = document.getElementById('cumulativeGrandTotalBadge');
    if (!area) return;

    var logs = [];
    if (currentDomain === 'work' || currentDomain === 'all') logs = logs.concat(db.workLogs || []);
    if (currentDomain === 'private' || currentDomain === 'all') logs = logs.concat(db.privateLogs || []);

    var catMins = {};
    var totalAllMins = 0;

    logs.forEach(function(l) {
      if (!l.scheduleText) return;
      l.scheduleText.split('\n').forEach(function(line) {
        var m = line.match(/(\d{1,2}:\d{2})\s*-\s*(\d{1,2}:\d{2})/);
        if (m) {
          var s = m[1].split(':'), e = m[2].split(':');
          var diff = (parseInt(e[0], 10) * 60 + parseInt(e[1], 10)) - (parseInt(s[0], 10) * 60 + parseInt(s[1], 10));
          if (diff < 0) diff += 1440;
          var cm = line.match(/\[(.*?)\]/);
          var cat = cm ? cm[1] : 'その他';
          catMins[cat] = (catMins[cat] || 0) + diff;
          totalAllMins += diff;
        }
      });
    });

    var grandHours = (totalAllMins / 60).toFixed(1);
    if (grandBadge) grandBadge.textContent = '全期間累計 ' + grandHours + 'h';

    area.innerHTML = '';
    var cats = Object.keys(catMins).sort(function(a, b) { return catMins[b] - catMins[a]; });
    if (cats.length === 0) {
      area.innerHTML = '<div class="text-xs text-slate-400 text-center py-3">活動・学習ログを記録すると累積投資時間が自動集計されます</div>';
      return;
    }

    var targetsMap = getCategoryTargetsMap();
    cats.forEach(function(cat) {
      var hrs = parseFloat((catMins[cat] / 60).toFixed(1));
      var targetHrs = targetsMap[cat] || getAutoMilestoneHours(hrs);
      var pct = Math.min(100, Math.round((hrs / targetHrs) * 100));
      var safeCatArg = escapeHtml(cat).replace(/'/g, '&#39;');

      var item = document.createElement('div');
      item.className = 'p-2.5 rounded-lg bg-slate-50 border border-slate-200/80 space-y-1.5';
      item.innerHTML =
        '<div class="flex items-center justify-between gap-2 text-xs">' +
          '<span class="font-bold text-slate-900 truncate">' + escapeHtml(cat) + '</span>' +
          '<div class="flex items-center gap-1.5 shrink-0 font-mono tabular-nums">' +
            '<span class="font-bold text-amber-800">' + hrs.toFixed(1) + 'h</span>' +
            '<button type="button" onclick="setCategoryTargetHours(\'' + safeCatArg + '\', ' + hrs + ')" class="text-[10px] text-slate-500 hover:text-slate-900 underline" title="目標時間を変更">/ 目標 ' + targetHrs + 'h</button>' +
          '</div>' +
        '</div>' +
        '<div class="w-full bg-slate-200 h-1.5 rounded-full overflow-hidden">' +
          '<div class="bg-amber-500 h-full rounded-full transition-all" style="width:' + pct + '%"></div>' +
        '</div>';
      area.appendChild(item);
    });
  }

  // ==========================================
  // 3-B. 週次振り返りレポート自動生成
  // ==========================================
  function renderWeeklyAutoReport() {
    var preview = document.getElementById('weeklyAutoReportPreview');
    if (!preview || typeof currentWeekStartDate === 'undefined') return;

    var start = new Date(currentWeekStartDate);
    var end = new Date(start);
    end.setDate(end.getDate() + 6);
    var rangeTitle = formatDateLocal(start) + ' 〜 ' + formatDateLocal(end);
    var dayLabels = ['月', '火', '水', '木', '金', '土', '日'];

    var workHoursSum = 0, overHoursSum = 0;
    var scoreSum = 0, scoreCnt = 0, condSum = 0, condCnt = 0, sleepSum = 0, sleepCnt = 0, stepSum = 0, stepCnt = 0;
    var keeps = [], problems = [], insights = [], tries = [];

    for (var i = 0; i < 7; i++) {
      var d = new Date(start);
      d.setDate(d.getDate() + i);
      var ds = formatDateLocal(d);
      var shortD = (d.getMonth() + 1) + '/' + d.getDate() + '(' + dayLabels[i] + ')';
      var w = db.workLogs.find(function(l) { return l.date === ds; });
      var p = db.privateLogs.find(function(l) { return l.date === ds; });

      if (w) {
        workHoursSum += Number(w.workHours || 0);
        overHoursSum += Number(w.overtimeHours || 0);
        if (w.growthScore) { scoreSum += Number(w.growthScore); scoreCnt++; }
        if (w.condition) { condSum += Number(w.condition); condCnt++; }
        if (w.reportKeep && w.reportKeep.trim()) keeps.push(shortD + ': ' + w.reportKeep.trim());
        if (w.reportProblem && w.reportProblem.trim()) problems.push(shortD + ': ' + w.reportProblem.trim());
        if (w.reportInsight && w.reportInsight.trim()) insights.push(shortD + ': ' + w.reportInsight.trim());
        if (w.reportTry && w.reportTry.trim()) tries.push(shortD + ': ' + w.reportTry.trim());
      }
      var slp = computeSleepForDate(ds).sleepHours;
      var usedSlp = slp !== null ? slp : ((p && p.sleepHours) ? Number(p.sleepHours) : ((w && w.sleepHours) ? Number(w.sleepHours) : null));
      if (usedSlp) { sleepSum += usedSlp; sleepCnt++; }

      var stp = getPrivateSteps(p);
      if (stp !== '') { stepSum += Number(stp); stepCnt++; }
    }

    var avgScore = scoreCnt > 0 ? '★' + (scoreSum / scoreCnt).toFixed(1) : '-';
    var avgCond = condCnt > 0 ? (condSum / condCnt).toFixed(1) : '-';
    var avgSleep = sleepCnt > 0 ? (sleepSum / sleepCnt).toFixed(1) + 'h' : '-';
    var avgSteps = stepCnt > 0 ? Math.round(stepSum / stepCnt).toLocaleString() + '歩' : '-';

    var mdLines = [
      '## 週次振り返りレポート (' + rangeTitle + ')',
      '- **総実働 / 残業**: ' + workHoursSum.toFixed(1) + 'h / ' + overHoursSum.toFixed(1) + 'h',
      '- **平均評価 / 体調**: ' + avgScore + ' / ' + avgCond,
      '- **平均睡眠 / 歩数**: ' + avgSleep + ' / ' + avgSteps,
      '',
      '### 🏆 Keep（うまくいったこと）',
      keeps.length > 0 ? keeps.map(function(x) { return '- ' + x; }).join('\n') : '- （記録なし）',
      '',
      '### ⚠️ Problem（課題・ボトルネック）',
      problems.length > 0 ? problems.map(function(x) { return '- ' + x; }).join('\n') : '- （記録なし）',
      '',
      '### 💡 Insight（得られた知見・学び）',
      insights.length > 0 ? insights.map(function(x) { return '- ' + x; }).join('\n') : '- （記録なし）',
      '',
      '### 🎯 Try（次週のアクション）',
      tries.length > 0 ? tries.map(function(x) { return '- ' + x; }).join('\n') : '- （記録なし）'
    ];
    latestWeeklyMarkdownText = mdLines.join('\n');

    function renderListBlock(title, badgeCls, arr) {
      if (arr.length === 0) return '';
      return '<div class="space-y-0.5">' +
        '<span class="inline-block text-[9px] font-bold px-1.5 py-0.2 rounded ' + badgeCls + '">' + title + '</span>' +
        '<div class="text-[11px] text-slate-700 whitespace-pre-wrap pl-1">' + escapeHtml(arr.join('\n')) + '</div>' +
      '</div>';
    }

    var bodyBlocks = [
      renderListBlock('🏆 KEEP', 'bg-emerald-100 text-emerald-900', keeps),
      renderListBlock('⚠️ PROBLEM', 'bg-rose-100 text-rose-900', problems),
      renderListBlock('💡 INSIGHT', 'bg-indigo-100 text-indigo-900', insights),
      renderListBlock('🎯 TRY', 'bg-amber-100 text-amber-900', tries)
    ].filter(Boolean).join('');

    preview.innerHTML =
      '<div class="flex items-center justify-between text-[10px] font-mono text-slate-500 border-b border-slate-200/70 pb-1">' +
        '<span>期間: ' + rangeTitle + '</span>' +
        '<span>実働 ' + workHoursSum.toFixed(1) + 'h (残業 ' + overHoursSum.toFixed(1) + 'h)</span>' +
      '</div>' +
      (bodyBlocks || '<div class="text-[10px] text-slate-400 py-1">この週の振り返り（KPT）が記入されると、ここに1週間分の要約が自動生成されます。</div>');
  }

  function copyWeeklyReportMarkdown() {
    if (!latestWeeklyMarkdownText) return;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(latestWeeklyMarkdownText).then(function() {
        showToast('週次レポートをクリップボードにコピーしました！');
      }).catch(function() {
        fallbackCopyText(latestWeeklyMarkdownText);
      });
    } else {
      fallbackCopyText(latestWeeklyMarkdownText);
    }
  }

  function fallbackCopyText(text) {
    var ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    try {
      document.execCommand('copy');
      showToast('週次レポートをコピーしました！');
    } catch (e) {
      showToast('コピーに失敗しました', true);
    }
    document.body.removeChild(ta);
  }

  mountKnowledgeModules();

  App.on('view:changed:analytics', function() {
    renderPinnedPlaybook();
    renderKnowledgeSearchResults();
    renderCumulativeInvestment();
  });

  App.on('view:changed:analytics', function() {
    setTimeout(renderWeeklyAutoReport, 20);
  });

  App.on('data:loaded', function() {
    if (typeof currentView !== 'undefined' && currentView === 'analytics') {
      renderPinnedPlaybook();
      renderKnowledgeSearchResults();
      renderCumulativeInvestment();
    }
    if (typeof currentView !== 'undefined' && currentView === 'weekly') {
      renderWeeklyAutoReport();
    }
  });
</script>
